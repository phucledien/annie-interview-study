owned a catalogue, taxonomy, search-quality feature or AI-generated product feature. Your closest connection is &lt;strong&gt;maintaining project and dataset knowledge with reviewers&lt;/strong&gt;, supported by your CV’s knowledge-library, document-management, API/data-mapping, workshop and mock-up experience.&lt;/p&gt;&lt;ol class=&quot;interview-strip&quot;&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;📒&lt;/span&gt;&lt;strong&gt;What you already know&lt;/strong&gt;&lt;p&gt;People need clear, current information about data and business concepts.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;📚&lt;/span&gt;&lt;strong&gt;What the catalogue adds&lt;/strong&gt;&lt;p&gt;Many tools and datasets need consistent labels, review states and ways to find them.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🔍&lt;/span&gt;&lt;strong&gt;What you would learn&lt;/strong&gt;&lt;p&gt;How to test findability, govern categories and evaluate AI suggestions.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;strong&gt;Your answer pattern:&lt;/strong&gt; “I have not owned X directly. My closest experience is Y. The comparable problem was Z. For this catalogue, I would apply it by doing A, then check B.”&lt;/p&gt;&lt;p&gt;Use the project’s real name in the interview. The public guide keeps employer and project names generic. Numbers, time splits and specific past decisions in square brackets still need your own facts.&lt;/p&gt;&lt;/div&gt;&lt;div id=&quot;day11-map&quot; class=&quot;interview-map&quot;&gt;&lt;h3&gt;🗺️ What your guide already covers—and what to prepare now&lt;/h3&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Interview questions&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Existing lessons&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;What Day 11 adds&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;1–2 · Career and closest product&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;7&quot;&gt;Review Day 7&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;9&quot;&gt;Review Day 9&lt;/button&gt;&lt;/td&gt;&lt;td&gt;A truthful career outline and a bridge from your knowledge-library work.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 · Taxonomy and metadata&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;9&quot;&gt;Review Day 9&lt;/button&gt;&lt;/td&gt;&lt;td&gt;A before/after example, required fields, exceptions and a small entity map.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;4–5 · Discovery and lifecycle&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;10&quot;&gt;Review Day 10&lt;/button&gt;&lt;/td&gt;&lt;td&gt;A measurable search task and approval / retirement rules.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;6–7 · AI acceptance and human review&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;10&quot;&gt;Review Day 10&lt;/button&gt;&lt;/td&gt;&lt;td&gt;A repeatable test set, illustrative pass gates and correction flow.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;8 · Catalogue options and value&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;10&quot;&gt;Review Day 10&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;12&quot;&gt;Review Day 12&lt;/button&gt;&lt;/td&gt;&lt;td&gt;A reasoned adopt/extend/build recommendation with cost and evidence.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;9–10 · Wireframes and facilitation&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;6&quot;&gt;Review Day 6&lt;/button&gt;&lt;/td&gt;&lt;td&gt;A practice sketch, designer handoff and workshop agenda.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11 · The 500-resource case&lt;/td&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;8&quot;&gt;Review Day 8&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;9&quot;&gt;Review Day 9&lt;/button&gt; &lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;10&quot;&gt;Review Day 10&lt;/button&gt;&lt;/td&gt;&lt;td&gt;A timed five-minute presentation answering all four case requirements.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;nav class=&quot;category-map&quot; aria-label=&quot;Day 11 questions&quot;&gt;&lt;a href=&quot;#day11-q1&quot;&gt;1. Career&lt;/a&gt;&lt;a href=&quot;#day11-q2&quot;&gt;2. Closest product&lt;/a&gt;&lt;a href=&quot;#day11-q3&quot;&gt;3. Classification&lt;/a&gt;&lt;a href=&quot;#day11-q4&quot;&gt;4. Search&lt;/a&gt;&lt;a href=&quot;#day11-q5&quot;&gt;5. Lifecycle&lt;/a&gt;&lt;a href=&quot;#day11-q6&quot;&gt;6. AI criteria&lt;/a&gt;&lt;a href=&quot;#day11-q7&quot;&gt;7. Human review&lt;/a&gt;&lt;a href=&quot;#day11-q8&quot;&gt;8. Options&lt;/a&gt;&lt;a href=&quot;#day11-q9&quot;&gt;9. Wireframes&lt;/a&gt;&lt;a href=&quot;#day11-q10&quot;&gt;10. Workshop&lt;/a&gt;&lt;a href=&quot;#day11-q11&quot;&gt;11. 500-item case&lt;/a&gt;&lt;/nav&gt;&lt;/div&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q1&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 1 · BA practice&lt;/p&gt;&lt;h3&gt;🪜 Your career timeline&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Take me through your jobs in order. For each one, give your title and roughly how much of your time was business analysis or product work, as opposed to development or testing.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Career evidence&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Choose one personally produced artefact per job. Separate BA analysis, development, test execution and delivery facilitation before estimating time.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Associate BA requirements/mock-ups → Senior Technical BA integration, workshops and coordination. Verify your percentages; the CV alone cannot supply them.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;They are checking:&lt;/strong&gt; how much hands-on BA/product experience you have, and whether technical skills are being mistaken for a developer role.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Order from your CV&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Work to talk about&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;1 · Associate Business Analyst&lt;br&gt;Jan 2019–Mar 2021 · software services&lt;/td&gt;&lt;td&gt;Requirements, user stories, functional specifications, mock-ups, process/workflow and data models; document-management and hiring-related projects.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2 · Senior Technical Business Analyst&lt;br&gt;Apr 2021–present · banking&lt;/td&gt;&lt;td&gt;Requirements and delivery across two Agile teams, backlog preparation, workshops, API/data mapping, UAT coordination and knowledge sharing.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Opening answer · supported outline, with missing facts marked&lt;/p&gt;&lt;blockquote&gt;“I started as an Associate Business Analyst in software services in January 2019. I worked with clients and delivery teams on requirements, user stories, mock-ups and models. From April 2021, I moved into a Senior Technical Business Analyst role in banking, with more complex integration analysis, stakeholder coordination and Agile delivery responsibilities. My work also included maintaining shared domain knowledge. I would describe each role’s time split as [your honest approximate percentages], rather than infer the split from my job title.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Prepare the percentages before the interview&lt;/summary&gt;&lt;div&gt;&lt;p&gt;For &lt;strong&gt;each job&lt;/strong&gt;, estimate a typical period, not your busiest week:&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Bucket&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Examples&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;BA / product&lt;/td&gt;&lt;td&gt;Discovery, requirements, models, backlog analysis and business validation.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hands-on development&lt;/td&gt;&lt;td&gt;Writing production code—not reviewing an API contract.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Hands-on testing&lt;/td&gt;&lt;td&gt;Executing tests or writing automated tests. Distinguish this from coordinating UAT.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Other / delivery facilitation&lt;/td&gt;&lt;td&gt;Scrum facilitation, coordination and administration; explain where you count these.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Speaking template:&lt;/strong&gt; “Roughly [A]% was BA/product work, [B]% development, [C]% hands-on testing, and [D]% other delivery work. This is an estimate for [period]; the split varied around releases.” Make the buckets sum to 100% and avoid double-counting.&lt;/p&gt;&lt;p&gt;Your CV does not establish those percentages. Having Java or SQL skills does not prove that you spent time as a developer. Do not guess an attractive split.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Spend about a minute per job, then explain how your scope grew. Be ready to name one artefact you personally produced in each role.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q2&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 2 · BA practice&lt;/p&gt;&lt;h3&gt;📚 The closest product in your experience&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Name the marketplace, registry, repository, data catalogue or similar product where you had the most direct responsibility. What was listed, roughly how many items, and who added them? Which decision about how content was classified, described, listed or found was yours?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Catalogue product&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Define the actual item and user. Explain one content-quality decision, evidence, recommendation, approver and result. Then show how the catalogue adds search and lifecycle.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Current project knowledge library and dataset documentation with reviewers. You recommended changes; the team lead approved. Counts and a specific incident still need your facts.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Honest bridge answer&lt;/p&gt;&lt;blockquote&gt;“I have not directly owned a marketplace or formal data catalogue. My closest example is our project knowledge library and dataset documentation. The comparable responsibility was keeping knowledge current with reviewers, so colleagues could rely on the information. I also worked on document-management projects, which connects to organising and accessing content. I would explain the actual items, contributors and review process from that project, while being clear that I did not own a catalogue product.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Question they will press on&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Your preparation&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;What was listed?&lt;/td&gt;&lt;td&gt;Name the actual unit: dataset definition, business concept, mapping document or another real item. A library page is not automatically a dataset.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;How many?&lt;/td&gt;&lt;td&gt;Use a verified count or a clearly labelled rough range, with an “as of” date. If unavailable, say you do not have a reliable count.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Who added it?&lt;/td&gt;&lt;td&gt;Identify actual authors, reviewers and the person responsible for keeping it current.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What decision was yours?&lt;/td&gt;&lt;td&gt;Describe one real change you proposed or made: a template field, review trigger, naming rule or navigation choice. Separate recommendation from final approval.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Complete the answer using your real project&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Fill-in evidence sentence&lt;/p&gt;&lt;blockquote&gt;“The library contained [item type], with approximately [verified count/range] items as of [date]. [People] added items and [reviewers] checked them. I personally [specific decision or recommendation] because [observed problem]. [Decision owner] approved it, and [evidence] showed the effect.”&lt;/blockquote&gt;&lt;/div&gt;&lt;p&gt;If you maintained existing rules rather than designed them, say that. You can then add: “For a catalogue, I would extend that experience into a consistent resource card, explicit ownership and a visible review date.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Your analogy is useful because both products depend on trustworthy information. It does not establish marketplace ownership, catalogue scale or search results.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q3&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 3 · BA practice&lt;/p&gt;&lt;h3&gt;🏷️ Taxonomy, categories and metadata&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Tell me about a time you created or changed a taxonomy, category structure or metadata model. What was wrong before? Which fields became mandatory? What did you do with items that didn’t fit? Please sketch or describe the main entities and how they relate.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Classification&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Ask how users look for things → sample diverse records → separate facets and field definitions → resolve exceptions with experts → test the mapping.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; API/database mappings and data models. Choose a real disagreement about field meaning; do not present it as ownership of a formal taxonomy.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Your honest starting point&lt;/p&gt;&lt;blockquote&gt;“I have worked with data models, API mappings and shared project knowledge, but I have not yet owned a formal catalogue taxonomy. My transferable skill is agreeing what fields mean, how entities relate and who checks changes. For a catalogue, I would start with how users look for resources, test a small set of categories on real items, and review ambiguous cases with domain experts.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;ol class=&quot;interview-strip&quot;&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🗂️&lt;/span&gt;&lt;strong&gt;Taxonomy = shelves&lt;/strong&gt;&lt;p&gt;Consistent topics and their broader / narrower relationships.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🏷️&lt;/span&gt;&lt;strong&gt;Metadata = labels&lt;/strong&gt;&lt;p&gt;Name, purpose, owner, version, inputs, rights and other facts.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🕸️&lt;/span&gt;&lt;strong&gt;Data model = connections&lt;/strong&gt;&lt;p&gt;Which resource, version, source, person and review belong together.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Worked catalogue design · hypothetical, not a past achievement&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Before:&lt;/strong&gt; imagine one item says “flu”, another “influenza”, and one has no owner. Users miss relevant items and cannot judge freshness.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Change:&lt;/strong&gt; use a preferred topic label with alternative labels for search; keep resource type, health topic and analytical task as separate facets. Do not put “R package”, “influenza” and “forecasting” in one mixed category list.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Publication fields:&lt;/strong&gt; stable ID, title, resource type, useful purpose, authoritative source, version or explicit version status, accountable maintainer/contact route, reviewed topic and task, inputs/outputs, rights/access status, limitations and review record. See the case for conditional fields.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Doesn’t fit?&lt;/strong&gt; keep the original wording and mark “classification pending” internally. A curator investigates a new concept or synonym; a domain reviewer decides meaning. Cross-cutting items can have several valid tags. Do not force an incorrect label or let a permanent “Other” bucket hide the problem.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Migration:&lt;/strong&gt; map old values to new concepts, review ambiguous mappings, version the vocabulary and recheck saved filters and search results.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;entity-picture&quot; role=&quot;img&quot; aria-label=&quot;Resource has versions and source records; versions have metadata revisions, reviews and links; resources have many topic tags and contributors.&quot;&gt;&lt;div class=&quot;entity-main&quot;&gt;📦 Resource &lt;small&gt;one tool or dataset, with a stable ID&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;entity-grid&quot;&gt;&lt;div&gt;🏷️ Topic tags&lt;small&gt;many topics ↔ many resources&lt;/small&gt;&lt;/div&gt;&lt;div&gt;👥 Contributor / owner&lt;small&gt;people ↔ resources, with named roles&lt;/small&gt;&lt;/div&gt;&lt;div&gt;📑 Source records&lt;small&gt;one resource → many GitHub, CRAN or paper references&lt;/small&gt;&lt;/div&gt;&lt;div&gt;🔢 Resource version&lt;small&gt;one resource → many releases or dataset snapshots&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;entity-main&quot;&gt;Each version → metadata revisions → review decisions&lt;small&gt;Keep source evidence, reviewer, date, result and approved revision.&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;entity-main&quot;&gt;Each version → access links / distributions&lt;small&gt;A dataset may have CSV and API access; a tool may have a package and repository link.&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Make the classification decision explicit&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Take representative items and the intended user task to a domain expert. Agree what each field means, which categories fit and what a valid domain-specific output would look like. Record examples, exceptions and who validates each rule. Compare candidate structures, recommend one, obtain the agreed approval and translate it into a data dictionary and acceptance criteria.&lt;/p&gt;&lt;p&gt;Search logs can reveal vocabulary users actually type, but a failed query does not automatically mean the taxonomy is wrong. Check indexing, filters, permissions and ranking before changing categories.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;text-small&quot;&gt;This is a proposed conceptual model, not a claim of DCAT compliance. &lt;a href=&quot;https://www.w3.org/TR/skos-primer/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;W3C SKOS&lt;/a&gt; explains concept labels and relationships; &lt;a href=&quot;https://www.w3.org/TR/vocab-dcat-3/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;DCAT 3&lt;/a&gt; distinguishes resources, catalogue records and dataset distributions.&lt;/p&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; In your real knowledge-library example, identify the actual confusing field and review rule. If you did not make fields mandatory, explain the proposed design using “I would”.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q4&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 4 · BA practice&lt;/p&gt;&lt;h3&gt;🔎 Search and discovery quality&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Tell me about a time users couldn’t find what they needed. How did you find out? What did you measure, what did you change, and did the numbers improve?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Search diagnosis&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Reproduce a failed task → inspect authorised query/index evidence with engineering → classify the cause → ask an expert about relevance → test the smallest fix.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Your API/data mapping and UAT work offer a method for tracing expected versus actual behaviour. Use a real defect only if you investigated it; catalogue search is a proposed application.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Answer without inventing a search achievement&lt;/p&gt;&lt;blockquote&gt;“I have not owned a search-quality feature or measured a search improvement. My closest context is shared project and dataset knowledge. I would only describe a real findability problem if I can explain how colleagues reported it and what I personally changed. For the catalogue, I would observe epidemiologists attempting realistic tasks, identify where they fail, and compare the same success definition before and after a targeted change.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;div class=&quot;metric-card&quot;&gt;&lt;strong&gt;Primary measure: successful discovery-and-assessment rate&lt;/strong&gt;&lt;p&gt;Successful eligible tasks ÷ all attempted eligible tasks × 100.&lt;/p&gt;&lt;p&gt;A task succeeds when an epidemiologist finds at least one resource within &lt;strong&gt;5 minutes&lt;/strong&gt; and correctly explains why it fits the pre-agreed task constraints, checked against an expert-reviewed rubric.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;The five-minute limit is a proposed pilot definition to agree with users. Use tasks with at least one known suitable resource in the catalogue; track tasks with no suitable resource separately as coverage gaps. Count abandoned attempts as failures.&lt;/p&gt;&lt;/div&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;First define what “matches the user’s expectation” means&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Write a task profile before reviewing search results: user → intended decision/output → available data and its level/frequency → environment/skills → mandatory constraints. Compare the listing’s versioned facts with each requirement and mark pass, fail or unknown, with evidence.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Practice:&lt;/strong&gt; a user needs a descriptive chart from weekly district totals using local processing. A daily individual-data forecasting model is not suitable merely because it covers the same disease. Unknown deployment conditions need checking; a suitable candidate still needs a permitted trial.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Separate failure stages:&lt;/strong&gt; not found, found but unsuitable, found but impossible to assess, and selected but impossible to use. Search logs help with retrieval; observation, experts and follow-up reveal the later barriers. &lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;10&quot;&gt;Review Day 10&lt;/button&gt; contains the complete example.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Reproduce → inspect logs → diagnose → decide&lt;/summary&gt;&lt;div&gt;&lt;p&gt;With authorised platform access, reproduce the exact query, filters and permission context. With engineering, inspect request ID, result IDs/ranks, result count, latency, error state and index version using appropriately handled logs.&lt;/p&gt;&lt;p&gt;Check whether the approved item exists, is indexed, is excluded correctly by permissions, is filtered out or ranks poorly. Ask an expert which results should match. Missing content calls for curation; stale indexing calls for an engineering fix; a confirmed vocabulary mismatch may need a synonym. Select the fix from the evidence and replay representative tasks before comparing success rates.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Example:&lt;/strong&gt; “flu forecasting” fails but “influenza forecasting” finds the same approved item. Only after checking filters/indexing and confirming the meaning with an expert would you recommend a synonym mapping. A new search platform is not the default answer.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;How to investigate and show improvement&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;&lt;strong&gt;Find evidence:&lt;/strong&gt; watch users, review help requests, and inspect consented, appropriately handled query logs. Check whether failures are missing content, unfamiliar words, weak metadata, filtering or ranking.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Establish a baseline:&lt;/strong&gt; use representative users and tasks with known suitable resources. Record success, failure reason and time.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Change one thing:&lt;/strong&gt; e.g. map a synonym, improve a misleading summary, add a task filter or fix ranking. Select the change from evidence.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Compare fairly:&lt;/strong&gt; use the same task mix and constraints; counterbalance task order or use comparable groups to reduce practice effects.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Report limits:&lt;/strong&gt; show sample size, user mix and uncertainty. A small test provides a signal, not proof for every user.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;strong&gt;Made-up arithmetic example:&lt;/strong&gt; 12 of 20 tasks succeeded before (60%); 16 of 20 after (80%). That is +20 percentage points. These are teaching numbers, not your results or a guaranteed effect.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Supporting diagnostics:&lt;/strong&gt; zero-result rate, query reformulation, time to success and relevance of top results. Clicks alone do not establish that users found a suitable resource.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; If your past work has no baseline, say “I have qualitative feedback but cannot quantify the improvement.” Explain the feedback and propose a better measurement next time.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q5&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 5 · BA practice&lt;/p&gt;&lt;h3&gt;🔄 Content lifecycle and outdated items&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Give me an example of a process you defined for adding, reviewing, publishing, retiring and removing content. Who approved each step? What happened when an outdated or poor item was already being used by others?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Lifecycle&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Find the affected version and dependent users → assess risk → propose warning/migration or urgent restriction → agree approval and check the transition.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Keeping project/dataset knowledge current with reviewers. Public version migration and deprecation are additional proposed controls.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Your closest experience → a proposed extension&lt;/p&gt;&lt;blockquote&gt;“My closest experience is keeping project and dataset knowledge up to date with reviewers. I can explain the actual review and update steps I used, but I have not defined a complete catalogue publication-to-removal lifecycle. I would extend that experience by giving every resource an owner, an approved revision, a review date and explicit states, so users can see what is current and what has been withdrawn.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;ol class=&quot;interview-strip&quot;&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;✍️&lt;/span&gt;&lt;strong&gt;Draft&lt;/strong&gt;&lt;p&gt;Someone adds a resource and evidence.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;👀&lt;/span&gt;&lt;strong&gt;Review → publish&lt;/strong&gt;&lt;p&gt;Named people check and approve a particular revision.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🛠️&lt;/span&gt;&lt;strong&gt;Maintain → retire&lt;/strong&gt;&lt;p&gt;Change, warn, replace or restrict access with a recorded reason.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;State and approval table · proposed policy&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Step&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Proposed decision owner and rule&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Add → draft&lt;/td&gt;&lt;td&gt;Contributor submits; automated checks validate format, links and potential duplicates. Nothing becomes publicly approved yet.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Review&lt;/td&gt;&lt;td&gt;Curator checks completeness and provenance. Domain expert checks scientific meaning and suitability claims. Rights/privacy specialist handles flagged concerns.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Publish&lt;/td&gt;&lt;td&gt;A designated curator/publisher approves the exact reviewed revision after required checks. Reviewer comments and approval are recorded.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Update&lt;/td&gt;&lt;td&gt;Owner or source change creates a new revision. Material changes re-enter review; do not silently replace approved facts.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Retire / deprecate&lt;/td&gt;&lt;td&gt;Curator and accountable content owner assess dependencies, agree a reason and replacement, warn users and plan migration. Keep version history where permitted; set a review date and removal criteria.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Remove / restrict&lt;/td&gt;&lt;td&gt;Designated governance or incident owner authorises access removal for serious risk or policy reasons. Keep a minimal tombstone/audit trail only where permitted.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Why deprecation must come before ordinary removal&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Existing users may pin a version, cite it in research or rely on it inside a pipeline. Removing it can break reproducibility or delivery. Identify known dependants through owner knowledge, relationships, subscriptions and approved usage evidence; logs alone are incomplete.&lt;/p&gt;&lt;p&gt;If continued access is acceptable, mark the version deprecated, discourage new use, document limits and a replacement, and agree migration support and a review date. Confirm replacement compatibility and readiness before an authorised removal. Serious risks can require immediate restriction. A catalogue team controls its listing and links, not deletion of a third-party repository.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;An outdated tool is already being used: what happens?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Example:&lt;/strong&gt; a package’s old instructions no longer match its current inputs. First assess severity with the owner and domain experts. Mark the affected version clearly, show the last verified date, and remove it from default “recommended/current” results if appropriate.&lt;/p&gt;&lt;p&gt;Identify known dependants and users who saved or subscribed to the item; notify them through an agreed channel with the affected versions, reason and migration path. Unknown anonymous users cannot all be reached, so keep visible notices. Preserve a stable reference for reproducibility where safe and permitted. For a serious unsafe or unlawful item, restrict access promptly under the incident process rather than waiting for routine retirement.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Distinguish:&lt;/strong&gt; retiring a catalogue entry does not delete a package from GitHub or CRAN. A curator’s metadata review is not certification that every scientific use is valid.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Use your real dataset-review example to show ownership, review triggers and how people knew information changed. Do not claim that you designed retirement/removal if you only maintained updates.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q6&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 6 · BA practice&lt;/p&gt;&lt;h3&gt;🤖 Acceptance criteria for variable AI output&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Pick one feature whose output was generated by AI or machine learning. What were the acceptance criteria you wrote? How did you test them when the output can differ each time? What was the pass level, and what about relevance, speed and reliability?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · AI acceptance&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Ask for correct domain examples → define a rubric and critical failures → test repeated outputs and failure paths → recommend release or more work using results.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Writing acceptance criteria and coordinating UAT; AI-assisted BA work is relevant familiarity, but it is not evidence of owning a production AI feature.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;First distinguish your experience&lt;/p&gt;&lt;blockquote&gt;“I have used AI to support BA work, as described in my CV, but I have not yet owned acceptance criteria for a production AI-generated feature. My proposed example is an assistant that drafts a catalogue description and topic tags from a resource’s documentation. I would test whether the draft is supported, useful and reviewable, rather than expect exactly the same words on every run.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;In the story:&lt;/strong&gt; Pip the robot writes a label; Jo checks the label against the source before putting it on the shelf.&lt;/p&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Concrete Given–When–Then examples&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Scenario&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Proposed acceptance criterion&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Missing fact&lt;/td&gt;&lt;td&gt;Given the documentation states no licence, when a draft is generated, then the rights field is marked unknown and routed for review; it must not claim the resource is freely reusable.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Different wording&lt;/td&gt;&lt;td&gt;Given a fixed source document, when several drafts are generated, then each is evaluated for the same supported meaning and required fields; wording may differ.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Unavailable service&lt;/td&gt;&lt;td&gt;Given the AI service times out, when the contributor is drafting an item, then the system preserves entered work, shows a failure state and offers manual completion.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Human approval&lt;/td&gt;&lt;td&gt;Given an AI draft has no recorded approval, when public results are requested, then that draft is not listed as approved.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Test approach + actual sample pass levels&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;assumption&quot;&gt;All numbers below are a worked interview proposal, not standards, employer requirements or results you achieved. Agree final gates with the PO, engineers and domain/governance reviewers based on harm, cost and user needs.&lt;/p&gt;&lt;p&gt;Keep a &lt;strong&gt;held-out set of 100 representative items&lt;/strong&gt; separate from prompt tuning. Cover GitHub, CRAN and papers, different resource types, sparse/conflicting documentation, relevant languages and failure cases. Run generation three times per item: &lt;strong&gt;300 outputs&lt;/strong&gt;. Freeze source snapshots, model/prompt versions and settings.&lt;/p&gt;&lt;p&gt;Two reviewers apply a shared rubric; reconcile disagreements and involve a domain expert for scientific claims. Inspect repeated-run variation and subgroup failures, not only one average score. Use a separate load/failure test for speed and service behaviour.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Dimension&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Illustrative pilot acceptance gate&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Faithfulness / critical errors&lt;/td&gt;&lt;td&gt;No unsupported licence, access-rights or scientific-capability claim in the evaluated outputs. Any such error blocks the pilot release until investigated. Zero observed errors is not proof of zero future risk.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Usefulness / relevance&lt;/td&gt;&lt;td&gt;At least 285 of 300 outputs (95%) score 2/2 for both relevance and source support; no pre-defined source/type subgroup below 90%. Score 2 = useful and fully supported; 1 = needs substantive correction; 0 = misleading or irrelevant.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Traceability / missing information&lt;/td&gt;&lt;td&gt;Every proposed field carries a source location and generation/version record. Missing or conflicting facts are flagged, not invented. The draft cannot bypass publication review.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Speed&lt;/td&gt;&lt;td&gt;95th-percentile response time ≤5 seconds: at least 95% of measured responses arrive within 5 seconds. Agree the test payload and concurrency—for example, source text ≤10,000 characters and 5 concurrent requests. These are proposed test conditions, not known system limits.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Reliability / failure handling&lt;/td&gt;&lt;td&gt;At least 297 of 300 normal jobs complete with a usable draft within 30 seconds. All injected timeout/error cases show a clear status and permit manual completion; retry tests create no duplicate published records.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Human control&lt;/td&gt;&lt;td&gt;A curator can compare evidence, edit/reject a draft and approve a specific revision. Rejected or unreviewed AI text is absent from public results.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;The 99% normal-job completion gate is a test acceptance level, not evidence of 99% production uptime. Re-run regression tests after model, prompt, schema or source-parser changes; monitor corrections and failures after release.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;text-small&quot;&gt;&lt;a href=&quot;https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;NIST’s Generative AI Profile&lt;/a&gt; supports contextual evaluation and attention to confabulation and human oversight. The test design and thresholds here are original hypothetical examples.&lt;/p&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; If asked “What pass level did you use?”, say you have no historical production threshold to report, then give this proposal and explain how you would validate it.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q7&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 7 · BA practice&lt;/p&gt;&lt;h3&gt;🧑‍🏫 Human review and confidence&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;In that feature or another, what went to a person and what was accepted automatically? How was the confidence threshold set? When the AI was wrong, how did that get corrected, and what changed after release?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Human review&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Separate format checks from meaning → give reviewers field evidence → define approval/escalation → track corrections → validate any later automation.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Your content-review recommendation and team-lead approval flow. Explain actual roles, then add the catalogue-specific controls.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Proposed answer · consistent with the pilot&lt;/p&gt;&lt;blockquote&gt;“For the initial catalogue, automated checks would handle format validation and draft preparation. A curator would review every AI-suggested public description or category before publication, with scientific or rights questions sent to the appropriate expert. I would not use the model’s own confidence statement as a probability of correctness. We would collect reviewed examples before considering any automatic acceptance.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Automatic at launch&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Human decision at launch&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Parse source records, validate required formats, detect possible duplicates and queue drafts.&lt;/td&gt;&lt;td&gt;Confirm meaning, resolve duplicates/contradictions, check rights status and approve public metadata.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Flag changed sources, missing values and stale review dates.&lt;/td&gt;&lt;td&gt;Decide whether an update is material, an item needs a warning, or access should be restricted.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;How would a later confidence threshold be chosen?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Define one low-risk field and the cost of a wrong acceptance. Use held-out, human-labelled examples to check whether a score is calibrated: among items assigned a given score, how often are they actually correct?&lt;/p&gt;&lt;p&gt;Try candidate cut-offs and inspect &lt;strong&gt;precision of auto-accepted items&lt;/strong&gt;, coverage and subgroup error rates. Select a cut-off only if it meets an agreed error tolerance with enough evidence; route the rest to people. A raw similarity score or “I am 95% confident” from a language model is not a calibrated probability.&lt;/p&gt;&lt;p&gt;High-impact scientific claims and ambiguous rights still need the defined expert review. Keep sampling automatic decisions and stop automatic acceptance if error rates or source patterns change. For the first sprint, there is &lt;strong&gt;no AI auto-publication threshold&lt;/strong&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Correction loop after a wrong answer&lt;/summary&gt;&lt;div&gt;&lt;ol class=&quot;interview-strip&quot;&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🚩&lt;/span&gt;&lt;strong&gt;Report + contain&lt;/strong&gt;&lt;p&gt;Flag the wrong public value; hide or warn if needed.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;📝&lt;/span&gt;&lt;strong&gt;Correct + record&lt;/strong&gt;&lt;p&gt;Reviewer fixes the revision with evidence and reason; keep permitted history.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🔁&lt;/span&gt;&lt;strong&gt;Learn + retest&lt;/strong&gt;&lt;p&gt;Add a regression case, check similar items and re-evaluate affected rules.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;Reindex corrected metadata, update cached results and notify known affected users where relevant. Inspect whether the error came from a bad source, extraction, taxonomy mapping or the generation step. Change the appropriate rule or prompt only after review; a correction does not automatically retrain a model. Track correction rate, review waiting time and repeat failures.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Connect this to your real reviewer process: who checked dataset knowledge, what made a change worth reviewing, and how a corrected version reached colleagues. Then make the additional AI controls explicit.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q8&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 8 · BA practice&lt;/p&gt;&lt;h3&gt;⚖️ Adopt, extend or build the catalogue?&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;How would you decide whether to adopt a catalogue, extend an existing platform or build? What if a general AI assistant already helps people find tools, or the investment pays back slowly?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Option appraisal&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Agree mandatory needs → trial adopt/extend/build on the same tasks → compare full cost and review effort → recommend conditionally → identify what changes the decision.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Technical requirements, integration/dependency analysis and stakeholder trade-offs. Use an actual choice you supported; do not claim procurement or a full business case unless true.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;A BA recommendation, not a product-owner claim&lt;/p&gt;&lt;blockquote&gt;“I would first agree the failing user task and essential constraints. I would compare improving or extending the existing environment, adopting a suitable product and building the missing capability. I would test the same resources and tasks, include integration, curation and long-term costs, and recommend the best-supported option with assumptions. The PO would decide scope and investment through the agreed governance.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Question to settle&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Evidence → decision&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Is there a distinctive problem?&lt;/td&gt;&lt;td&gt;Observe discovery and assessment using the current route and a general AI assistant. If existing options already meet the need, avoid building an unnecessary duplicate.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Which option meets essentials?&lt;/td&gt;&lt;td&gt;Trial source links, identity/version handling, metadata review, access, search and export. Mandatory constraints are gates, not points that attractive features can outweigh.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What costs continue?&lt;/td&gt;&lt;td&gt;Include migration, integration, licences/hosting, review staff, updates, support and exit. An open-source option is not automatically free to operate.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Why is payback slow?&lt;/td&gt;&lt;td&gt;Check setup cost, adoption assumptions and continuing curation. Compare a smaller pilot and sensitivity ranges; public-health value also includes quality and timely response.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What happens next?&lt;/td&gt;&lt;td&gt;Record recommendation, alternatives, uncertainty, owner and go/revise/stop evidence. Validate with experts, engineering and design before committing.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Use a real integration or requirements trade-off from your current project to show your method. Say explicitly if you have not owned a purchase or catalogue investment decision. Day 12 F contains the cost and payback example.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q9&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 9 · BA practice&lt;/p&gt;&lt;h3&gt;✏️ Wireframes and designer handoff&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Please show or describe a low-fidelity wireframe you made yourself. What did it change in the requirement? How do you brief a designer, and where do you leave the decisions to them?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Design collaboration&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Clarify the user decision → sketch fields, flow and states → brief the designer → test alternatives with users → update rules and acceptance criteria.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Software-services mock-ups, process flows and specifications. Bring one screen you personally drew and the real requirement it clarified.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Use the mock-up experience in your CV&lt;/p&gt;&lt;blockquote&gt;“In [actual project], I made a low-fidelity mock-up of [screen or journey] to check [uncertainty]. Walking through it with [users/team] exposed [real missing rule, field or state]. I updated [requirement or criterion] and confirmed it with [decision owner]. I briefed the designer on the user goal, evidence, content, constraints and edge cases, while leaving visual and interaction exploration to their expertise through collaboration.”&lt;/blockquote&gt;&lt;/div&gt;
&lt;div class=&quot;wireframe&quot; aria-label=&quot;Hypothetical low-fidelity catalogue search and detail wireframe&quot;&gt;&lt;p class=&quot;wireframe-title&quot;&gt;✏️ PAPER SKETCH · search → assess&lt;/p&gt;&lt;div class=&quot;wire-search&quot;&gt;Search: respiratory forecasting __________________&lt;/div&gt;&lt;div class=&quot;wire-grid&quot;&gt;&lt;div class=&quot;wire-box&quot;&gt;&lt;strong&gt;Filters&lt;/strong&gt;&lt;p&gt;Type: tool / dataset&lt;br&gt;Task: forecasting&lt;br&gt;Topic: respiratory&lt;br&gt;Language: R&lt;/p&gt;&lt;small&gt;Clear filters&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;wire-box&quot;&gt;&lt;strong&gt;Result card&lt;/strong&gt;&lt;p&gt;Tool title · reviewed version&lt;br&gt;Purpose · owner&lt;br&gt;Last reviewed · rights status&lt;br&gt;⚠ Limitations / retired badge&lt;/p&gt;&lt;small&gt;Open details →&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wire-box&quot;&gt;&lt;strong&gt;Detail panel&lt;/strong&gt;&lt;p&gt;Inputs → output · requirements · source evidence&lt;br&gt;Licence / access · limitations · review history&lt;/p&gt;&lt;small&gt;Visit source · Report a problem&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;wire-box&quot;&gt;&lt;strong&gt;No results?&lt;/strong&gt; Explain the empty state and offer clear filters / related terms.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🤝 BA + UI/UX: build the picture together&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;UX&lt;/strong&gt; concerns how well the whole journey works for users. &lt;strong&gt;UI&lt;/strong&gt; concerns the screens and controls they interact with. In this JD, you actively co-create journeys and rough wireframes; the designer brings research, interaction and visual-design expertise.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;You contribute as BA&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Work with / defer to the specialist&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;User task, evidence, data meanings, business rules, permissions and acceptance criteria.&lt;/td&gt;&lt;td&gt;Designer helps research users and test whether the journey is understandable; experts validate scientific meaning.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Low-fidelity flow/screens to expose missing requirements; examples of loading, empty, error, draft and deprecated states.&lt;/td&gt;&lt;td&gt;Designer explores interaction and visual alternatives within the project design system. Your sketch is a testable proposal, not a pixel-level order.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Required content and behaviour: source/version/status must be understandable before reuse; changes need the right approval.&lt;/td&gt;&lt;td&gt;Designer proposes how to display this accessibly. Engineers check technical feasibility. Confirm shared decisions through user evidence.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Trace findings into stories, rules and UAT; co-facilitate community sessions and review built behaviour.&lt;/td&gt;&lt;td&gt;Designer leads design craft; engineering implements; the PO resolves scope/priority trade-offs. Agree responsibilities rather than silently becoming all three.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;A concrete designer brief · the comparison screen&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;User:&lt;/strong&gt; an epidemiologist deciding between two tools. &lt;strong&gt;Task:&lt;/strong&gt; decide which accepts their weekly input data and provides the needed output.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Brief item&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Your BA input&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Evidence / problem&lt;/td&gt;&lt;td&gt;In the practice scenario, users can find tools but cannot compare their inputs or limits. Validate this with observed tasks.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Required information&lt;/td&gt;&lt;td&gt;Purpose, inputs, output, version, source evidence, rights/access, limitations, review status and maintenance status. Unknown is explicit; absence of a field is not “no restriction”.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rules and states&lt;/td&gt;&lt;td&gt;Only permitted published revisions appear; show version-specific deprecation; cover one result, no result, incomplete metadata, loading and service failure.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Designer’s question&lt;/td&gt;&lt;td&gt;“Could you explore a side-by-side view and a simpler detail flow, using the project design system, so users can understand these differences?”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Validation&lt;/td&gt;&lt;td&gt;Ask representative users to choose a suitable resource and explain why. Check correctness with experts and record confusion; do not ask only which screen looks nicer.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Acceptance example&lt;/td&gt;&lt;td&gt;Given one tool needs daily data and another accepts weekly data, when a user compares them, then the required input frequency and the evidence/unknown status are available for both.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;If the designer proposes hiding a warning:&lt;/strong&gt; explain the decision risk and evidence, agree the required visibility, and let them propose an accessible treatment. If scope or usability trade-offs remain, test alternatives and bring the evidence to the decision owner.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;My scope limitation · a confident way to say it&lt;/summary&gt;&lt;div&gt;&lt;blockquote&gt;“I create low-fidelity wireframes to clarify requirements and work with the designer on journeys and user validation. I specify the information, rules, permissions and edge cases the design must support. I rely on the designer for interaction and visual craft within the design system, and engineering for implementation. I stay involved through review and UAT so the agreed behaviour survives the handoff.”&lt;/blockquote&gt;&lt;p&gt;Avoid saying “design is outside my scope”: Output 6 explicitly includes your contribution to wireframes. Also avoid promising polished UI design, independent scientific validation or production frontend coding unless you can demonstrate that experience.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;assumption&quot;&gt;The sketch above was made for this guide. It is a rehearsal example, not evidence that you personally designed it in a past job. Recreate or describe your own real mock-up for the interview.&lt;/p&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What this practice sketch can reveal&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Suppose reviewers notice that results hide an item’s retired status. The requirement changes from “show search results” to “show lifecycle status on each result, and exclude retired items by default while allowing a deliberate archive view.” That becomes a testable rule to agree with the PO.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Give the designer&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Collaborate on / leave room for&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;User, task, findings, main journey and information hierarchy needs.&lt;/td&gt;&lt;td&gt;Visual treatment, spacing, typography, interaction alternatives and accessible components.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Required content, business rules, permissions, empty/error states and success criteria.&lt;/td&gt;&lt;td&gt;The best layout and interaction for meeting those needs; test alternatives together.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sketch assumptions and unresolved questions.&lt;/td&gt;&lt;td&gt;Challenge the sketch. A wireframe is a discussion tool, not a fixed instruction to copy.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Be precise about what you drew yourself versus what a designer produced. Use an anonymised or permitted artefact; describing the flow is enough when you cannot share it.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q10&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 10 · BA practice&lt;/p&gt;&lt;h3&gt;🤝 A workshop you designed&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Tell me about a workshop, hackathon or similar session you designed. Who took part, what format did you use and why? What came out of it, and what changed in the product?&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Workshop&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Name the decision → invite people with the needed evidence → use concrete examples → record agreements and unresolved points → change the specification and validate it.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Your banking requirements workshops. A real workshop is enough; do not rename it a hackathon.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;answer-box&quot;&gt;&lt;p class=&quot;answer-label&quot;&gt;Answer from your requirements-workshop experience&lt;/p&gt;&lt;blockquote&gt;“I designed a workshop to resolve [specific decision]. I invited [actual roles] because they held the user, business and technical knowledge needed. Beforehand I shared [context/examples]. In the session I used [format] to compare real scenarios, surface disagreements and agree [decision]. Afterwards I recorded owners and updated [model, backlog or acceptance criteria]. The product changed by [actual change], and we checked it through [evidence].”&lt;/blockquote&gt;&lt;/div&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;A 60-minute catalogue workshop you could run&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Purpose:&lt;/strong&gt; decide the smallest useful resource card and who must review it. Participants: epidemiologist/end user, contributor, curator, BA, PO, designer and engineer; include a rights/domain specialist when the examples need them.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Time&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Format and reason&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;0–5 min&lt;/td&gt;&lt;td&gt;Agree the user task and decision to make; avoid an unfocused brainstorm.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5–15 min&lt;/td&gt;&lt;td&gt;Walk through three real resource examples, including a difficult one. Make language differences visible.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15–30 min&lt;/td&gt;&lt;td&gt;Quietly sort fields into “needed to assess”, “useful later” and “unclear”; compare reasoning so quieter participants contribute.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;30–45 min&lt;/td&gt;&lt;td&gt;Map review and publication decisions; test missing licence, duplicate source and retired-version cases.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;45–55 min&lt;/td&gt;&lt;td&gt;Agree a small card and record unresolved issues, owners and decision deadlines. The accountable owner decides unresolved priority trade-offs.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;55–60 min&lt;/td&gt;&lt;td&gt;Read back decisions and explain how the team will validate the resulting prototype.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Outputs:&lt;/strong&gt; agreed field definitions, a draft review flow, a wireframe, open questions and candidate stories with acceptance examples. Check that these actually change the backlog or product; attendance is not an outcome.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;answer-tip&quot;&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; A requirements workshop is a valid answer; you do not need to claim a hackathon. Explain why your format suited the decision and what changed afterwards.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;interview-question&quot; id=&quot;day11-q11&quot;&gt;&lt;p class=&quot;question-number&quot;&gt;Question 11 · case practice&lt;/p&gt;&lt;h3&gt;🎓 The 500-resource catalogue case&lt;/h3&gt;&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Read the interviewer’s full question&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Epidemiologists keep rebuilding models that already exist, because they can’t find or assess them. You are launching a catalogue of 500 tools and datasets from GitHub, CRAN and published papers. In 5 minutes, tell me the minimum information an item needs before listing; who checks AI-suggested metadata and when a person must review it; the one measure that tells you discovery is working; and what goes into your first sprint. Timing: 2 minutes to think, 5 to present, 3 for questions.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;thinking-card&quot;&gt;&lt;h4&gt;🧭 How I would reason · Case recommendation&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Decision path:&lt;/strong&gt; Clarify the task and 500-entry assumption → design the smallest useful card/review journey → compare options → propose a feasible increment → check task success.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;My similar experience:&lt;/strong&gt; Combine your reviewed knowledge documentation, data mapping, workshops, mock-ups and UAT. The end-to-end catalogue proposal is new, not a claimed past project.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Remember four cards:&lt;/strong&gt; LABEL → CHECK → FIND → BUILD.&lt;/p&gt;&lt;ol class=&quot;interview-strip&quot;&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🏷️&lt;/span&gt;&lt;strong&gt;Label the resource&lt;/strong&gt;&lt;p&gt;Enough evidence to identify it and assess fit.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🧑‍🏫&lt;/span&gt;&lt;strong&gt;Check the label&lt;/strong&gt;&lt;p&gt;AI drafts; named reviewers approve meaning.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span aria-hidden=&quot;true&quot;&gt;🔎&lt;/span&gt;&lt;strong&gt;Prove discovery&lt;/strong&gt;&lt;p&gt;Can a user find and assess a suitable resource?&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;div class=&quot;case-build&quot;&gt;🧱 &lt;strong&gt;Build one whole journey first:&lt;/strong&gt; source → draft → review → publish → find → assess.&lt;/div&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your 2-minute thinking plan&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;0:00–0:30:&lt;/strong&gt; name the first user and task. Ask whether the 500 entries are candidates or already reviewed resources, and clarify team capacity and Sprint length.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;0:30–1:00:&lt;/strong&gt; write “identity, purpose, use, ownership, rights, review”.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;1:00–1:30:&lt;/strong&gt; choose human approval for the pilot and one discovery metric.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;1:30–2:00:&lt;/strong&gt; sketch the end-to-end pilot and what you will defer.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;If there is no clarification opportunity, state assumptions: “I am assuming a two-week Sprint, a small cross-functional team and 500 candidate source entries. These assumptions need confirmation.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Make the user journey concrete before listing fields&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“I would ask an epidemiologist to show one real analysis they need to complete. For example: produce a chart of weekly district counts from an approved CSV, with local processing. I would use that task to choose required metadata, filters and comparison fields—not start with a long generic schema.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Journey:&lt;/strong&gt; describe the task → discover candidates → check inputs/output/constraints → compare evidence and unknowns → select a candidate → follow its versioned source/setup route → trial and give feedback. The catalogue helps discovery and assessment; it need not run the analysis itself.&lt;/p&gt;&lt;p&gt;The example is hypothetical. If the interviewer’s task is forecasting, scenario analysis or contact tracing, agree a different task profile and expert-reviewed rubric. The equipment catalogue illustrates selection from requirements, not the actual Marketplace scope.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;1 · Minimum listing information&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Required before public listing&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;What “complete” means in this proposal&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Identity + provenance&lt;/td&gt;&lt;td&gt;Stable catalogue ID; title; tool/dataset type; canonical source URL or DOI; source platform; imported/checked date. Link duplicate sources to the same resource when verified.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Purpose + classification&lt;/td&gt;&lt;td&gt;Plain purpose, intended task/user, at least one reviewed topic and task tag. AI suggestions carry evidence and remain drafts until checked.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Usability + scope&lt;/td&gt;&lt;td&gt;Inputs, outputs, limitations and requirements. Tools: language/runtime, installation or usage link. Datasets: format, access method, time/place coverage and sensitivity/access constraints where applicable.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Version + ownership&lt;/td&gt;&lt;td&gt;Version, release or snapshot reference; explicit “not versioned / not stated” only when appropriate and reviewed. Creator/maintainer and a contact route or accountable catalogue curator for follow-up.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Rights + access&lt;/td&gt;&lt;td&gt;Licence/access status and evidence link. Unknown rights are not assumed open: hold in review or, only under an agreed policy, list with an explicit “reuse rights unverified” warning.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Trust + review&lt;/td&gt;&lt;td&gt;Status, reviewer, reviewed revision, date and next review trigger. No unsupported claims that a tool is clinically validated or appropriate for every use.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;The first version is an index of resource metadata and source links, not a new host for patient-level data. Do not infer permission to redistribute code or papers. &lt;a href=&quot;https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/licensing-a-repository&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GitHub’s licence guidance&lt;/a&gt; explains why a public repository does not automatically grant reuse rights.&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://cran.r-project.org/web/packages/policies.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;CRAN&lt;/a&gt; distributes R packages. A paper is evidence about a resource and may not provide usable code or data. “500 source entries” therefore needs identity and duplicate checking before calling it “500 unique reusable resources”.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;2 · AI suggestions and mandatory human review&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Initial policy:&lt;/strong&gt; all AI-generated public descriptions, tags and semantic metadata go to a curator before publication. Automatic steps validate formats, preserve source references and queue possible duplicates; they do not certify scientific meaning.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Specialist escalation:&lt;/strong&gt; uncertain scientific claims → epidemiologist/domain expert; ambiguous licence/access/privacy → relevant governance specialist; contradictory identity/version sources → maintainer or curator investigation. Missing evidence, conflicts, novel categories and material changes always trigger review.&lt;/p&gt;&lt;p&gt;Store field-level evidence, source date, model/prompt version and reviewer decision. If AI fails, manual entry still completes the journey. No numerical confidence threshold grants automatic publication in this pilot.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;3 · One primary discovery measure&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;metric-card&quot;&gt;&lt;strong&gt;Primary measure: successful discovery-and-assessment rate&lt;/strong&gt;&lt;p&gt;Successful eligible tasks ÷ all attempted eligible tasks × 100.&lt;/p&gt;&lt;p&gt;A task succeeds when an epidemiologist finds at least one resource within &lt;strong&gt;5 minutes&lt;/strong&gt; and correctly explains why it fits the pre-agreed task constraints, checked against an expert-reviewed rubric.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;The five-minute limit is a proposed pilot definition to agree with users. Use tasks with at least one known suitable resource in the catalogue; track tasks with no suitable resource separately as coverage gaps. Count abandoned attempts as failures.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Why it fits:&lt;/strong&gt; the problem is finding &lt;em&gt;and assessing&lt;/em&gt; a reusable resource. A download or click is too weak on its own. Agree the baseline and improvement target after the pilot; do not invent a target from the number 500.&lt;/p&gt;&lt;p&gt;Later, confirm actual adoption or reuse to test whether the product reduces rebuilding. This does not change the one primary discovery measure used in the pilot.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;4 · The first sprint&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Proposed Sprint Goal:&lt;/strong&gt; “An epidemiologist can find and assess a reviewed resource for one agreed task, and a curator can maintain the evidence behind it.”&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Order&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Thin first-sprint slice and acceptance evidence&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;1 · Agree the task and pilot set&lt;/td&gt;&lt;td&gt;PO, BA and epidemiologists choose a useful discovery task and a small representative set—e.g. 20 resources across the three source types, subject to capacity. Agree the task-success rubric and baseline.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2 · Add structured draft records&lt;/td&gt;&lt;td&gt;Import source references and identifiers for the 500 candidates if feasible; normalise the pilot records and flag possible duplicates. A paper, package and repository may describe one tool, not three distinct tools.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 · Review → publish&lt;/td&gt;&lt;td&gt;Build the minimum resource card, review queue and curator approval, with history. Validate missing facts, rejected drafts and changes to approved metadata. No unreviewed draft appears as approved.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;4 · Find → assess&lt;/td&gt;&lt;td&gt;Search titles/descriptions, apply a small agreed set of filters, open a versioned detail card and follow the source. Include no-results and retired-item behaviour.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 · Observe and learn&lt;/td&gt;&lt;td&gt;Run agreed tasks with representative users, record successes/failures and inspect results. Demonstrate the entire journey; use feedback to order the next backlog.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;What waits:&lt;/strong&gt; advanced semantic search, recommendation engines, elaborate knowledge graphs and automatic AI publication. AI-assisted drafts may be a small evaluated experiment if capacity permits; manual curation is the fallback. Ingesting references for 500 items is different from reviewing and publishing all 500.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Definition of a useful pilot:&lt;/strong&gt; the agreed pilot items have approved cards; draft content stays hidden; duplicate identity is handled; search/detail and failure paths work; and the task-success measure is collected. The PO and Developers negotiate feasible scope—“20” is an illustrative candidate, not a commitment made without estimates.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your five-minute presentation · speak, do not memorise&lt;/summary&gt;&lt;div&gt;
&lt;p class=&quot;assumption&quot;&gt;This is a hypothetical proposal. The prompts and illustrative numbers are not claims about your past work. Practise the timing aloud and adapt to your speaking pace.&lt;/p&gt;
&lt;div class=&quot;timed-speech&quot;&gt;&lt;h4&gt;0:00–0:35 · Frame the problem&lt;/h4&gt;&lt;p&gt;“I would start with one epidemiologist’s task: finding an existing resource and deciding whether it can be reused. Success is not simply importing 500 links. I am assuming a two-week Sprint and treating the 500 entries as candidates, because a paper, a GitHub repository and a CRAN package may refer to the same tool. I would confirm the users, resource coverage and team capacity before fixing scope.”&lt;/p&gt;
