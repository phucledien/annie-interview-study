&lt;p&gt;&lt;strong&gt;Five Whys&lt;/strong&gt; asks successive causal questions to move beyond symptoms. Five is not a mandatory count. Check answers against evidence and allow multiple contributing causes. Source: &lt;a href=&quot;https://www.lean.org/lexicon-terms/5-whys/&quot;&gt;Lean Enterprise Institute&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Technical analysis checklist&lt;/summary&gt;&lt;div&gt;&lt;p&gt;For API and data-mapping experience, prepare to explain a specific mapping, rather than only naming tools:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Source and target fields, meanings, types, required values and transformations.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Missing or conflicting data and which system is authoritative.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Permissions, errors, timeouts, retries and duplicate requests.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What a user sees when an integration fails.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;How a business scenario is checked across the systems.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;You do not need to claim architecture ownership to explain how you clarified these behaviours with Engineering.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Worked practice example&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Hypothetical problem:&lt;/strong&gt; reopened cases appear in a queue without an owner.&lt;/p&gt;
&lt;p&gt;A state model prompts: does reopening retain the previous owner? A data model prompts: is current ownership a field or a separate assignment record? A process walkthrough prompts: who should act next? A wireframe prompts: how does the user understand the state?&lt;/p&gt;
&lt;p&gt;This is why different models can uncover different gaps. Do not create all four unless the questions warrant them.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your exercise&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Choose an actual previous-project mock-up or previous-project integration. Draw one model and list two questions it would help answer. Prepare a short workshop agenda to resolve one of them.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Question] / [Chosen model] / [Participants] / [Disagreement] / [Decision] / [Updated artefact].&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Interview questions and answer tips&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Lead question: “How do you choose an analysis technique?”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Name the uncertainty first. For unclear ownership transitions, use a state model; for confusing handoffs, use a process flow. Explain what the artefact helped people decide.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you manage conflicting stakeholders?”&lt;/strong&gt; Establish their goals and constraints, use shared evidence and criteria, then clarify who owns the decision. Consensus is useful but not always possible.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you explain a technical issue to a non-technical stakeholder?”&lt;/strong&gt; Start with the user or delivery impact, explain options, and use technical detail only where it changes the decision.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What did your data mapping actually cover?”&lt;/strong&gt; Give one field or rule, its source, transformation or validation, exception behaviour and verification.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stronger phrasing:&lt;/strong&gt; “The model exposed [specific gap]. I brought [people] together to resolve [decision], updated [artefact] and checked the interpretation through [actual method].”&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Optional extension&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Explain the same integration problem twice: once to an engineer and once to a business sponsor. Keep the facts the same; change the detail and emphasis.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can you point to a decision your model or workshop enabled?&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Related distinctions · prototypes, states and processes&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Prototype versus production increment:&lt;/strong&gt; a prototype helps test assumptions and may be disposable; a released capability needs its applicable quality conditions.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;State versus process:&lt;/strong&gt; state describes a condition; process describes activities and decisions. Both can expose missing permissions and exceptions.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your experience card · Modelling&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Where to look:&lt;/strong&gt; previous-project mock-ups or previous-project data mapping.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Prepare these facts:&lt;/strong&gt; Question, model, gap discovered and resulting change.&lt;/p&gt;
&lt;p&gt;Use a real example. Explain your own action, the reasoning and the evidence for the outcome.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;6&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day7&quot; class=&quot;chapter day7-book&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab7&quot; hidden&gt;&lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🎤 Day 7 · Your interview pocket book&lt;/h2&gt;&lt;p&gt;Remember the theory, picture the domain, then tell a true story. Start with the short summaries; open only the questions you want to rehearse.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 7 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; one story and its criteria, a simple domain explanation, and three honest interview answers.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Time&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · refresh&lt;/td&gt;&lt;td&gt;Read A: story + INVEST + criteria. Skim B: the healthcare picture.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · rehearse&lt;/td&gt;&lt;td&gt;Choose one behavioral question from C and two personal questions from D. Answer aloud before opening the examples.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · improve&lt;/td&gt;&lt;td&gt;Replace vague claims with one real action, outcome or learning.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Open the other theory reminders, rehearse your future plan and an unfamiliar-domain answer, then use the original mock interview below.&lt;/p&gt;&lt;/div&gt;&lt;nav class=&quot;category-map&quot; aria-label=&quot;Day 7 revision categories&quot;&gt;&lt;a href=&quot;#day7-theory&quot;&gt;A · BA / Agile toolbox&lt;/a&gt;&lt;a href=&quot;#day7-health&quot;&gt;B · Healthcare snapshot&lt;/a&gt;&lt;a href=&quot;#day7-stories&quot;&gt;C · Behavioral stories&lt;/a&gt;&lt;a href=&quot;#day7-personal&quot;&gt;D · About you&lt;/a&gt;&lt;/nav&gt;
&lt;div class=&quot;revision-category&quot; id=&quot;day7-theory&quot;&gt;&lt;p class=&quot;revision-kicker&quot;&gt;A · Your pocket toolbox&lt;/p&gt;&lt;h3&gt;🧰 From “please build this” to “did it help?”&lt;/h3&gt;
&lt;ol class=&quot;revision-strip&quot;&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;🔎&lt;/span&gt;&lt;strong&gt;Understand the need&lt;/strong&gt;&lt;p&gt;Who needs help, what is difficult, and why does it matter?&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;🧩&lt;/span&gt;&lt;strong&gt;Describe a small change&lt;/strong&gt;&lt;p&gt;Write a story, discuss it, and agree examples of success.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;🔁&lt;/span&gt;&lt;strong&gt;Check and learn&lt;/strong&gt;&lt;p&gt;Test the rules, try the real task, then inspect the outcome.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;div class=&quot;revision-highlight&quot;&gt;&lt;strong&gt;Say it simply:&lt;/strong&gt; “I clarify the need, write a small valuable story, agree testable criteria with the team, and check whether the change helps the user.”&lt;/div&gt;
&lt;h4&gt;US = user story. Remember WHO → WANT → WHY.&lt;/h4&gt;
&lt;p&gt;&lt;strong&gt;Template:&lt;/strong&gt; As a &lt;em&gt;[user]&lt;/em&gt;, I want &lt;em&gt;[capability]&lt;/em&gt;, so that &lt;em&gt;[benefit]&lt;/em&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Fictional library example:&lt;/strong&gt; “As a public-health analyst, I want to filter published tools by topic, so that I can find relevant tools to assess.” A story starts a conversation; the sentence alone is not a complete specification.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;INVEST check&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Ask yourself&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;I&lt;/strong&gt; · Independent&lt;/td&gt;&lt;td&gt;Can this useful slice be delivered with few dependencies? Make unavoidable dependencies visible.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;N&lt;/strong&gt; · Negotiable&lt;/td&gt;&lt;td&gt;Can we discuss the solution while keeping the need clear?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;V&lt;/strong&gt; · Valuable&lt;/td&gt;&lt;td&gt;What useful result does the user get?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;E&lt;/strong&gt; · Estimable&lt;/td&gt;&lt;td&gt;Does the team understand enough to estimate the work?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;S&lt;/strong&gt; · Small&lt;/td&gt;&lt;td&gt;Can we finish this slice within a Sprint? Split a large journey into useful slices.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;T&lt;/strong&gt; · Testable&lt;/td&gt;&lt;td&gt;Can we show whether the agreed behaviour works?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p class=&quot;text-small&quot;&gt;INVEST is a thinking checklist, not a score that guarantees a good story. Source: &lt;a href=&quot;https://xp123.com/invest-in-good-stories-and-smart-tasks/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Bill Wake’s original explanation&lt;/a&gt;.&lt;/p&gt;
&lt;h4&gt;AC = acceptance criteria. Remember SETUP → ACTION → RESULT.&lt;/h4&gt;
&lt;ol class=&quot;revision-strip&quot;&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;🎬&lt;/span&gt;&lt;strong&gt;Given&lt;/strong&gt;&lt;p&gt;The starting situation.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;👆&lt;/span&gt;&lt;strong&gt;When&lt;/strong&gt;&lt;p&gt;One action or event.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;✅&lt;/span&gt;&lt;strong&gt;Then&lt;/strong&gt;&lt;p&gt;An observable result.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;&lt;strong&gt;Normal case:&lt;/strong&gt; Given two published tools tagged “respiratory” and one tagged “water”, when I select “respiratory”, then I see only the two respiratory tools.&lt;/p&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Two more AC examples · no matches and permissions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;No matches:&lt;/strong&gt; Given no published tools have the selected topic, when I apply that filter, then I see a “No tools found” message and a way to clear the filter.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Permission:&lt;/strong&gt; Given I am a public visitor and a respiratory tool is still a draft, when I filter by “respiratory”, then that draft is absent from the results.&lt;/p&gt;&lt;p&gt;These are proposed practice rules. Confirm actual visibility rules with the product owner and relevant experts.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p&gt;&lt;strong&gt;AC versus Definition of Done:&lt;/strong&gt; AC describe this story’s expected behaviour. The Definition of Done describes the shared quality standard for the Increment. A working filter alone does not prove that all quality requirements are met.&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;Given–When–Then is useful for scenario examples; a clear checklist may suit other criteria. Neither this format nor user stories are required by Scrum. Sources: &lt;a href=&quot;https://agilealliance.org/glossary/given-when-then/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Agile Alliance&lt;/a&gt; · &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Open the other BA / PO / delivery reminders&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;When you need to…&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Remember this&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Understand a problem&lt;/td&gt;&lt;td&gt;Ask who, what, why and what evidence exists. Map &lt;strong&gt;As-is → pain point → To-be&lt;/strong&gt;; validate assumptions with users.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Choose the next work&lt;/td&gt;&lt;td&gt;&lt;strong&gt;MoSCoW:&lt;/strong&gt; Must, Should, Could, Won’t have this time. Agree the goal, timeframe and constraints before assigning labels.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Keep a solution simple&lt;/td&gt;&lt;td&gt;&lt;strong&gt;KISS:&lt;/strong&gt; keep it simple. Start with the smallest useful journey; keep necessary access, quality and safety checks.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Define success&lt;/td&gt;&lt;td&gt;&lt;strong&gt;SMART:&lt;/strong&gt; Specific, Measurable, Achievable, Relevant, Time-bound. Agree a baseline and a meaningful target.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Handle uncertainty&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Risk:&lt;/strong&gt; might happen. &lt;strong&gt;Issue:&lt;/strong&gt; happening now. Use likelihood and impact to discuss a risk’s urgency, then add an owner, response and trigger. A matrix supports judgement; it is not a precise prediction.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Keep delivery visible&lt;/td&gt;&lt;td&gt;&lt;strong&gt;RAID:&lt;/strong&gt; Risks, Assumptions, Issues, Dependencies (check your team’s naming). Record owners and next steps.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Clarify ownership&lt;/td&gt;&lt;td&gt;&lt;strong&gt;RACI:&lt;/strong&gt; Responsible does the work; Accountable owns the decision/outcome; Consulted gives input; Informed receives updates.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Check business fitness&lt;/td&gt;&lt;td&gt;&lt;strong&gt;UAT:&lt;/strong&gt; representative business users check realistic tasks against agreed needs. Trace need → story → criteria → test evidence; agree how gaps will be handled.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Show value&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Output:&lt;/strong&gt; a filter was shipped. &lt;strong&gt;Outcome:&lt;/strong&gt; users can find a suitable tool. Measure the task, not just clicks. An &lt;strong&gt;MVP&lt;/strong&gt; is a small useful version for testing an important assumption.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;Prioritisation source: &lt;a href=&quot;https://www.agilebusiness.org/resource/what-is-moscow-prioritization/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Agile Business Consortium&lt;/a&gt;. The remaining reminders recap Days 1–6; their detailed explanations and references are in those tabs.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Agile and Scrum · who does what?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Agile:&lt;/strong&gt; deliver value in small steps, work with users, learn from feedback and adapt. &lt;strong&gt;Scrum:&lt;/strong&gt; one framework for doing this.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Person&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Main focus&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;BA&lt;/td&gt;&lt;td&gt;Clarify needs, model rules and help people reach shared understanding. BA is a job title, not a separate Scrum accountability.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PO · Product Owner&lt;/td&gt;&lt;td&gt;Maximise product value and manage the Product Backlog effectively.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SM · Scrum Master&lt;/td&gt;&lt;td&gt;Establish Scrum and help the team become effective.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Developers&lt;/td&gt;&lt;td&gt;Plan and create a usable Increment; maintain quality.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PM · Project Manager&lt;/td&gt;&lt;td&gt;Coordinate delivery constraints, dependencies and risks where this role exists. PM is not a separate Scrum accountability.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Event memory:&lt;/strong&gt; Planning = agree a Sprint goal and plan. Daily Scrum = Developers inspect progress and adapt. Review = inspect the product with stakeholders. Retrospective = improve how the team works. The Sprint contains these events.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Urgent request mid-Sprint:&lt;/strong&gt; clarify the impact, discuss options with the PO and Developers, and adapt scope without endangering the Sprint Goal or lowering quality.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;Sources: &lt;a href=&quot;https://agilemanifesto.org/principles.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Agile principles&lt;/a&gt; · &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div class=&quot;revision-category&quot; id=&quot;day7-health&quot;&gt;&lt;p class=&quot;revision-kicker&quot;&gt;B · The domain in one little picture&lt;/p&gt;&lt;h3&gt;🏘️ A clinic helps a person. Public health looks after a community.&lt;/h3&gt;
&lt;div class=&quot;revision-grid&quot;&gt;&lt;div class=&quot;revision-card&quot;&gt;&lt;h4&gt;🩺 Clinical care&lt;/h4&gt;&lt;p&gt;Lina the nurse cares for one person. Think: “What care does this patient need?”&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;revision-card&quot;&gt;&lt;h4&gt;🏘️ Public health&lt;/h4&gt;&lt;p&gt;Ben’s team looks at the whole town and how to prevent harm. Think: “What is happening across the community?”&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;ol class=&quot;revision-strip&quot;&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;👀&lt;/span&gt;&lt;strong&gt;Notice a clue&lt;/strong&gt;&lt;p&gt;More children than usual are absent.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;🔍&lt;/span&gt;&lt;strong&gt;Check and understand&lt;/strong&gt;&lt;p&gt;Ben checks dates, records and possible reasons with experts.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;revision-icon&quot; aria-hidden=&quot;true&quot;&gt;🤝&lt;/span&gt;&lt;strong&gt;Support a decision&lt;/strong&gt;&lt;p&gt;Health professionals assess the evidence and decide what action is appropriate.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;p&gt;&lt;strong&gt;A clue is not proof.&lt;/strong&gt; Absences do not automatically mean an outbreak. This is a fictional memory story, not a diagnostic rule.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Word&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Child-friendly meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Epidemiology&lt;/td&gt;&lt;td&gt;The health detective’s work: study who is affected, where, when and possible causes.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Surveillance&lt;/td&gt;&lt;td&gt;Keep collecting and examining health information over time, and share it for action.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Public-health intelligence&lt;/td&gt;&lt;td&gt;Bring information together, check and interpret it to help assess threats and support decisions.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Tools marketplace&lt;/td&gt;&lt;td&gt;A library where people can discover, assess and reuse analytical resources. A “marketplace” need not involve payment.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;div class=&quot;revision-highlight&quot;&gt;&lt;strong&gt;How this connects to the JD:&lt;/strong&gt; an analyst needs a suitable tool; a contributor supplies it; a curator checks the listing. The BA helps define their journeys, clear information, review rules and testable behaviour. WHO’s Collaboratory connects people and supports reusable analytical tools for epidemic and pandemic intelligence.&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Five things to ask about a tool:&lt;/strong&gt; What does it do? What data goes in? What comes out? Who maintains it? What limits or permissions apply? AI may help find or summarise tools, but its claims still need checking.&lt;/p&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Practise a 30-second domain answer&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“My understanding is that this project helps public-health professionals find and assess analytical resources. I picture it as a tools library: contributors provide resources, users assess whether they fit their task, and curators help maintain trustworthy listings. As a BA, I would clarify these journeys, data and review rules with domain experts, then turn them into small, testable requirements.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Keep “my understanding” until the project team confirms the scope. Use Days 8–10 for the deeper examples.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;text-small&quot;&gt;Domain sources: &lt;a href=&quot;https://www.cdc.gov/training-publichealth101/php/training/introduction-to-public-health.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;CDC Public Health 101&lt;/a&gt; · &lt;a href=&quot;https://www.who.int/initiatives/phicompetencies/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO public-health intelligence&lt;/a&gt; · &lt;a href=&quot;https://www.who.int/initiatives/collaboratory&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Collaboratory&lt;/a&gt;. The fictional library roles illustrate the JD; they are not a claim about WHO’s implemented workflow.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;revision-category&quot; id=&quot;day7-stories&quot;&gt;&lt;p class=&quot;revision-kicker&quot;&gt;C · Show what you actually did&lt;/p&gt;&lt;h3&gt;🎤 A behavioral answer is a small story with evidence&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;“Tell me about a time…”&lt;/strong&gt; asks for a real past example. Use &lt;strong&gt;STAR + one learning sentence&lt;/strong&gt;: Situation, Task, Action, Result, Learning. Spend most of your answer on your action and why you chose it.&lt;/p&gt;
&lt;svg class=&quot;drawing&quot; data-scene=&quot;answer&quot; role=&quot;img&quot; aria-label=&quot;An approximately two-minute answer: situation, responsibility, action and reasoning, result, learning&quot;&gt;&lt;/svg&gt;
&lt;p&gt;&lt;strong&gt;“What would you do if…?”&lt;/strong&gt; asks for a proposed approach. Clarify the situation, explain options, choose a next step and say how you would check it. Use “I would”; do not turn a hypothetical into a claimed achievement.&lt;/p&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Worked STAR story · two stakeholders disagree&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Fictional worked example · learn the structure, replace every fact with your own&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Part&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Example sentence&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Situation&lt;/td&gt;&lt;td&gt;“On a catalogue release, one stakeholder wanted search first and another wanted a submission dashboard.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Task&lt;/td&gt;&lt;td&gt;“As the BA, I needed to make the trade-off clear so the PO could decide.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Action&lt;/td&gt;&lt;td&gt;“I interviewed both stakeholders about their goals, mapped the first user journey and checked dependencies with the team. I compared the options against the release goal, recommended a basic search journey first, and recorded the PO’s decision and the deferred scope.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Result&lt;/td&gt;&lt;td&gt;“The PO agreed the release boundary, and the team used the agreed scope in planning.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Learning&lt;/td&gt;&lt;td&gt;“I learned to agree decision criteria before debating features.”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Why this works:&lt;/strong&gt; it separates your recommendation from the PO’s decision, explains the reasoning, and gives an observable result without invented percentages.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Likely follow-up:&lt;/strong&gt; “What evidence changed the decision?” Prepare the actual interview finding, dependency or comparison from your own project.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Behavioral question · tell me about a mistake&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“In [project], I assumed [rule] without checking [exception]. I discovered the gap when [real event]. I took responsibility, checked the impact with [people], corrected [requirement or model] and agreed the necessary changes with the team. The result was [verified outcome]. Since then, I use [specific check] to catch similar assumptions earlier.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Choose a real, bounded mistake. Explain the repair and what you changed; avoid blaming a stakeholder or pretending the mistake had no consequences.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Behavioral question · how did you handle pressure?&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“When [deadline or dependency problem] arose, I separated the essential outcome from work that could wait. I checked the impact and options with the team, made the risk visible early, and asked [decision owner] to agree the trade-off. I then tracked [specific next step]. We achieved [actual outcome], while [honest limitation] remained. I learned [lesson].”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Show how you protected quality and communicated trade-offs. Long hours alone do not explain good judgement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Behavioral question · how do you respond to feedback?&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“A colleague told me that [specific part of my approach] made their work harder. I asked for an example, checked that I understood the impact, and tried [small change]. I followed up after [real period] and learned [observed result]. I now [habit], while still checking whether it suits the team.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Use a concrete change in behaviour and evidence from the follow-up. You can acknowledge that an improvement is still in progress.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Vague answer&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Better evidence&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;“I communicate well.”&lt;/td&gt;&lt;td&gt;Name the disagreement, the question you asked and the decision it enabled.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“We delivered successfully.”&lt;/td&gt;&lt;td&gt;Explain your own contribution, the agreed outcome and how it was checked.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“It improved by 30%.”&lt;/td&gt;&lt;td&gt;Use a number only if you can explain the baseline, period and measurement. A verified qualitative result is useful too.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p class=&quot;text-small&quot;&gt;Answer-structure reference: &lt;a href=&quot;https://www.reading.ac.uk/essentials/Careers/Applications-and-interviews/Interviews-and-assessment/Interviews/Questions&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;University of Reading careers guidance&lt;/a&gt;. The examples and practice prompts here were written for this guide.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;revision-category&quot; id=&quot;day7-personal&quot;&gt;&lt;p class=&quot;revision-kicker&quot;&gt;D · Help them understand you&lt;/p&gt;&lt;h3&gt;🌱 Your strengths, growth areas and future direction&lt;/h3&gt;
&lt;p&gt;“Pros and cons” usually becomes &lt;strong&gt;strengths and areas for improvement&lt;/strong&gt; in an interview. Choose answers that are true for you. These are starting points, not a script to memorise.&lt;/p&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Tell me about yourself&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“I am a [role] with experience in [relevant work]. I am strongest at [skill], which I used when [brief real example and outcome]. I also enjoy [relevant collaboration]. This role interests me because it combines clear requirements, product thinking and a public-health purpose. I would bring [proven contribution] while building my domain knowledge.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Aim for about one minute: present role → relevant evidence → why this role. Avoid retelling your entire CV.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What are your strengths?&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“One of my strengths is turning unclear requests into shared understanding. In [real project], different people meant different things by [term or rule]. I used [workshop, model or examples] to agree [specific decision], which helped [verified outcome]. That strength would help here when analysts, contributors and curators describe different needs.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Pick one or two strengths the JD needs. Match each to a real example; replace this choice if it does not describe you.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What is your weakness or area for improvement?&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“I sometimes spend too long refining a document before asking for feedback. That can delay discovering a wrong assumption. I am working on it by timeboxing the first draft, highlighting open questions and sharing it earlier with the right reviewers. In [real recent example], this helped [observed improvement]. I still check myself when the topic is unfamiliar.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Use this only if true. Choose a real work habit, explain its effect and show your improvement method. Avoid a disguised boast such as “I care too much”. Do not hide a material skill gap; explain how you manage and address it.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What is your future plan? Where do you see yourself in 3–5 years?&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“Over the next year, I want to understand this domain and become a dependable BA who can take a problem from discovery through validation. Over the next three to five years, I would like to lead more complex discovery, mentor other analysts and strengthen my product decision-making. I would grow through delivery, feedback and domain learning, with progress shown by useful outcomes for users.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Adjust the direction to your real goals, whether senior BA, PO or another path. Connect learning → contribution → greater responsibility; avoid promising a title or promotion date.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Why this role? Why should we hire you?&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“This role appeals to me because it brings together user discovery, clear specifications and collaboration with design and engineering. I can contribute [two proven skills], demonstrated by [one short real example]. The public-health tools context gives me a new domain to learn. I would bring a structured BA approach and work closely with experts to check assumptions.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Name something specific from the JD and support your fit with evidence. Interest in healthcare is helpful; it does not replace relevant delivery experience.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;You are new to public health. How would you learn?&lt;/summary&gt;&lt;div&gt;&lt;p class=&quot;sample-label&quot;&gt;Sample wording · adapt to your real experience&lt;/p&gt;&lt;blockquote&gt;“I am new to the domain, so I would start by mapping the users, their decisions and key terms. I would observe a real workflow, read the agreed source material and check my understanding with domain experts. I would bring back a simple process map and one example story for feedback. That lets me contribute through analysis while making my knowledge gaps visible.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Make it stronger:&lt;/strong&gt; Be honest about your starting point. Explain how you will validate understanding and produce something useful, not just list courses.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What would you do in your first 30 / 60 / 90 days?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;A discussion plan, subject to the team’s priorities:&lt;/strong&gt;&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Period&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;A useful focus&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;First 30 days&lt;/td&gt;&lt;td&gt;Meet users and stakeholders, understand goals and constraints, review existing evidence, map one journey and agree the biggest uncertainty.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Days 31–60&lt;/td&gt;&lt;td&gt;Work with the team on one small priority: refine stories and criteria, test a prototype or assumption, and support validation.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Days 61–90&lt;/td&gt;&lt;td&gt;Review what users learned or achieved, improve the next backlog decisions and take on more scope with feedback.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Tip:&lt;/strong&gt; ask what is already underway before prescribing a plan. Avoid guaranteeing a release date or metric before understanding the constraints.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h4&gt;Before you answer: pause → answer directly → give evidence → connect to the role.&lt;/h4&gt;
&lt;ul&gt;&lt;li&gt;Use short sentences. Explain a theory in plain language before naming the acronym.&lt;/li&gt;&lt;li&gt;For a past example, use “I” for your contribution and “we” for the team result.&lt;/li&gt;&lt;li&gt;If the question is unclear, ask which aspect they want. If you do not know, say what you know and how you would verify the rest.&lt;/li&gt;&lt;li&gt;Have three real stories ready: a disagreement, a mistake and an improvement. Practise aloud, then adjust the story to the question.&lt;/li&gt;&lt;li&gt;Ask the interviewer: “What would good performance look like in the first three months?” and “How do the BA, PO and domain experts make decisions together?”&lt;/li&gt;&lt;/ul&gt;
&lt;div class=&quot;revision-highlight&quot;&gt;&lt;strong&gt;Your 5-minute finish:&lt;/strong&gt; say one strength, one growth area and your future plan aloud. Check: Is it true? Did I give evidence? Did I answer the question? Did I connect it to the role?&lt;/div&gt;
&lt;/div&gt;&lt;details class=&quot;revision-fold&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra practice · original mock interview, six experience cards and scoring&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;day-reference&quot; id=&quot;annie-notes7&quot;&gt;&lt;h3&gt;📖 Detailed study guide · Day 7&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; give clear, credible answers without memorising a script.&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;Open the part you need. These notes, worked examples and sources all belong to today’s topic.&lt;/p&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Core 30 minute rehearsal&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Use five minutes for your introduction, 15 minutes for three questions, and 10 minutes to score and revise the weakest answer. Answer aloud before checking your notes.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Introduction outline:&lt;/strong&gt; current role and relevant experience → two strengths supported by examples → connection to this BA role → what you want to contribute.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Draft to personalise:&lt;/strong&gt; “I am a [role] with [years] of experience in [domains]. My work includes [relevant contribution] and [collaboration example]. I am interested in this role because it combines product discovery, clear specifications and close work with design and engineering.”&lt;/p&gt;
&lt;p&gt;Add one specific outcome you can substantiate. Use Days 8–10 to prepare the domain transition.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Mock interview questions&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Question&lt;/th&gt;
&lt;th&gt;What a strong answer should demonstrate&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;1. Walk me through a feature from idea to production&lt;/td&gt;
&lt;td&gt;Need, evidence, your role, requirements, decisions, validation and outcome&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2. Tell me about a requirement you initially misunderstood&lt;/td&gt;
&lt;td&gt;Ownership, how it was discovered, repair and learning&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;3. How did you support two Agile teams?&lt;/td&gt;
&lt;td&gt;Coordination, dependency visibility and respect for team accountabilities&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;4. Two stakeholders want different priorities. What do you do?&lt;/td&gt;
&lt;td&gt;Shared criteria, options, decision rights and transparent trade-offs&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;5. What if UAT identifies a major gap just before release?&lt;/td&gt;
&lt;td&gt;Business impact, evidence, options, quality constraints and authorised decision&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;6. How do you write requirements for a feature you do not yet understand?&lt;/td&gt;
&lt;td&gt;Elicitation, assumptions, collaboration, small experiments and verification&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;7. What delivery measures would you use?&lt;/td&gt;
&lt;td&gt;A question each measure answers and the limits of interpretation&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;8. How did you use AI in BA work?&lt;/td&gt;
&lt;td&gt;The actual task, tool use, permitted information, human checks and observed result&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;9. What would you do in the first two weeks of this role?&lt;/td&gt;
&lt;td&gt;Understand users and goals, inspect current evidence, expose uncertainties and agree a small useful next step&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;10. What would you improve about your past approach?&lt;/td&gt;
&lt;td&gt;A concrete change grounded in learning rather than blaming others&amp;#x20;&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;For question 8, distinguish using AI to assist your work from defining requirements for an AI-powered product. Only claim either kind of experience when you have a real example.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Self scoring&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Score each dimension 0 = absent, 1 = partly clear, 2 = clear and specific. This is a personal practice rubric, not an employer&amp;#39;s scoring system.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Dimension&lt;/th&gt;
&lt;th&gt;Check&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Directness&lt;/td&gt;
&lt;td&gt;Did I answer the actual question early?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Ownership&lt;/td&gt;
&lt;td&gt;Is my contribution distinct from the team&amp;#39;s?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Reasoning&lt;/td&gt;
&lt;td&gt;Did I explain evidence, options and trade-offs?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Specificity&lt;/td&gt;
&lt;td&gt;Did I name a scenario, artefact or decision?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Evidence and learning&lt;/td&gt;
&lt;td&gt;Is the result supported, with an honest lesson?&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Revise an answer if it lacks ownership, reasoning or evidence even when the total looks good.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Optional scenario for a full hour&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Hypothetical case:&lt;/strong&gt; a new resource catalog needs search, submissions, review and publication. One engineer is shared with another team, and the sponsor wants a first release in six weeks.&lt;/p&gt;
&lt;p&gt;Ask clarifying questions before making a plan: who is the first user, what outcome matters, what exists already, what defines success, what constraints are fixed, and which assumptions are most uncertain?&lt;/p&gt;
&lt;p&gt;Then outline a minimal useful journey, priority rationale, risky dependency, story with criteria, validation approach and progress update. State what you cannot responsibly forecast until you have more evidence.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Final checklist&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; My introduction fits approximately one minute&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can explain six real examples without reading a script&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I distinguish my work from PO and Developer accountabilities&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can write a testable story with an exception&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can explain one prioritisation trade-off&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can distinguish risk issue assumption and dependency&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I have no invented results or metrics in my answers&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can state what I learned and what I would change&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Structure a two minute experience answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Use this flexible allocation:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;15 seconds:&lt;/strong&gt; the situation and why it mattered.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;15 seconds:&lt;/strong&gt; your responsibility and the constraint.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;60 seconds:&lt;/strong&gt; what you did and why, including the important decision.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;20 seconds:&lt;/strong&gt; the actual result and evidence.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;10 seconds:&lt;/strong&gt; what you learned.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;For a theory question, give a short definition and immediately apply it. For a hypothetical scenario, say what you would do; for past experience, say what you actually did.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Reusable answer scaffold:&lt;/strong&gt; “The problem was [specific problem], and I was responsible for [scope]. I first checked [evidence]. We considered [options]; I recommended [choice] because [reason]. I worked with [people] to [actions]. The result was [supported outcome]. I learned [lesson].”&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Improve weak answers&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Weak wording&lt;/th&gt;
&lt;th&gt;Better direction&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;“I gathered requirements.”&lt;/td&gt;
&lt;td&gt;Explain whose need you investigated, which ambiguity you found and how you resolved it.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I managed stakeholders.”&lt;/td&gt;
&lt;td&gt;Name the disagreement, the evidence or criteria you used and who made the decision.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I ensured quality.”&lt;/td&gt;
&lt;td&gt;Identify the specific review, acceptance condition or test gap you addressed.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I delivered on time.”&lt;/td&gt;
&lt;td&gt;Describe your contribution, dependencies and actual release evidence.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“We did everything together.”&lt;/td&gt;
&lt;td&gt;Explain your personal action while crediting the team.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I improved efficiency by 30%.”&lt;/td&gt;
&lt;td&gt;Use a number only with a reliable baseline and measurement; otherwise describe the observable result.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I followed Scrum.”&lt;/td&gt;
&lt;td&gt;Show how feedback, inspection and adaptation changed a decision.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I escalated the problem.”&lt;/td&gt;
&lt;td&gt;State the options, recommendation, decision needed and follow-through.&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Useful phrases: “The trade-off was…”; “The evidence I used was…”; “My contribution was…”; “The PO made the final priority decision…”; “We did not measure that directly, but the observable result was…”; “I have not done that exact case; my approach would be…”.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Six experience cards to fill in&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;

&lt;th&gt;CV starting point&lt;/th&gt;

&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;

&lt;p&gt;Write one real example on each card. One example may support several questions, but change the emphasis to match what was asked.&lt;/p&gt;

&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Questions you can ask the interviewer&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;
&lt;li&gt;&lt;p&gt;“How are responsibilities divided between the BA, Product Owner and delivery team?”&lt;/p&gt;

&lt;section id=&quot;annie-day8&quot; class=&quot;chapter health-book&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab8&quot; hidden&gt;
 &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🏘️ Day 8 · Public health &amp; the WHO catalogue mission&lt;/h2&gt;&lt;p&gt;Follow the town story, then connect it to WHO’s public Collaboratory material and the Marketplace JD. Category D separates confirmed context from unverified “Layer 4” wording. Category E connects eight public WHO task examples to the Marketplace.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Read the story first.&lt;/strong&gt; The highlighted lessons are your core learning. Open “Learn a little more” only when you want extra detail.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 8 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; A people map and a simple explanation of why a clue needs checking.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;Read the people/clues story, WHO context and one Category E user task; save other examples for revision.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Draw Ben, a contributor and Jo; give each a goal and a question.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “How would you learn this new domain?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
 &lt;nav class=&quot;category-map&quot; aria-label=&quot;Day 8 knowledge categories&quot;&gt;&lt;a href=&quot;#health-8-a&quot;&gt;A · People and health&lt;/a&gt;&lt;a href=&quot;#health-8-b&quot;&gt;B · Clues and checking&lt;/a&gt;&lt;a href=&quot;#health-8-c&quot;&gt;C · People using the library&lt;/a&gt;&lt;a href=&quot;#health-8-d&quot;&gt;D · WHO mission &amp; JD&lt;/a&gt;&lt;a href=&quot;#health-8-e&quot;&gt;E · WHO user tasks&lt;/a&gt;&lt;/nav&gt;
 &lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;📖&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Welcome to Maple Town.&lt;/strong&gt; Lina is a nurse. Ben is a health detective who studies patterns. Jo looks after a library of useful computer tools. We will follow the same three friends through Days 8, 9 and 10.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-8-a&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category A&lt;/p&gt;&lt;h3&gt;People and health&lt;/h3&gt;&lt;p&gt;Who are we trying to help?&lt;/p&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;health-village&quot; role=&quot;img&quot; aria-label=&quot;One person needs care. A whole community needs protection. Clinical care and public health work together.&quot;&gt;&lt;/svg&gt;&lt;div class=&quot;lesson-grid&quot;&gt;&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🏥 Clinical care = help a person&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Care for an individual: assess a problem, treat it when appropriate and support recovery.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Lina helps a child who feels unwell. Her question is: “What does this child need?”&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🏘️ Public health = help a population&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Protect and improve health across a group of people. A &lt;strong&gt;population&lt;/strong&gt; is the group we are talking about.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ben looks across the town. He asks: “Are many people affected? What could help protect the community?”&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🔎 Epidemiology = study health patterns&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Study who is affected, where and when, and investigate possible reasons. An &lt;strong&gt;epidemiologist&lt;/strong&gt; does this work.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ben compares different places and weeks. One unusual number starts an investigation; it does not tell him the cause.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🛡️ Prevention = reduce the chance of harm&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Act to help stop health problems or reduce their effects.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; The town supports access to clean water. Helping people stay well is also health work, even when nobody is visiting a clinic.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://www.cdc.gov/training-publichealth101/php/training/introduction-to-epidemiology.html&quot;&gt;CDC: epidemiology basics&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; Start by asking which people and decisions the product supports. A tool for a nurse caring for one person may need different information from a tool for Ben studying a town.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-8-b&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category B&lt;/p&gt;&lt;h3&gt;Clues and checking&lt;/h3&gt;&lt;p&gt;How does the town notice that something might be wrong?&lt;/p&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📒&lt;/span&gt;&lt;strong&gt;1. Notice&lt;/strong&gt;&lt;p&gt;The school usually records about 2 absences on Mondays. Today it records 8.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🔍&lt;/span&gt;&lt;strong&gt;2. Ask and check&lt;/strong&gt;&lt;p&gt;Ben checks the date, the records and the reason for absence. Could it be a reporting mistake or an event?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🤝&lt;/span&gt;&lt;strong&gt;3. Understand together&lt;/strong&gt;&lt;p&gt;He shares the checked information with the right experts. They judge what it means and what to do.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;These numbers are made up.&lt;/strong&gt; School absence is a clue in our story. It is not a diagnosis or a count of confirmed disease cases.&lt;/p&gt;&lt;div class=&quot;lesson-grid&quot;&gt;&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;👀 Surveillance = keep watching over time&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Regularly collect, understand and share health information so people can act.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ben checks the weekly records repeatedly. One chart on one day is only a small part of this ongoing work.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🚩 Signal = a clue worth checking&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Information that suggests a possible health threat and needs assessment.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; “8 absent today” catches Ben’s attention. It does &lt;strong&gt;not&lt;/strong&gt; yet mean “there is an outbreak.”&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;✅ Verification = check whether it is real&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Confirm important information with suitable sources and people.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; One list accidentally counted the same class twice. Ben checks the source instead of repeating the first number.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;💡 Public-health intelligence = clues made useful&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Bring information together to help detect and understand health threats and support decisions.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ben combines the records with local context, explains what is known and uncertain, and shares it with decision-makers.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · two kinds of clues&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Interview word&lt;/th&gt;&lt;th&gt;Think of it this way&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Indicator-based surveillance&lt;/td&gt;&lt;td&gt;A regular counting sheet. Example: a clinic submits weekly counts using agreed rules.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Event-based surveillance&lt;/td&gt;&lt;td&gt;A report of something unusual. Example: a community worker reports an unexpected cluster. It still needs checking.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · outbreak, epidemic and pandemic&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Word&lt;/th&gt;&lt;th&gt;Simple meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Outbreak / epidemic&lt;/td&gt;&lt;td&gt;More cases than expected for a population, place and time. “Outbreak” often refers to a smaller area.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Pandemic&lt;/td&gt;&lt;td&gt;An epidemic spread across several countries or continents, usually affecting many people. It describes spread, not a severity score.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Endemic&lt;/td&gt;&lt;td&gt;A disease’s usual presence or level in an area. “Usual” does not mean harmless.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Case definition&lt;/td&gt;&lt;td&gt;The agreed criteria used to decide what counts as a case. Like rules for sorting items into a basket; real health criteria come from domain experts.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson1/section11.html&quot;&gt;CDC: outbreak, epidemic and pandemic&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;quick-check&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧠 Tiny check: Do 8 absences prove there is an outbreak?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Check what the number represents and verify the information. Experts need more evidence before drawing a health conclusion.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://www.cdc.gov/training-publichealth101/php/training/introduction-to-public-health-surveillance.html&quot;&gt;CDC: surveillance basics&lt;/a&gt; · &lt;a href=&quot;https://cdn.who.int/media/docs/default-source/documents/emergencies/who-mou-march-2023.pdf?download=true&amp;amp;sfvrsn=6369eaf4_1&quot;&gt;WHO: public-health intelligence&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-8-c&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category C&lt;/p&gt;&lt;h3&gt;People using the tools library&lt;/h3&gt;&lt;p&gt;Why does Ben need the marketplace described in your JD?&lt;/p&gt;&lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;🧰&lt;/span&gt;&lt;p&gt;Ben wants to compare weekly patterns. Someone may already have built a useful chart tool, but it is hard to find. Jo’s library helps him discover it, understand it and decide whether it fits his task.&lt;/p&gt;&lt;/div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Library character&lt;/th&gt;&lt;th&gt;Interview term and example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Ben looks for a tool&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Consumer:&lt;/strong&gt; the person using a resource. Ben asks, “Will this work with my weekly counts?”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A developer shares a tool&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Contributor:&lt;/strong&gt; the person supplying a resource and its description. They explain inputs, setup and limitations.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Jo checks the listing&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Curator:&lt;/strong&gt; the person reviewing and organising listings. Jo asks for missing evidence and handles corrections.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;A &lt;strong&gt;marketplace&lt;/strong&gt; here is a place to discover and compare resources. It does not have to sell things. WHO’s &lt;strong&gt;Collaboratory&lt;/strong&gt; connects people working on epidemic and pandemic intelligence to collaborate on data, analysis and tools.&lt;/p&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://www.who.int/initiatives/collaboratory&quot;&gt;WHO: Collaboratory&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; Ask each group to show a recent task. For Ben: “What were you trying to do, where did you search, and why did you trust or reject a tool?”&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-8-d&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category D&lt;/p&gt;&lt;h3&gt;The WHO mission and your actual BA job&lt;/h3&gt;&lt;p&gt;Think: a town library that helps health detectives reuse good tools.&lt;/p&gt;&lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;🌍&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Ben’s problem:&lt;/strong&gt; “I spend time making something that another team has already made.” &lt;strong&gt;The catalogue’s job:&lt;/strong&gt; help him find it, judge whether it fits, and reach the people or instructions needed to reuse it.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🤝&lt;/span&gt;&lt;strong&gt;People meet&lt;/strong&gt;&lt;p&gt;Collaboratory connects a community around epidemic and pandemic intelligence.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📚&lt;/span&gt;&lt;strong&gt;Tools become findable&lt;/strong&gt;&lt;p&gt;Your JD’s Marketplace describes resources and their evidence, versions and owners.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧭&lt;/span&gt;&lt;strong&gt;People decide&lt;/strong&gt;&lt;p&gt;Practitioners assess suitability. Domain experts help check scientific meaning.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Official context:&lt;/strong&gt; WHO’s FAQ describes a searchable environment for published, peer-reviewed tools and relevant datasets, alongside expert collaboration and feedback. It also describes Discourse and GitHub as community/code components. This does not establish the Marketplace’s current architecture. &lt;a href=&quot;https://www.who.int/initiatives/collaboratory/faqs&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Collaboratory FAQ&lt;/a&gt;.&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · What the sources confirm—and what they do not&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Evidence level&lt;/th&gt;&lt;th&gt;What you can safely say&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;WHO public material&lt;/td&gt;&lt;td&gt;Collaboratory supports collaboration, analytical tools and knowledge sharing. Its FAQ supports the discovery idea. Public descriptions may lag a project’s latest plans.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;WHO strategy document · historical context&lt;/td&gt;&lt;td&gt;The Division’s 2023–2025 Strategy Plan, page 18, describes Collaboratory as a collaborative environment for data sharing and analytical tools. Its three objectives are alignment, useful solutions and scaling; it does not verify the requested Layer 4 label.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Your supplied JD&lt;/td&gt;&lt;td&gt;The Tools and Resources Marketplace covers discovery, comparison, reuse, AI-assisted features, lifecycle governance and BA-led operational delivery. Use this document for the role’s scope.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Related vendor advert&lt;/td&gt;&lt;td&gt;A public advert with the same product title closely matches the responsibilities and mentions a prepared case presentation. It is not an official WHO vacancy or confirmation of your vendor’s selection process.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“Strategic Shift Layer 4” / “Strategic Solution Layer 4”&lt;/td&gt;&lt;td&gt;Not verified in the public WHO material searched on 3 November 2026. These labels are also absent from the supplied JD. They may refer to another or internal document; do not invent a four-layer architecture.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Question to clarify in the interview&lt;/td&gt;&lt;td&gt;“Could you share the strategy diagram and explain what Layer 4 includes and which neighbouring components it depends on?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;health-source&quot;&gt;Sources: &lt;a href=&quot;https://www.who.int/initiatives/collaboratory/faqs&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Collaboratory FAQ&lt;/a&gt;; &lt;a href=&quot;https://pandemichub.who.int/docs/librariesprovider2/default-document-library/long-strategy-flyer-scrollable.pdf?sfvrsn=e33b8a96_7&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Strategy Plan 2023–2025, p. 18 (historical)&lt;/a&gt;; &lt;a href=&quot;https://www.who.int/initiatives/collaboratory&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Collaboratory overview&lt;/a&gt;; &lt;a href=&quot;https://www.who.int/initiatives/collaboratory/governance&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Collaboratory governance&lt;/a&gt;; &lt;a href=&quot;https://uk.linkedin.com/jobs/view/business-analyst-tools-and-resources-marketplace-at-reckon-digital-4485323477&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Related vendor advert&lt;/a&gt;. The vendor document you supplied is titled &lt;em&gt;Business Analyst – Tools and Resources Marketplace&lt;/em&gt;. Search findings are not proof that an unpublished document does not exist.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · The JD in seven small BA work packages&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Work package&lt;/th&gt;&lt;th&gt;The decision → something you produce&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;1 · Listen&lt;/td&gt;&lt;td&gt;Whose problem matters? → stakeholder map, interviews and community-session findings, with the designer.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2 · Follow the journey&lt;/td&gt;&lt;td&gt;Where do people get stuck? → evidence-based personas and need → find → assess → adopt journey; compare with a general AI assistant.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 · Compare options&lt;/td&gt;&lt;td&gt;Adopt, extend or build? → same-task comparison, full costs, assumptions and recommendation.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;4 · Organise the library&lt;/td&gt;&lt;td&gt;What may be listed and who checks changes? → resource model, field rules, sourcing and lifecycle decisions.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 · Explain what to build&lt;/td&gt;&lt;td&gt;What should happen in normal and failure cases? → stories, rules, states and measurable AI acceptance criteria.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;6 · Make it visible&lt;/td&gt;&lt;td&gt;Can users understand the proposed journey? → rough screens, a design brief and findings from testing with the designer.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;7 · Deliver and learn&lt;/td&gt;&lt;td&gt;What small complete journey can we validate? → refined work, dependency tracking, UAT and post-release measures.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Role boundary:&lt;/strong&gt; the JD gives the WHO PO scope, priority and product direction. You run BA and delivery work within that direction; experts validate domain meaning and engineers assess implementation.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;quick-check&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧠 Tiny check: Must I become an epidemiologist before the interview?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Prepare to understand users, inputs, outputs and limits, then ask precise questions. You are applying as a BA. Do not invent scientific definitions: ask an expert, record examples and turn the agreed meaning into rules.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; Your current knowledge/dataset documentation is the closest bridge: you assess information, ask reviewers, recommend changes and seek team-lead approval. The catalogue adds public discovery, multiple source types and systematic lifecycle/AI controls.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-8-e&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category E&lt;/p&gt;&lt;h3&gt;What is the end user actually trying to do?&lt;/h3&gt;&lt;p&gt;Ben arrives with a job to finish—not with a wish to browse 500 cards.&lt;/p&gt;&lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;🎯&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Say the need as a small sentence:&lt;/strong&gt; “I am [user]. I need [output] for [decision]. I have [data and skills], and must work within [constraints].” The catalogue helps find and assess a resource that fits this sentence.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧑‍🔬&lt;/span&gt;&lt;strong&gt;The practitioner&lt;/strong&gt;&lt;p&gt;Finds and assesses tools, models, datasets or guidance.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧑‍💻&lt;/span&gt;&lt;strong&gt;The contributor&lt;/strong&gt;&lt;p&gt;Describes what their resource needs, produces and cannot do.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧑‍🏫&lt;/span&gt;&lt;strong&gt;The curator&lt;/strong&gt;&lt;p&gt;Checks the evidence and maintains the listing so the next person can judge it.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Public WHO examples → proposed Marketplace use cases.&lt;/strong&gt; The eight examples below cover task families relevant to your JD. They are not a verified inventory of Marketplace listings, deployed integrations or every internal WHO use case. The “listing should help” sentence is our BA inference to validate with users.&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · 📰 Detect a possible threat&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;The user’s job:&lt;/strong&gt; A public-health intelligence analyst needs to identify and assess a concerning report.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;WHO evidence:&lt;/strong&gt; WHO’s EIOS initiative supports detection and assessment using open-source information. &lt;a href=&quot;https://www.who.int/initiatives/eios&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO EIOS&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The listing should help:&lt;/strong&gt; Find a tool or method for the task; check source/language coverage, update timing, verification workflow and permitted access. A news article is not itself a software resource.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · 🧑‍🤝‍🧑 Investigate cases and contacts&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;The user’s job:&lt;/strong&gt; A field team needs to collect case/contact records and understand links between them.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;WHO evidence:&lt;/strong&gt; WHO describes Go.Data as supporting outbreak investigation, case/contact data and transmission-chain visualisation. &lt;a href=&quot;https://www.who.int/tools/godata/go.data-frequently-asked-questions&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Go.Data FAQ&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The listing should help:&lt;/strong&gt; Look for supported data fields, roles, import/export, deployment and connectivity requirements. A tool requiring person-level contact data cannot reconstruct contacts from weekly totals.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · 📋 Find an investigation template&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;The user’s job:&lt;/strong&gt; A field investigator needs an appropriate form before collecting information.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;WHO evidence:&lt;/strong&gt; WHO’s Outbreak Toolkit includes generic and exposure-specific investigation forms with stated purposes. &lt;a href=&quot;https://www.who.int/emergencies/outbreak-toolkit/standardized-data-collection-tools&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO investigation tools&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The listing should help:&lt;/strong&gt; Check intended investigation stage, topic, language, revision, instructions and adaptation needs. A generic form and a specialised exposure form solve different needs.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · 🗃️ Find usable data&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;The user’s job:&lt;/strong&gt; An analyst needs a compatible indicator or dataset for a comparison.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;WHO evidence:&lt;/strong&gt; WHO’s GHO API documentation explains indicators, dimensions, filtering and time periods. &lt;a href=&quot;https://www.who.int/data/gho/info/gho-odata-api&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO GHO data API&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The listing should help:&lt;/strong&gt; Check definition, unit/denominator, population, time/place coverage, granularity, update date and access. Annual country data cannot directly answer a weekly district question.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · 🔭 Explore future trends&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;The user’s job:&lt;/strong&gt; A modeller needs a resource to explore how an outbreak might develop.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;WHO evidence:&lt;/strong&gt; WHO’s March 2026 Hub update describes forecasting and links between modellers, analysts and governments thr
