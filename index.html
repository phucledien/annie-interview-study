    &quot;message&quot;,

    &lt;h3&gt;The idea in plain words&lt;/h3&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;BA idea&lt;/th&gt;&lt;th&gt;Meaning and example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;

    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🧱 Build small blocks of user value&lt;/h2&gt;&lt;p&gt;A good story is a small, useful building block. INVEST helps you check whether it is ready for a productive conversation.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;invest&quot; role=&quot;img&quot; aria-label=&quot;Six INVEST blocks: Independent, Negotiable, Valuable, Estimable, Small, Testable&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Check&lt;/th&gt;&lt;th&gt;Ask yourself&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;

    &lt;h3&gt;Acceptance criteria are a tiny comic strip&lt;/h3&gt;

    &lt;p&gt;&lt;strong&gt;Hypothetical story:&lt;/strong&gt; As an investigator, I want to claim an unassigned case so ownership is clear.&lt;/p&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Scenario&lt;/th&gt;&lt;th&gt;Expected behaviour&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Happy path&lt;/td&gt;&lt;td&gt;An authorised user claims an unassigned case and becomes its owner.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Conflict&lt;/td&gt;&lt;td&gt;A second claim does not overwrite the first owner.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Permission&lt;/td&gt;&lt;td&gt;An unauthorised attempt is denied without revealing restricted details.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Know the difference&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Epic&lt;/th&gt;&lt;td&gt;A broad area to break down.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Story&lt;/th&gt;&lt;td&gt;A useful user need.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Task&lt;/th&gt;&lt;td&gt;Work needed to implement it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Acceptance criteria&lt;/th&gt;&lt;td&gt;This item&#x27;s expected behaviour.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Definition of Done&lt;/th&gt;&lt;td&gt;The Increment&#x27;s shared quality standard.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;UAT&lt;/th&gt;&lt;td&gt;Check that the behaviour fits business use.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;Split by useful outcomes, not only into database, API and UI layers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Write one real story and three criteria: normal, exception and permission. Link each criterion to a test.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; user stories, test reviews and UAT coordination.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“What makes a good user story?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Name the user and value → apply two INVEST checks → show one criterion → explain how you validated it.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; improve an example rather than only expanding INVEST.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Split an oversized story into three useful slices. Plan UAT users, data, scenarios, defect triage and acceptance authority.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;What if tests pass but the stakeholder rejects the result?&lt;/li&gt;&lt;li&gt;How do you distinguish a defect from a new request?&lt;/li&gt;&lt;li&gt;What belongs in Done versus acceptance criteria?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;2&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day3&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab3&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;⛵ One boat, a shared destination&lt;/h2&gt;&lt;p&gt;Scrum is a team learning its way toward a goal. Everyone contributes; the accountabilities remain clear.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;boat&quot; role=&quot;img&quot; aria-label=&quot;Product Owner supports value and direction, Developers plan and build, Scrum Master supports Scrum and team effectiveness; all share the Sprint Goal&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What to remember&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Product Owner&lt;/td&gt;&lt;td&gt;Value and direction: product value and effective Product Backlog management.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Developers&lt;/td&gt;&lt;td&gt;Plan and build: Sprint plan, usable Increment and quality.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Scrum Master&lt;/td&gt;&lt;td&gt;Help the crew improve: establish Scrum and support team effectiveness.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;BA&lt;/td&gt;&lt;td&gt;Make needs clear. Analysis is a skill contribution, not an extra Scrum accountability.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;Keep looking and adjusting&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;loop&quot; role=&quot;img&quot; aria-label=&quot;Transparency lets us see, inspection helps us learn, adaptation lets us change&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Event&lt;/th&gt;&lt;th&gt;The question it helps answer&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Why this Sprint, what is feasible, and how?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Daily Scrum&lt;/td&gt;&lt;td&gt;Are we progressing toward the goal? What should change today?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Review&lt;/td&gt;&lt;td&gt;What did we learn with stakeholders? What next?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Retrospective&lt;/td&gt;&lt;td&gt;How can we improve quality and effectiveness?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Three commitments and common traps&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Product Backlog&lt;/th&gt;&lt;td&gt;Product Goal&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Sprint Backlog&lt;/th&gt;&lt;td&gt;Sprint Goal&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Increment&lt;/th&gt;&lt;td&gt;Definition of Done&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;The Sprint is one month or less. Refinement is ongoing work. Ready is optional. A Review is not just a demo or a mandatory release gate. The Daily Scrum is not a manager&#x27;s status collection.&lt;/p&gt;&lt;p&gt;Scrum values: commitment, focus, openness, respect and courage.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Map one real decision: what you prepared, what the PO decided and what Developers planned.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; BA/Scrum Master collaboration with delivery teams.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“An urgent request arrives mid-sprint. What do you do?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Clarify urgency → check impact on the goal → discuss options with PO and Developers → make displaced work visible → adapt the plan without lowering quality.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; explain your contribution without claiming you assigned everyone&#x27;s work.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Describe one feedback loop that changed your team&#x27;s plan. Compare a useful meeting with a status-only meeting.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;How did you balance BA and Scrum Master work?&lt;/li&gt;&lt;li&gt;Who decides what is feasible in a Sprint?&lt;/li&gt;&lt;li&gt;What do you investigate when work carries over repeatedly?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;3&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day4&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab4&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🎒 Pack for the trip you are taking&lt;/h2&gt;&lt;p&gt;A release is a backpack with limited space. Choose what serves the goal; some useful things can wait for another trip.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;moscow&quot; role=&quot;img&quot; aria-label=&quot;MoSCoW compartments: Must essential, Should important, Could optional, Won&#x27;t this time later&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;MoSCoW&lt;/th&gt;&lt;th&gt;Decision question&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Must&lt;/td&gt;&lt;td&gt;Would the release be unviable without it?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Should&lt;/td&gt;&lt;td&gt;Is it important, but an acceptable workaround exists?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Could&lt;/td&gt;&lt;td&gt;Can we include it if capacity allows?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Won&#x27;t this time&lt;/td&gt;&lt;td&gt;Have we explicitly deferred it for this timeframe?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;Delivering is not the same as helping&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;outcome&quot; role=&quot;img&quot; aria-label=&quot;Output is an assignment button; outcome is less waiting; evidence is measured assignment time and errors&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Idea&lt;/th&gt;&lt;th&gt;Memory hook and meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;KISS&lt;/td&gt;&lt;td&gt;Pack light: remove unnecessary complexity, not essential controls.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MVP&lt;/td&gt;&lt;td&gt;A small useful trip: deliver enough value to test an important assumption.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Roadmap&lt;/td&gt;&lt;td&gt;Direction: intended outcomes over time.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Backlog&lt;/td&gt;&lt;td&gt;Next steps: order work and learning toward the goal.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Discovery / delivery&lt;/td&gt;&lt;td&gt;Learn / make: learning continues while we build and release.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Choose five features. Rank them against one goal. Explain value, effort, urgency, dependencies and what you defer.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; backlog sequencing and roadmap alignment.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“Two stakeholders both say their request is a Must. What do you do?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Agree goal and timeframe → ask the consequence of omission → inspect workarounds and evidence → compare trade-offs → align with the decision owner.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; start with the goal, not the name of a scoring method.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Compare build, adopt and extend options using fit, integration, delivery effort, maintenance and exit cost.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;How would you know a feature improved the outcome?&lt;/li&gt;&lt;li&gt;What would you deliberately leave out of an MVP?&lt;/li&gt;&lt;li&gt;How do dependencies affect sequencing?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;4&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day5&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab5&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🌦️ Check the weather before the journey&lt;/h2&gt;&lt;p&gt;A cloud might bring rain: a risk. The road is already flooded: an issue. Both need an owner and action.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;raid&quot; role=&quot;img&quot; aria-label=&quot;Risk may happen; issue is happening; assumption needs checking; dependency relies on someone or something&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;RAID&lt;/th&gt;&lt;th&gt;Case-work example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Risk&lt;/td&gt;&lt;td&gt;The external API might change before testing.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Assumption&lt;/td&gt;&lt;td&gt;We expect business testers to be available.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Issue&lt;/td&gt;&lt;td&gt;The test environment is unavailable now.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Dependency&lt;/td&gt;&lt;td&gt;End-to-end testing needs the real external interface.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;A risk matrix is a conversation starter&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;risk&quot; role=&quot;img&quot; aria-label=&quot;Illustrative three by three likelihood impact matrix, scores one through nine, not probabilities&quot;&gt;&lt;/svg&gt;
    &lt;p&gt;These scores are illustrative rankings, not probabilities. Agree your scales and tolerance. Keep the reason, owner, response and review date beside the score.&lt;/p&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What can you do about a threat?&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Avoid&lt;/th&gt;&lt;td&gt;Change the plan to remove exposure.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Mitigate&lt;/th&gt;&lt;td&gt;Reduce likelihood or impact.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Transfer&lt;/th&gt;&lt;td&gt;Arrange an agreed transfer of exposure.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Accept&lt;/th&gt;&lt;td&gt;Use appropriate authority, monitoring and contingency.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Residual risk:&lt;/strong&gt; what remains after the response. &lt;strong&gt;Contingency:&lt;/strong&gt; what to do if it happens.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Write one risk: “Because of [cause], [event] may happen, leading to [impact].” Add an owner, action and escalation trigger.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; risks, dependencies and evidence-based escalation.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“A dependency team will be late. What do you do?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Confirm facts → identify affected outcomes → explore alternatives → agree owners and checkpoints → update forecast → escalate a decision with options.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; explain what changed after your escalation.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Write a four-line update: progress, forecast, risk and decision needed. For a scope change, assess value, effort, data, interfaces, tests, timing and support.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;When do you escalate?&lt;/li&gt;&lt;li&gt;How do you handle a fixed date and changing scope?&lt;/li&gt;&lt;li&gt;How do you know a mitigation worked?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;5&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day6&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab6&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🧩 Pick the picture that solves the puzzle&lt;/h2&gt;&lt;p&gt;You do not need every diagram. Choose the one that makes the unclear part visible.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;models&quot; role=&quot;img&quot; aria-label=&quot;One case viewed through process steps, states and related entities&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Your question&lt;/th&gt;&lt;th&gt;Choose this picture&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;What happens next?&lt;/td&gt;&lt;td&gt;Process flow&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Which changes are allowed?&lt;/td&gt;&lt;td&gt;State model&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;How do things relate?&lt;/td&gt;&lt;td&gt;Entity relationship model&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What does this field mean?&lt;/td&gt;&lt;td&gt;Data dictionary&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Who calls whom?&lt;/td&gt;&lt;td&gt;Sequence diagram&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Can a user understand the screen?&lt;/td&gt;&lt;td&gt;Wireframe&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What is the whole experience?&lt;/td&gt;&lt;td&gt;Journey map&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;A workshop should end in a useful change&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;workshop&quot; role=&quot;img&quot; aria-label=&quot;Prepare the decision, explore evidence together, agree owners and follow up&quot;&gt;&lt;/svg&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Five Whys and technical analysis&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ask why repeatedly to investigate causes. Five is not a compulsory count. Check evidence and allow more than one cause.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;API and data mapping&lt;/th&gt;&lt;th&gt;Remember to check&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Meaning&lt;/td&gt;&lt;td&gt;Source, target, type, allowed values and transformations.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Exceptions&lt;/td&gt;&lt;td&gt;Missing data, errors, timeouts, retries and duplicates.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Trust&lt;/td&gt;&lt;td&gt;Permissions and the authoritative source.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Validation&lt;/td&gt;&lt;td&gt;What the user sees and how the scenario is tested.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Pick one previous-project integration or previous-project mock-up. Draw a model and name two questions it helps answer.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; mock-ups, process flows and API/data mapping.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“How do you choose an analysis technique?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Uncertainty → chosen model → gap discovered → people involved → decision → validation.&lt;/p&gt;&lt;p&gt;“The state model exposed [gap]. We agreed [rule] and checked it through [method].”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; explain the decision the diagram enabled.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Explain the same technical issue to an engineer, then to a sponsor. Keep facts consistent; change the detail.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;How do you handle stakeholder conflict?&lt;/li&gt;&lt;li&gt;What did your data mapping actually cover?&lt;/li&gt;&lt;li&gt;How do you make sure a workshop leads to action?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;6&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day7&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab7&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🎤 Tell a little story with real evidence&lt;/h2&gt;&lt;p&gt;Your answer needs a problem, your decision, your action and a result. The interviewer should know what you personally contributed.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;answer&quot; role=&quot;img&quot; aria-label=&quot;A two-minute answer uses context, responsibility, action with reasoning, result, and learning&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Part&lt;/th&gt;&lt;th&gt;Say this&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Situation · 15 sec&lt;/td&gt;&lt;td&gt;What was the problem?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Responsibility · 15 sec&lt;/td&gt;&lt;td&gt;What was your scope?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Action · 60 sec&lt;/td&gt;&lt;td&gt;What did you do, and why?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Result · 20 sec&lt;/td&gt;&lt;td&gt;What evidence shows the outcome?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Learning · 10 sec&lt;/td&gt;&lt;td&gt;What would you repeat or change?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;Upgrade the answer&lt;/h3&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Too vague&lt;/th&gt;&lt;th&gt;Make it specific&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;“I gathered requirements.”&lt;/td&gt;&lt;td&gt;Name the ambiguity you resolved.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“I managed stakeholders.”&lt;/td&gt;&lt;td&gt;Name the disagreement and decision criteria.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“I ensured quality.”&lt;/td&gt;&lt;td&gt;Name the gap, check and result.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;“We delivered everything.”&lt;/td&gt;&lt;td&gt;Separate your contribution from the team&#x27;s.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your six reusable experience stories&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Story&lt;/th&gt;&lt;th&gt;Where to look in your CV&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Ambiguity&lt;/td&gt;&lt;td&gt;recent-project requirements workshops&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Priority trade-off&lt;/td&gt;&lt;td&gt;Backlog sequencing&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Risk or dependency&lt;/td&gt;&lt;td&gt;Coordination across two teams&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;UAT problem&lt;/td&gt;&lt;td&gt;Business validation and defect triage&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Model that helped&lt;/td&gt;&lt;td&gt;previous-project mock-ups or previous-project mappings&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Improvement&lt;/td&gt;&lt;td&gt;BA practices or AI-assisted BA work&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 30-minute rehearsal&lt;/h3&gt;&lt;p&gt;5 minutes: introduction. 15 minutes: three questions. 10 minutes: score and improve your weakest answer.&lt;/p&gt;&lt;p&gt;Score 0–2 each for directness, ownership, reasoning, specificity and evidence. This is your practice rubric.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Start here&lt;/h3&gt;&lt;p&gt;“Walk me through a feature from idea to production.”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Need → evidence → my role → decision → implementation support → validation → actual outcome.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; use a measured result only when you can explain the baseline and measurement.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Open your mock interview&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;Tell me about a requirement you misunderstood.&lt;/li&gt;&lt;li&gt;How did you support two Agile teams?&lt;/li&gt;&lt;li&gt;How did you resolve conflicting priorities?&lt;/li&gt;&lt;li&gt;What if UAT finds a major gap before release?&lt;/li&gt;&lt;li&gt;How did you use AI in BA work and check its outputs?&lt;/li&gt;&lt;li&gt;What would you do in your first two weeks here?&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;Using AI to assist your work is different from specifying an AI-powered product. Describe only the experience you actually have.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;7&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I rehearsed and improved my answers.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day8&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab8&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🏘️ A caring village: one person and everyone&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Day 8 · Healthcare and public health.&lt;/strong&gt; Imagine a child feels unwell at school. A care team helps that child. A public-health team asks whether other children are affected and how to protect the whole community.&lt;/p&gt;&lt;p&gt;Today’s goal: name the people, follow a simple care journey, and explain why this JD focuses on tools for public-health practitioners.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;health-village&quot; role=&quot;img&quot; aria-label=&quot;Healthcare focuses on care for a person; public health focuses on the health of a population. They overlap and exchange knowledge.&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;memory-line&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; care for a person + protect a population.&lt;/p&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;New word&lt;/th&gt;&lt;th&gt;Think of it like this&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Healthcare&lt;/td&gt;&lt;td&gt;Services that prevent, assess or treat illness and support recovery or comfort. It includes more than hospitals.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Public health&lt;/td&gt;&lt;td&gt;The community’s shared work to prevent illness and improve population health: for example, safer water, vaccination programmes or outbreak monitoring.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Primary care / primary health care&lt;/td&gt;&lt;td&gt;Primary care is commonly a first-contact care service. WHO’s broader primary health care approach also includes community participation and action on conditions that shape health.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Specialist care&lt;/td&gt;&lt;td&gt;Care from a team with deeper expertise in a particular area. A referral is a request to another service; it is not proof that the visit happened.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Outpatient / inpatient&lt;/td&gt;&lt;td&gt;A visit without admission versus care after admission to a hospital. Administrative definitions vary by system.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Prevention / rehabilitation&lt;/td&gt;&lt;td&gt;Help stop illness before it happens / help someone regain functioning. Health services also include palliative care, which supports quality of life and relief of suffering.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;p class=&quot;text-small&quot;&gt;Foundations: &lt;a href=&quot;https://www.who.int/health-topics/primary-health-care&quot;&gt;WHO: primary health care&lt;/a&gt; and &lt;a href=&quot;https://www.cdc.gov/training-publichealth101/php/training/introduction-to-epidemiology.html&quot;&gt;CDC: epidemiology introduction&lt;/a&gt;. The school story is an original teaching analogy.&lt;/p&gt;
    &lt;h3&gt;Who lives in the village?&lt;/h3&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Person or group&lt;/th&gt;&lt;th&gt;Need to discover as a BA&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Patient and caregiver&lt;/td&gt;&lt;td&gt;Understand the next step, access services and receive understandable information. Ask about language, accessibility and supported decision-making.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Clinician and nurse&lt;/td&gt;&lt;td&gt;Make care decisions with the right information. Observe real work, including interruptions and handoffs.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Lab, imaging and pharmacy teams&lt;/td&gt;&lt;td&gt;Receive clear requests and return results or fulfil medication-related work. A sent request and a completed action are different states.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Operations and payer&lt;/td&gt;&lt;td&gt;Coordinate appointments, capacity and funding. Funding and insurance arrangements differ across countries.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Public-health practitioner / epidemiologist&lt;/td&gt;&lt;td&gt;Understand patterns, investigate problems and support population-level action.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Researcher, developer and curator&lt;/td&gt;&lt;td&gt;Create, use and maintain trustworthy analytical tools. These are especially relevant to this marketplace JD.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;Two small journeys&lt;/h3&gt;
    &lt;p&gt;&lt;strong&gt;A care journey:&lt;/strong&gt; this is a simplified outpatient example, not a universal clinical workflow.&lt;/p&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;care-journey&quot; role=&quot;img&quot; aria-label=&quot;Book and register, meet care team, tests if needed, review and follow up. A handoff needs an owner.&quot;&gt;&lt;/svg&gt;
    &lt;p&gt;&lt;strong&gt;A public-health loop:&lt;/strong&gt; collect appropriate information, make sense of patterns, share findings with people who can act, then review what changes.&lt;/p&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;public-loop&quot; role=&quot;img&quot; aria-label=&quot;Public-health surveillance connects collection, analysis, communication and action, with continuing feedback.&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;text-small&quot;&gt;Source: &lt;a href=&quot;https://www.cdc.gov/training-publichealth101/php/training/introduction-to-public-health-surveillance.html&quot;&gt;CDC: public-health surveillance&lt;/a&gt;. Real collection, sharing and response arrangements depend on the setting.&lt;/p&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧩 Connect this village to the actual JD&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The JD describes a marketplace for analytical tools and resources. Its users may need to &lt;strong&gt;discover → evaluate → adopt&lt;/strong&gt; a tool, or &lt;strong&gt;contribute → review → maintain&lt;/strong&gt; a listing. A hospital booking app is useful background, but it is not the product described in the JD.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Persona hypothesis&lt;/th&gt;&lt;th&gt;Research question&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Consumer: analyst&lt;/td&gt;&lt;td&gt;“Show me how you last found a suitable tool. Where did you hesitate?”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Contributor: tool author&lt;/td&gt;&lt;td&gt;“What information can you maintain, and what becomes out of date?”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Curator: domain reviewer&lt;/td&gt;&lt;td&gt;“What evidence would let you approve a listing, and when would you reject it?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;Validate these hypotheses with users. Job titles alone do not establish someone’s needs.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Draw a map with an analyst in the middle. Add a tool author, curator, community lead and product owner. For each, write one need and one question. Then sketch the analyst’s journey from “I need a tool” to “I can use it.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your experience:&lt;/strong&gt; stakeholder workshops and journey mapping. Your transferable skill is learning the workflow with experts.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“You are new to public health. How would you get started?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See a beginner’s honest answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“My starting point is to understand the users and decisions this marketplace supports. I would observe a practitioner finding and evaluating a tool, build a glossary with a domain expert, and validate the journey with contributors and curators. I would turn the biggest uncertainties into research questions and testable requirements.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; describe how you will learn; avoid presenting yourself as a clinician or epidemiologist.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes · questions and answer tips&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;&lt;strong&gt;“How is public health different from healthcare?”&lt;/strong&gt; Use the one-child / whole-community picture, then mention the overlap.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“Who should attend a marketplace workshop?”&lt;/strong&gt; Include consumers, contributors and curators; explain the decision each can inform.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“What if two user groups need different things?”&lt;/strong&gt; Compare their tasks, context and consequences; avoid inventing one average persona.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;Spend 10 minutes reading one source, 10 minutes improving your stakeholder map and 10 minutes rehearsing two answers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;8&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain the village and name the marketplace’s users.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day9&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab9&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🔍 Health data: a detective’s notebook&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Day 9 · Data and basic epidemiology.&lt;/strong&gt; A detective collects clues, checks what they mean and asks what is missing. A spreadsheet full of numbers is only the beginning.&lt;/p&gt;&lt;p&gt;Today’s goal: ask sensible questions about a dataset and explain three ideas without jargon—epidemiology, incidence and prevalence.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;health-data&quot; role=&quot;img&quot; aria-label=&quot;An event is recorded, definitions are checked, patterns are analysed and findings inform a decision. Every step may introduce error.&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Word&lt;/th&gt;&lt;th&gt;Simple meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Epidemiology&lt;/td&gt;&lt;td&gt;Study how health events are distributed in populations, what influences them, and how that knowledge can help address health problems. Start with person, place and time.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Surveillance&lt;/td&gt;&lt;td&gt;Ongoing collection, analysis, interpretation and communication of health information for action. A dashboard is one possible output.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Case definition&lt;/td&gt;&lt;td&gt;A shared rule for who or what counts in this analysis. Definitions and versions matter; a surveillance definition is not a substitute for clinical diagnosis.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Dataset / metadata&lt;/td&gt;&lt;td&gt;The notebook’s entries / the cover and instructions describing those entries: who, where, when, units, source and limitations.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Indicator&lt;/td&gt;&lt;td&gt;A defined measure used to describe or track something. Specify its calculation, population, time window and meaning.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;p class=&quot;text-small&quot;&gt;Foundations: &lt;a href=&quot;https://www.cdc.gov/training-publichealth101/php/training/introduction-to-epidemiology.html&quot;&gt;CDC epidemiology&lt;/a&gt; and &lt;a href=&quot;https://www.cdc.gov/training-publichealth101/php/training/introduction-to-public-health-surveillance.html&quot;&gt;CDC surveillance&lt;/a&gt;.&lt;/p&gt;
    &lt;h3&gt;A photo and a short movie&lt;/h3&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;epi-dots&quot; role=&quot;img&quot; aria-label=&quot;Hypothetical group of 20 people: 2 already have a condition at the start, so point prevalence is 2 out of 20. Of the 18 initially without it, 3 develop it during one week, so one-week incidence proportion is 3 out of 18. The measures answer different questions.&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Measure&lt;/th&gt;&lt;th&gt;Question and toy calculation&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Point prevalence · a photo&lt;/td&gt;&lt;td&gt;“Who has it at this moment?” At the start, 2 of 20 people have the condition: &lt;strong&gt;2 ÷ 20 = 10%&lt;/strong&gt;.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Incidence proportion · new cases over a period&lt;/td&gt;&lt;td&gt;“Who newly develops it?” Of 18 initially unaffected people, 3 develop it during one week: &lt;strong&gt;3 ÷ 18 ≈ 16.7% over that week&lt;/strong&gt;.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Incidence rate · a different denominator&lt;/td&gt;&lt;td&gt;New cases divided by time at risk contributed by people, such as person-years. It is not the same as the proportion above.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;p&gt;The toy example assumes a closed group, complete follow-up and all 18 initially unaffected people at risk. The start-of-week photo and the new cases during the week are different measures; do not add their percentages. No clinical conclusion is implied.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;Definitions: &lt;a href=&quot;https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson3/section2.html&quot;&gt;CDC’s archived foundational lesson: measures of morbidity&lt;/a&gt;. Numbers and drawings here are invented for learning.&lt;/p&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🏥 Where do the clues come from? EHR, labs, surveys and registries&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Source or system&lt;/th&gt;&lt;th&gt;Memory picture and caution&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;EHR: electronic health record&lt;/td&gt;&lt;td&gt;A care notebook containing patient history, diagnoses, medicines and results. Care data reflects who accessed services; it may not represent everyone.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Lab system / imaging system&lt;/td&gt;&lt;td&gt;Specialist notebooks for test work and images. Orders, samples, results and final reports are different things.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Survey&lt;/td&gt;&lt;td&gt;Ask a selected group questions. Check who was sampled and who did not respond.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Registry / surveillance reporting&lt;/td&gt;&lt;td&gt;Organised records for a defined purpose or population. Check coverage, reporting rules and delays.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;FHIR&lt;/td&gt;&lt;td&gt;A shared set of “labelled envelopes” for exchanging health information. Patient and Observation are examples of resources. FHIR does not by itself guarantee accurate data, permission to share or secure operation.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;Sources: &lt;a href=&quot;https://healthit.gov/health-it-basics/benefits-ehrs&quot;&gt;HealthIT.gov: EHRs&lt;/a&gt; and &lt;a href=&quot;https://www.hl7.org/fhir/overview.html&quot;&gt;HL7: FHIR overview&lt;/a&gt;. Learn the purpose now; technical implementation can wait until the project confirms a need.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;h3&gt;Seven questions before believing a number&lt;/h3&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Check&lt;/th&gt;&lt;th&gt;Ask the owner&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Population&lt;/td&gt;&lt;td&gt;Who is included or missing? Is it patients seen at one clinic or the whole community?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Definition&lt;/td&gt;&lt;td&gt;What counts as a case? Did the rule change?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Denominator&lt;/td&gt;&lt;td&gt;What is the “out of”? A count of 10 alone cannot tell us the proportion affected.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Time and place&lt;/td&gt;&lt;td&gt;When and where? Does the date mean onset, test, report or upload?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Quality&lt;/td&gt;&lt;td&gt;Missing values, duplicates, units and code meanings? Missing is not automatically zero.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Bias and uncertainty&lt;/td&gt;&lt;td&gt;Who was more likely to be measured? Could testing or reporting changes explain the pattern?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Provenance&lt;/td&gt;&lt;td&gt;Where did it come from? Which version, transformations and owner can explain it?&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;p class=&quot;memory-line&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; “What exactly? Out of whom? When? Where? How do we know?”&lt;/p&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🔐 The notebook has a lock: privacy, security and safety&lt;/summary&gt;&lt;div&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;health-locks&quot; role=&quot;img&quot; aria-label=&quot;Privacy asks whether a use is appropriate and permitted; security protects information and systems; safety considers harm caused by use or failure.&quot;&gt;&lt;/svg&gt;&lt;p&gt;&lt;strong&gt;Privacy:&lt;/strong&gt; who may use which information, for what purpose? &lt;strong&gt;Security:&lt;/strong&gt; how is information protected against unauthorised access, alteration and loss? &lt;strong&gt;Safety:&lt;/strong&gt; could a wrong result or failed workflow cause harm?&lt;/p&gt;&lt;p&gt;Removing names does not automatically make a health dataset anonymous; combinations of attributes may still identify people. A public catalogue can describe a restricted dataset while access remains controlled. Discuss permitted use, approvals, retention and test data with the relevant experts.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;US example only:&lt;/strong&gt; HIPAA applies to specified covered entities and business associates; it is not a universal rule for every health app or country. Its Privacy Rule governs relevant uses and disclosures; its Security Rule protects electronic protected health information. Confirm jurisdiction and responsibilities with privacy/security specialists.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;Sources: &lt;a href=&quot;https://www.who.int/data/principles&quot;&gt;WHO data principles&lt;/a&gt;, &lt;a href=&quot;https://www.hhs.gov/hipaa/for-professionals/privacy/laws-regulations/index.html&quot;&gt;HHS Privacy Rule summary&lt;/a&gt;, &lt;a href=&quot;https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html&quot;&gt;HHS Security Rule summary&lt;/a&gt; and &lt;a href=&quot;https://www.who.int/news-room/fact-sheets/detail/patient-safety&quot;&gt;WHO patient safety&lt;/a&gt;. This is domain orientation; project-specific controls need expert review.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Create a pretend catalogue card for a weekly community dataset. Specify population, place, time range, case definition, units, update frequency, owner, access conditions and limitations. Use invented data only.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your experience:&lt;/strong&gt; data dictionaries, API mapping and validating assumptions.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“Two sources report different case numbers. What would you do?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“I would compare population, case definition, date type, time window, coverage, deduplication and update timing. I would trace each figure to its source and ask the data owner to explain the difference. I would document the agreed interpretation and show limitations rather than silently choosing one.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; name the comparison checks before saying “clean the data.”&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes · questions and answer tips&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;&lt;strong&gt;“Explain incidence and prevalence.”&lt;/strong&gt; Use photo versus new cases over time; include the denominator and period.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“Cases doubled. Is the situation worse?”&lt;/strong&gt; Investigate testing, definitions, population and reporting changes before claiming causation.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“Does FHIR mean our systems will work together?”&lt;/strong&gt; A standard helps; agreed versions, profiles, identifiers, semantics, permissions and testing still matter.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“Can we publish a dataset after deleting names?”&lt;/strong&gt; Ask for a privacy assessment and authorised release process; do not promise anonymity.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;Spend 10 minutes checking one source, 10 minutes comparing two fictional catalogue cards and 10 minutes practising answers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;9&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain the photo, the new cases and the questions behind a number.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day10&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab10&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;📚 A trustworthy library of public-health tools&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Day 10 · Apply the domain to this JD.&lt;/strong&gt; Imagine a library where the books are datasets, software packages, models and how-to guides. A useful library helps people find the right thing, understand its limits and know who maintains it.&lt;/p&gt;&lt;p&gt;Today’s goal: explain one marketplace journey, a trustworthy listing, its lifecycle and a safe AI-assisted review workflow.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;health-library&quot; role=&quot;img&quot; aria-label=&quot;An analyst searches, checks suitability and tries a tool; a contributor supplies it and a curator reviews and maintains the listing.&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;memory-line&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; find it → judge it → use it → keep it trustworthy.&lt;/p&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Library word&lt;/th&gt;&lt;th&gt;What it means in the marketplace&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Artifact&lt;/td&gt;&lt;td&gt;An item someone can discover and use: a software package, dataset, analytical model, notebook or guide. Define supported types with users.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Catalogue / repository&lt;/td&gt;&lt;td&gt;A catalogue describes and points to items. A repository stores items or their versions. One product can do both; do not assume hosting is required.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Taxonomy / ontology / knowledge graph&lt;/td&gt;&lt;td&gt;Shelves that group items / agreed concepts and relationship rules / connected facts such as “this tool was created by this team and uses this dataset.”&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Version and provenance&lt;/td&gt;&lt;td&gt;Which edition is it, and where did it come from? Record relevant source, changes, contributors and review evidence.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Reproducibility&lt;/td&gt;&lt;td&gt;Can someone repeat the documented analysis with the stated data, code, configuration and environment? Reproducing an output does not prove it is scientifically correct.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Open source / open data&lt;/td&gt;&lt;td&gt;Access and reuse depend on the relevant licence and conditions. Publicly visible does not automatically mean unrestricted reuse.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;FAIR: four signs on the library door&lt;/h3&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;health-fair&quot; role=&quot;img&quot; aria-label=&quot;Findable: catalogue label. Accessible: clear access route. Interoperable: shared meanings. Reusable: licence and context.&quot;&gt;&lt;/svg&gt;
    &lt;p&gt;FAIR means &lt;strong&gt;Findable, Accessible, Interoperable and Reusable&lt;/strong&gt;. Think identifiers and rich metadata; a clear way to retrieve items; shared meanings; and enough licence, provenance and context to reuse them. Accessible can still require authentication and authorisation. FAIR does not automatically mean open, accurate or clinically validated.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;Source: &lt;a href=&quot;https://www.gofair.foundation/fair-principles&quot;&gt;GO FAIR Foundation: FAIR Guiding Principles&lt;/a&gt;. The library metaphor and product exercises are original applications to the JD.&lt;/p&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🪪 A toy catalogue card · “Community Trend Plotter”&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Invented example:&lt;/strong&gt; a tool that plots weekly counts from a CSV file. No real patient data or verified product claims are used.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Card field&lt;/th&gt;&lt;th&gt;Example or question&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Identity and purpose&lt;/td&gt;&lt;td&gt;Stable identifier, title, type and a plain description of the task it supports.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Population and context&lt;/td&gt;&lt;td&gt;Which settings and data assumptions have been evaluated? “Works everywhere” is not evidence.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Inputs and outputs&lt;/td&gt;&lt;td&gt;Expected dates, areas and counts; produces a trend chart. Missing values must not silently become zero.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Version and environment&lt;/td&gt;&lt;td&gt;Release, dependencies and setup instructions. Link the documentation for the same version.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Licence and access&lt;/td&gt;&lt;td&gt;Exact applicable licence or access conditions; verify permission instead of guessing.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Owner and evidence&lt;/td&gt;&lt;td&gt;Maintainer, review date, source link, evaluation method and known limitations.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Status and support&lt;/td&gt;&lt;td&gt;Published, superseded or deprecated? Where can a user report an issue or find a replacement?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Trust signals are specific:&lt;/strong&gt; show what was reviewed, by whom, when and against which criteria. Downloads, stars and a generic “verified” badge do not establish fitness for a health use case.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;h3&gt;Every book has a life story&lt;/h3&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;health-lifecycle&quot; role=&quot;img&quot; aria-label=&quot;Draft moves to review, then publication, then updates or deprecation. Rejected reviews return for changes; removal is a separate governed decision.&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Transition&lt;/th&gt;&lt;th&gt;Example rule to agree&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Draft → review&lt;/td&gt;&lt;td&gt;Contributor supplies required metadata and source evidence.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Review → published&lt;/td&gt;&lt;td&gt;Authorised curator checks the agreed criteria. Missing evidence returns the item for changes.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Published → updated&lt;/td&gt;&lt;td&gt;Record the version and change history; material changes trigger the appropriate review.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Published → deprecated&lt;/td&gt;&lt;td&gt;Explain why it is no longer recommended, the date and any replacement. Preserve useful history.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Removal&lt;/td&gt;&lt;td&gt;Use an agreed authority and reason, for example a rights or security issue. Removal and deprecation have different effects.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;AI is the library assistant; the curator owns the review&lt;/h3&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;health-ai&quot; role=&quot;img&quot; aria-label=&quot;AI proposes metadata with evidence; a curator reviews it and either approves or returns it. Only approved content is published in this teaching example.&quot;&gt;&lt;/svg&gt;
    &lt;p&gt;A proposed starting policy is to let AI suggest tags or descriptions, attach source evidence and send suggestions to a curator. A low-confidence or unsupported claim needs review; a high model score alone is not proof. Decide thresholds using representative labelled examples, error consequences and an agreed evaluation process.&lt;/p&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;✅ Turn the picture into acceptance criteria&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Hypothetical story:&lt;/strong&gt; As a curator, I want to review suggested metadata so users see an accountable description.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Scenario&lt;/th&gt;&lt;th&gt;Observable result&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Missing evidence&lt;/td&gt;&lt;td&gt;Given a suggestion without support, when it is processed, then it remains pending and the missing evidence is visible.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Curator approval&lt;/td&gt;&lt;td&gt;Given an authorised reviewer and a complete review, when they approve, then the approved revision is published and the reviewer, time, version and source are recorded.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Permission or failure&lt;/td&gt;&lt;td&gt;An unauthorised publish request is rejected. A failed AI service does not publish incomplete metadata; the item stays available for the agreed manual process.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Performance and quality&lt;/td&gt;&lt;td&gt;Agree target response times, workload, reliability and evaluation thresholds with the team; do not copy arbitrary percentages into requirements.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;This human-review policy is a design example, not a universal legal requirement. Agree the actual controls with the product owner, domain specialists and governance team.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;📏 How would we know the marketplace helps?&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Question&lt;/th&gt;&lt;th&gt;Candidate evidence&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Can users find something suitable?&lt;/td&gt;&lt;td&gt;Task success and time to a suitable artifact during observed user tasks; relevance judgments on representative queries.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Can users evaluate it?&lt;/td&gt;&lt;td&gt;Whether users identify licence, version, limitations and suitability correctly.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Can users adopt it?&lt;/td&gt;&lt;td&gt;Successful completion of an agreed setup or example workflow. A download alone is not adoption.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Is curation sustainable?&lt;/td&gt;&lt;td&gt;Review time, stale listings, broken links and outstanding corrections.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Does AI help safely?&lt;/td&gt;&lt;td&gt;Accepted versus corrected suggestions, unsupported claims and errors by artifact type or language, with human-reviewed evaluation examples.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;Set baselines and targets with stakeholders. These are proposed measurement choices; their usefulness must be tested.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Draw a listing card for the imaginary tool. Add one listing rule, one curator story, three criteria and one success measure. Explain which unknown you would validate first.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your experience:&lt;/strong&gt; modelling, acceptance criteria, workshop facilitation and delivery coordination. Be clear if catalogues or AI-feature requirements are new to you.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“Why build a marketplace if an AI assistant can find tools?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See a balanced answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“I would test real discovery tasks with practitioners. A curated catalogue may add versioned metadata, traceable sources, explicit review criteria and lifecycle ownership. A general assistant may be enough for broad exploration. I would compare task success, trust, maintenance cost and integration effort before recommending build, adopt or extend.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; explain when the marketplace adds value and how you would test that assumption.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes · final interview rehearsal&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;&lt;strong&gt;“What qualifies a tool for listing?”&lt;/strong&gt; Explain minimum metadata, rights, evidence, ownership and transparent review scope.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“A popular tool is no longer maintained. Remove it?”&lt;/strong&gt; Assess risk and policy; explain warning, deprecation, replacement, communication and who decides.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“How do you choose AI confidence thresholds?”&lt;/strong&gt; Start with the error consequences and evaluation set; avoid treating an uncalibrated score as probability.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“What would your first two weeks look like?”&lt;/strong&gt; Interview the three user groups, map journeys, test a sample artifact model, compare existing products and prepare a small validated backlog.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;Use 10 minutes for your picture, 10 for two spoken answers and 10 for questions to ask the interviewer.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;❓ Questions you can ask the interviewer&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;&lt;li&gt;Which public-health users and tasks are the first priority?&lt;/li&gt;&lt;li&gt;Which artifact types and existing repositories are in scope?&lt;/li&gt;&lt;li&gt;Who owns curation decisions, maintenance and community engagement?&lt;/li&gt;&lt;li&gt;What data sensitivity, countries and governance rules apply?&lt;/li&gt;&lt;li&gt;Which discovery or AI-assisted problems have evidence already, and which remain hypotheses?&lt;/li&gt;&lt;li&gt;What would a successful first release achieve for users?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;p class=&quot;text-small&quot;&gt;This chapter applies the supplied JD’s marketplace, lifecycle, discovery and AI-review requirements. The example workflow is a proposal to validate. Healthcare sources were checked on 29 October 2026; use the linked primary sources for updates.&lt;/p&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;10&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can connect the domain to a marketplace feature and explain the trade-offs.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;hr&gt;
  &lt;div class=&quot;reading-time&quot;&gt;&lt;p&gt;&lt;strong&gt;Your daily rhythm&lt;/strong&gt;&lt;/p&gt;&lt;div class=&quot;time-strip&quot; aria-label=&quot;30 minutes: 10 minutes learn, 15 minutes practise, 5 minutes speak&quot;&gt;&lt;span&gt;📖 Learn&lt;br&gt;10 min&lt;/span&gt;&lt;span&gt;✏️ Practise&lt;br&gt;15 min&lt;/span&gt;&lt;span&gt;🎤 Speak&lt;br&gt;5 min&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;text-small&quot;&gt;Day 7 uses its own rehearsal plan. Examples are hypothetical; use your own facts. Days 8–10 include their own sources and extra questions. Full BA/PO/SM reference notes remain below.&lt;/p&gt;&lt;p id=&quot;annie-progress&quot; aria-live=&quot;polite&quot;&gt;0 of 10 days completed&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

(() =&gt; {
const root=document.getElementById(&#x27;annie-book&#x27;);
root.querySelectorAll(&#x27;table&#x27;).forEach(table=&gt;{const wrap=document.createElement(&#x27;div&#x27;);wrap.className=&#x27;table-responsive&#x27;;table.before(wrap);wrap.appendChild(table);});
const ns=&#x27;http://www.w3.org/2000/svg&#x27;;
const colors=[&#x27;var(--viz-series-1)&#x27;,&#x27;var(--viz-series-2)&#x27;,&#x27;var(--viz-series-3)&#x27;];
function node(tag,attrs,parent,txt){const e=document.createElementNS(ns,tag);Object.entries(attrs||{}).forEach(([k,v])=&gt;e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;parent.appendChild(e);return e;}
function text(s,x,y,t,cls=&#x27;&#x27;){return node(&#x27;text&#x27;,{x,y,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:cls},s,t);}
function path(s,d,extra={}){return node(&#x27;path&#x27;,{d,fill:&#x27;none&#x27;,stroke:&#x27;var(--border)&#x27;,&#x27;stroke-width&#x27;:2,...extra},s);}
function box(s,x,y,w,h,label,detail,color=0){node(&#x27;rect&#x27;,{x,y,width:w,height:h,rx:14,fill:colors[color%3],&#x27;fill-opacity&#x27;:.14},s);text(s,x+w/2,y+27,label,&#x27;emphasis&#x27;);if(detail)text(s,x+w/2,y+48,detail,&#x27;minor&#x27;);}
function chain(s,W,items,opts={}){const cols=W&lt;680?1:items.length;const gap=14,pad=4,w=(W-pad*2-gap*(cols-1))/cols;const rowH=86;items.forEach((it,i)=&gt;{const col=i%cols,row=Math.floor(i/cols),x=pad+col*(w+gap),y=12+row*rowH;box(s,x,y,w,64,it[0],it[1],it[2]||0);if(opts.arrows!==false&amp;&amp;col&lt;cols-1&amp;&amp;i&lt;items.length-1)text(s,x+w+gap/2,y+39,&#x27;→&#x27;);if(opts.arrows!==false&amp;&amp;col===0&amp;&amp;row&gt;0)text(s,x+w/2,y-3,&#x27;↓&#x27;);});return Math.ceil(items.length/cols)*rowH+4;}
function draw(s){const W=Math.round(s.getBoundingClientRect().width);if(W&lt;80)return;const scene=s.dataset.scene;s.replaceChildren();let H=200;
if(scene===&#x27;detective&#x27;){H=chain(s,W,[[&#x27;Request&#x27;,&#x27;“Add a button”&#x27;],[&#x27;Why?&#x27;,&#x27;What is difficult?&#x27;],[&#x27;Need&#x27;,&#x27;What must improve?&#x27;],[&#x27;Check&#x27;,&#x27;What proves it?&#x27;]]);}
if(scene===&#x27;checks&#x27;){H=chain(s,W,[[&#x27;Verification&#x27;,&#x27;Is it clear?&#x27;,0],[&#x27;Validation&#x27;,&#x27;Is it the right need?&#x27;,1]],{arrows:false});}
