&lt;h2&gt;Day 1 BA foundations and requirements discovery&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; explain how you move from a business problem to shared, testable requirements.&lt;/p&gt;
&lt;h3&gt;Core knowledge&lt;/h3&gt;
&lt;p&gt;Business analysis connects a need to a change that creates value. BACCM provides six prompts: &lt;strong&gt;Change, Need, Solution, Value, Stakeholder and Context&lt;/strong&gt;. Elicitation discovers information; analysis examines it; validation checks that it addresses the need. Requirements verification checks the quality of their expression, such as consistency and clarity.&lt;/p&gt;
&lt;p&gt;Know the requirement levels:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Business:&lt;/strong&gt; the desired organisational result.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Stakeholder:&lt;/strong&gt; what a particular person or group needs.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Functional:&lt;/strong&gt; what the solution must do.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Non-functional:&lt;/strong&gt; qualities and constraints, such as performance or accessibility.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Transition:&lt;/strong&gt; temporary needs for moving to the future state, such as migration or training.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Traceability connects a need, requirements, design and delivered behaviour so changes can be assessed. Sources: &lt;a href=&quot;https://www.iiba.org/knowledgehub/the-business-analysis-standard/&quot;&gt;IIBA Business Analysis Standard&lt;/a&gt; and &lt;a href=&quot;https://www.iiba.org/knowledgehub/the-business-analysis-standard/4-implementing-business-analysis/4-4-understanding-requirements-and-designs/&quot;&gt;IIBA requirements and designs&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Worked practice example&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical case:&lt;/strong&gt; an operations manager asks for an “Export all cases” button.&lt;/p&gt;
&lt;p&gt;Do not assume that the button is the need. Ask what decision the export supports, who needs it, how often, what information is necessary, and what happens today.&lt;/p&gt;
&lt;p&gt;Possible findings:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Business need: reduce time spent preparing a daily workload summary.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Stakeholder need: supervisors need to see work awaiting assignment.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Functional requirement: filter unassigned cases by team and age.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Non-functional requirement: prevent users from accessing another team&amp;#39;s restricted cases.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Transition requirement: train supervisors on the new workflow.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Exporting everything may remain an option, but so may a filtered view. Validate the need before choosing.&lt;/p&gt;
&lt;h3&gt;Your exercise&lt;/h3&gt;
&lt;p&gt;Choose an actual recent-project feature. Write:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;The original request and the underlying problem.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Who was affected and what evidence you gathered.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;One requirement at each relevant level.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;One assumption you checked and one exception you discovered.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;How you confirmed shared understanding.&lt;/p&gt;
&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Feature] / [Need] / [Stakeholders] / [Evidence] / [Decision] / [Outcome].&lt;/p&gt;
&lt;h3&gt;Interview questions and answer tips&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Lead question: “How do you handle unclear requirements?”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Build your answer around: clarify the desired outcome → identify affected users and constraints → inspect the current process → use examples or a model → resolve assumptions → agree acceptance conditions.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Opening you can adapt:&lt;/strong&gt; “I first clarify what decision or outcome the stakeholder needs. In [project], the initial request was [request]. I used [actual method] to uncover [specific ambiguity], then agreed [decision] with [people].”&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you know requirements are complete?”&lt;/strong&gt; Discuss completeness for the current scope: normal paths, exceptions, rules, permissions, data, integrations and quality needs. Explain how you expose unresolved questions. Avoid claiming that every requirement is permanently complete before delivery.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What if the stakeholder proposes the wrong solution?”&lt;/strong&gt; Avoid calling them wrong. Explain the underlying need, evidence, alternatives and trade-offs, then agree a direction with the decision owner.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Make your answer stronger:&lt;/strong&gt; name the ambiguity and the artefact that resolved it. “I held meetings” explains activity; “the walkthrough exposed two meanings of ‘closed case’” explains the value of the activity.&lt;/p&gt;
&lt;h3&gt;Optional extension&lt;/h3&gt;
&lt;p&gt;Draw a five-step current process and a proposed future process. Mark handoffs, delays, decisions and exception paths.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can you explain the difference between a requested feature and a business need in under one minute?&lt;/p&gt;
&lt;h2&gt;Day 2 Stories acceptance criteria and UAT&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; demonstrate how you make work understandable, small enough to deliver, and verifiable.&lt;/p&gt;
&lt;h3&gt;Core knowledge&lt;/h3&gt;
&lt;p&gt;An epic is a broad area of work. A user story expresses a valuable user need; a task describes implementation work. Naming conventions vary, so explain your team&amp;#39;s usage.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;INVEST&lt;/strong&gt; is a quality heuristic:&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Letter&lt;/th&gt;
&lt;th&gt;Meaning&lt;/th&gt;
&lt;th&gt;Question to ask&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;I&lt;/td&gt;
&lt;td&gt;Independent&lt;/td&gt;
&lt;td&gt;Can this be delivered with minimal coupling?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N&lt;/td&gt;
&lt;td&gt;Negotiable&lt;/td&gt;
&lt;td&gt;Can the team discuss the best solution?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;V&lt;/td&gt;
&lt;td&gt;Valuable&lt;/td&gt;
&lt;td&gt;Who benefits and why?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;E&lt;/td&gt;
&lt;td&gt;Estimable&lt;/td&gt;
&lt;td&gt;Is there enough understanding to forecast effort?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;S&lt;/td&gt;
&lt;td&gt;Small&lt;/td&gt;
&lt;td&gt;Can it fit into a useful delivery slice?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;T&lt;/td&gt;
&lt;td&gt;Testable&lt;/td&gt;
&lt;td&gt;Can we observe whether it works?&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Independence is an aim, not permission to hide real dependencies. Source: &lt;a href=&quot;https://xp123.com/invest-in-good-stories-and-smart-tasks/&quot;&gt;Bill Wake on INVEST&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Acceptance criteria&lt;/strong&gt; express item-specific expectations. Given–When–Then structures an example: initial context, action/event, observable result. A business rule can apply across multiple stories; a test case supplies concrete data and steps to check behaviour. Source: &lt;a href=&quot;https://cucumber.io/docs/gherkin/reference/&quot;&gt;Cucumber Gherkin reference&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Worked practice example&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical story:&lt;/strong&gt; “As an authorised investigator, I want to assign an unassigned case to myself so that ownership of the investigation is clear.”&lt;/p&gt;
&lt;p&gt;Three example criteria:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Given an unassigned case I am permitted to access, when I claim it, then I become its assigned owner and the displayed status updates.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Given another investigator has already claimed the case, when I attempt to claim it, then ownership remains unchanged and I receive a clear conflict message.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Given I lack access to a case, when I attempt to claim it, then the request is denied without exposing restricted case details.&lt;/p&gt;
&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;Candidate quality requirement: “95% of claim requests complete within two seconds under the agreed test load.” These numbers are illustrative; a real requirement needs stakeholder justification, workload definition and technical validation.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Vertical splitting:&lt;/strong&gt; deliver a usable basic claim workflow across the necessary layers, then add separately valuable capabilities such as reassignment or bulk actions. Separate database, API and UI tasks alone do not necessarily deliver user value.&lt;/p&gt;
&lt;h3&gt;UAT practice approach&lt;/h3&gt;
&lt;p&gt;For interview preparation, explain UAT as checking fitness for the intended business use. Agree users, scenarios, environment, data, responsibilities and exit conditions. Link scenarios to requirements. Triage findings into defects, misunderstandings or change requests; do not change the classification merely to protect a release date. Recheck fixes and record unresolved limitations and the authorised release decision.&lt;/p&gt;
&lt;p&gt;If you list UAT coordination in your CV, Prepare what you personally organised and who had acceptance or release authority.&lt;/p&gt;
&lt;h3&gt;Your exercise&lt;/h3&gt;
&lt;p&gt;Take one real story and write three criteria. Include an exception and permission or data condition. Link each criterion to a test scenario.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Story] / [Criteria] / [Test data] / [Exception] / [UAT outcome].&lt;/p&gt;
&lt;h3&gt;Interview questions and answer tips&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Lead question: “What makes a good user story?”&lt;/strong&gt; Explain the user and value, then use two INVEST checks to improve a specific story. Do not stop after expanding the acronym.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What if a story is too large?”&lt;/strong&gt; Identify smaller user outcomes, workflow steps or rule variants. Keep essential controls and quality intact.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“A stakeholder rejects a feature even though the tests pass. What do you do?”&lt;/strong&gt; Check whether the tests reflect the agreed business need, whether a scenario was missed, and whether expectations changed. Bring evidence before deciding whether it is a defect or new scope.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What is acceptance criteria versus Definition of Done?”&lt;/strong&gt; Criteria describe the item; Done is the shared quality standard for the Increment. Passing one story&amp;#39;s criteria does not excuse failing that standard. Reference: &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stronger phrasing:&lt;/strong&gt; “I reviewed coverage for [specific scenario] and found [gap]. We agreed [expected behaviour], updated [artefact] and verified [actual outcome].”&lt;/p&gt;
&lt;h3&gt;Optional extension&lt;/h3&gt;
&lt;p&gt;Rewrite one oversized epic into three valuable slices. Explain what each slice lets a user do and which dependencies remain.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can another person decide pass or fail without asking what you meant?&lt;/p&gt;
&lt;h2&gt;Day 3 Agile Scrum and accountabilities&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; connect your BA/Scrum Master experience to accurate accountabilities and practical delivery decisions.&lt;/p&gt;
&lt;h3&gt;Core knowledge&lt;/h3&gt;
&lt;p&gt;Agile emphasises collaboration, feedback, useful software and adapting to change. Scrum is a framework for applying an empirical approach; a collection of Jira tickets and meetings alone does not demonstrate agility. Simplicity means avoiding unnecessary work while preserving what the outcome requires. Sources: &lt;a href=&quot;https://agilemanifesto.org/&quot;&gt;Agile Manifesto&lt;/a&gt; and &lt;a href=&quot;https://agilemanifesto.org/principles.html&quot;&gt;Agile principles&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Scrum uses &lt;strong&gt;transparency, inspection and adaptation&lt;/strong&gt; and the values commitment, focus, openness, respect and courage.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;PO:&lt;/strong&gt; accountable for product value and effective Product Backlog management.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Developers:&lt;/strong&gt; plan and adapt Sprint work and create a usable Increment.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Scrum Master:&lt;/strong&gt; establishes Scrum and supports team effectiveness.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;BA:&lt;/strong&gt; a job or skill contribution, not an additional Scrum accountability.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Artifact commitments: &lt;strong&gt;Product Backlog → Product Goal; Sprint Backlog → Sprint Goal; Increment → Definition of Done.&lt;/strong&gt; Refinement is ongoing work, not a prescribed event. Definition of Ready is an optional practice. Source: &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Events you should be able to explain&lt;/h3&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Event&lt;/th&gt;
&lt;th&gt;What to focus on in an interview&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Sprint&lt;/td&gt;
&lt;td&gt;A timebox of one month or less for working toward a goal and producing value&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Planning&lt;/td&gt;
&lt;td&gt;Agree why the Sprint matters, what is feasible and how the work will be approached&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Daily Scrum&lt;/td&gt;
&lt;td&gt;Developers inspect progress toward the Sprint Goal and adapt their plan; it is not a manager&amp;#39;s status collection&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Review&lt;/td&gt;
&lt;td&gt;Inspect outcomes with stakeholders and discuss what should change&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Retrospective&lt;/td&gt;
&lt;td&gt;Improve quality and effectiveness through changes to how the team works&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Planning is collaborative. Developers select work through discussion with the PO and plan how to deliver it. The Review is a working session rather than only a presentation. Sources: &lt;a href=&quot;https://www.scrum.org/resources/what-is-sprint-planning&quot;&gt;Scrum.org Sprint Planning&lt;/a&gt;, &lt;a href=&quot;https://www.scrum.org/resources/what-is-a-sprint-review&quot;&gt;Scrum.org Sprint Review&lt;/a&gt;, and &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Worked practice scenario&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical case:&lt;/strong&gt; a stakeholder requests an urgent report halfway through a Sprint.&lt;/p&gt;
&lt;p&gt;A useful answer starts with the reason for urgency. Is it an incident, a real deadline, or a preference? Clarify the consequence of waiting. Discuss options with the PO and Developers, assess the Sprint Goal and displaced work, and make the trade-off visible. Consider a smaller solution or scheduling it next. Follow agreed incident procedures where applicable.&lt;/p&gt;
&lt;p&gt;Avoid both automatic acceptance and a blanket “Agile means nothing can change.” Explain how you would protect the goal and quality while responding to evidence.&lt;/p&gt;
&lt;h3&gt;Your exercise&lt;/h3&gt;
&lt;p&gt;Write your real division of responsibilities: What did you prepare? What did the PO decide? What did Developers forecast or plan? What did you facilitate as Scrum Master?&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Event or decision] / [My contribution] / [PO accountability] / [Developer ownership] / [Outcome].&lt;/p&gt;
&lt;h3&gt;Interview questions and answer tips&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Lead question: “How did you work as both BA and Scrum Master?”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Use a concrete example of switching focus: clarifying a business rule as BA, then facilitating a dependency conversation or improvement as Scrum Master. Explain how you avoided becoming the only source of answers.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“Who decides Sprint scope?”&lt;/strong&gt; Describe collaboration, capacity and the Sprint Goal. Avoid presenting yourself as the person who unilaterally assigned all work.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you handle carry-over?”&lt;/strong&gt; Investigate size, uncertainty, interruptions, dependencies and quality work. Discuss the next decision and improvement, not merely moving a ticket.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“Is the Review a release gate?”&lt;/strong&gt; A usable Increment can be delivered before the Review. Explain the organisation&amp;#39;s actual release controls separately. Source: &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stronger phrasing:&lt;/strong&gt; “I prepared requirements and dependencies so the team could make an informed plan. The PO clarified value and priorities, and Developers assessed feasibility. When [event] occurred, I helped make [trade-off] explicit.”&lt;/p&gt;
&lt;h3&gt;Optional extension&lt;/h3&gt;
&lt;p&gt;Compare two situations from your work: one where a meeting created a decision and one where it merely reported status. Explain what you would change.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can you explain your contribution without taking accountability away from the PO or Developers?&lt;/p&gt;
&lt;h2&gt;Day 4 Product ownership prioritisation and simplicity&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; explain how you decide what deserves attention and what can wait.&lt;/p&gt;
&lt;h3&gt;Core knowledge&lt;/h3&gt;
&lt;p&gt;Use this practical vocabulary:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Output:&lt;/strong&gt; something delivered, such as a bulk-assignment feature.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Outcome:&lt;/strong&gt; a resulting change, such as less time waiting for assignment.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Product goal:&lt;/strong&gt; the future result the team is working toward.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Roadmap:&lt;/strong&gt; a communication of direction and intended outcomes over time.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Backlog:&lt;/strong&gt; work and learning opportunities that can support those outcomes.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;MVP:&lt;/strong&gt; a small viable way to test important assumptions and deliver enough value to learn.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Discovery:&lt;/strong&gt; reduce uncertainty about the problem, users and solution.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Delivery:&lt;/strong&gt; build, validate and release useful changes. Discovery continues during delivery.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Do not equate more output with more value. A sensible interview answer explains what evidence would show improvement.&lt;/p&gt;
&lt;h3&gt;MoSCoW and other prioritisation tools&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;MoSCoW:&lt;/strong&gt; Must Have, Should Have, Could Have, Won&amp;#39;t Have this time. “Must” needs a defensible consequence if omitted; “Won&amp;#39;t this time” is a boundary for an agreed timeframe, not necessarily a permanent rejection. Source: &lt;a href=&quot;https://www.agilebusiness.org/resource/what-is-moscow-prioritization/&quot;&gt;Agile Business Consortium&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;For this interview, master MoSCoW and a simple value/effort comparison before adding more scoring frameworks. Consider urgency, risk, dependencies and uncertainty alongside benefit. Scores make assumptions visible; they do not remove the need for judgment.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;KISS:&lt;/strong&gt; keep the solution simple enough to understand, maintain and validate. Do not remove necessary security, quality or exceptional behaviour to make it look simpler. This heuristic is compatible with the Agile principle of avoiding unnecessary work; it is not a required Scrum technique. Reference: &lt;a href=&quot;https://agilemanifesto.org/principles.html&quot;&gt;Agile principles&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Worked practice example&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical release:&lt;/strong&gt; users need to assign cases reliably.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Candidate&lt;/th&gt;
&lt;th&gt;Illustrative decision&lt;/th&gt;
&lt;th&gt;Reason to discuss&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Authorised single-case assignment&lt;/td&gt;
&lt;td&gt;Must&lt;/td&gt;
&lt;td&gt;Enables the primary workflow&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Prevent conflicting assignments&lt;/td&gt;
&lt;td&gt;Must&lt;/td&gt;
&lt;td&gt;Preserves reliable ownership&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Assignment history&lt;/td&gt;
&lt;td&gt;Must if required by agreed controls&lt;/td&gt;
&lt;td&gt;Explain the actual control obligation&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Bulk assignment&lt;/td&gt;
&lt;td&gt;Should&lt;/td&gt;
&lt;td&gt;Improves efficiency; a single-case workaround exists&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Cosmetic personalisation&lt;/td&gt;
&lt;td&gt;Could or later&lt;/td&gt;
&lt;td&gt;Less directly connected to the current goal&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;These priorities belong to this scenario. Validate actual user impact, constraints and effort before using them on a real product.&lt;/p&gt;
&lt;h3&gt;Your exercise&lt;/h3&gt;
&lt;p&gt;Choose two competing requests from your experience. State the goal, benefits, cost or effort assumptions, dependencies, risk and cost of delay. Explain your recommendation and who made the final decision.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Goal] / [Options] / [Evidence] / [Trade-off] / [Decision owner] / [Result].&lt;/p&gt;
&lt;h3&gt;Interview questions and answer tips&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Lead question: “How do you prioritise a backlog?”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Start with the goal, not the method name. Explain whose needs you considered, what evidence you used, how you handled constraints and how priorities were revisited.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What if everything is a Must?”&lt;/strong&gt; Ask what would genuinely prevent a viable release, whether an acceptable workaround exists, and which timeframe is being discussed.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you know a feature was successful?”&lt;/strong&gt; Identify an outcome measure and a quality guardrail. Example: assignment time alongside incorrect-assignment rate. State whether you actually measured these or would propose them.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“Build or buy?”&lt;/strong&gt; Compare fit, integration, delivery effort, ownership, maintenance and exit costs. Include adopting or extending an existing capability, and identify assumptions needing validation.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Weak:&lt;/strong&gt; “I used MoSCoW and delivered the highest priorities.”&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stronger:&lt;/strong&gt; “Our goal was [goal]. I compared [options] using [evidence]. I recommended [choice] because [reason], made [trade-off] visible, and aligned the decision with [owner]. The actual result was [evidence].”&lt;/p&gt;
&lt;h3&gt;Optional extension&lt;/h3&gt;
&lt;p&gt;Write a one-sentence product goal and a six-item backlog. Remove two items using KISS and explain why the remaining set still supports the goal.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can you defend a decision to delay a popular feature?&lt;/p&gt;
&lt;h2&gt;Day 5 Project delivery risk and dependencies&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; show that you make delivery uncertainty visible and help people act before problems grow.&lt;/p&gt;
&lt;h3&gt;Core knowledge&lt;/h3&gt;
&lt;p&gt;Project management coordinates objectives, scope, people, timing, cost and risk within the organisation&amp;#39;s governance. A forecast reflects current evidence and uncertainty; it should be updated when assumptions change.&lt;/p&gt;
&lt;p&gt;A &lt;strong&gt;risk&lt;/strong&gt; is an uncertain event or condition affecting objectives; an &lt;strong&gt;issue&lt;/strong&gt; is a current problem. An &lt;strong&gt;assumption&lt;/strong&gt; needs validation. A &lt;strong&gt;dependency&lt;/strong&gt; is a reliance on another activity, team or decision. These can interact: a dependency may create a risk and become an issue when missed. Source: &lt;a href=&quot;https://www.pmi.org/learning/library/integrated-project-risk-issue-management-6303&quot;&gt;PMI on integrated risk and issue management&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;RAID commonly means Risks, Assumptions, Issues and Dependencies; organisations sometimes use different expansions. Explain your team&amp;#39;s actual usage.&lt;/p&gt;
&lt;h3&gt;Risk assessment and responses&lt;/h3&gt;
&lt;p&gt;Describe risk as: &lt;strong&gt;Because of [cause], [uncertain event] may happen, resulting in [impact].&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Assess likelihood and impact using agreed definitions. A simple score such as likelihood × impact is an illustrative ranking device, not a probability or exact measure of loss. Keep the reasoning, owner, response, trigger and review date beside it. Assess residual risk after the response. Reference: &lt;a href=&quot;https://csrc.nist.gov/pubs/sp/800/30/r1/final&quot;&gt;NIST risk assessment guidance&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Common responses to threats: avoid the exposure, reduce likelihood or impact, transfer an agreed exposure, or accept it with appropriate authority and monitoring. Contingency explains what to do if the event occurs.&lt;/p&gt;
&lt;h3&gt;Worked risk matrix&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical scale:&lt;/strong&gt; likelihood 1 = unlikely, 2 = plausible, 3 = likely. Impact 1 = small local disruption, 2 = Sprint objective affected, 3 = major release or control objective affected. Product = review score only; no universal “high risk” cutoff is implied.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Illustrative risk&lt;/th&gt;
&lt;th&gt;L × I&lt;/th&gt;
&lt;th&gt;Proposed response and trigger&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;An external API contract may change, invalidating integration assumptions&lt;/td&gt;
&lt;td&gt;2 × 3 = 6&lt;/td&gt;
&lt;td&gt;Confirm contract owner, versioning and change notice; escalate if agreement is absent by the planning checkpoint&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Business users may be unavailable for UAT&lt;/td&gt;
&lt;td&gt;2 × 2 = 4&lt;/td&gt;
&lt;td&gt;Agree deputies and test slots; review availability before the test window&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Legacy data may lack required ownership fields&lt;/td&gt;
&lt;td&gt;3 × 3 = 9&lt;/td&gt;
&lt;td&gt;Profile a sample early and agree remediation; revisit release scope if mapping remains unresolved&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;The lowest score still deserves action if its consequence exceeds an agreed tolerance.&lt;/p&gt;
&lt;h3&gt;Change impact and status communication&lt;/h3&gt;
&lt;p&gt;For a scope request, consider value, requirements, data, interfaces, tests, effort, dependencies, timing and ongoing support. Present options to the appropriate decision owner and update agreed records.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical status update:&lt;/strong&gt; “Case assignment is ready for business validation. The integration dependency remains unresolved and threatens the planned test window. We can use a limited test stub now, but full end-to-end testing still requires the real interface. I recommend confirming its owner and delivery date today; otherwise we should revise the test forecast.”&lt;/p&gt;
&lt;h3&gt;Your exercise&lt;/h3&gt;
&lt;p&gt;Write one real risk and one real issue from your work. Explain the difference in actions, ownership and communication.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Cause/event/impact] / [Evidence] / [Response] / [Owner] / [Trigger] / [Residual exposure] / [Outcome].&lt;/p&gt;
&lt;h3&gt;Interview questions and answer tips&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Lead question: “Tell me about a risk you identified early.”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Show the signal you noticed, why it mattered, the options you proposed and how you followed through. If the risk never occurred, explain the evidence for reduced exposure rather than claiming an unprovable avoided loss.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“A dependency team will be late. What do you do?”&lt;/strong&gt; Establish the real dependency, assess affected outcomes, explore decoupling or sequencing, agree owners and checkpoints, and update the forecast.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“When do you escalate?”&lt;/strong&gt; When impact or decisions exceed your authority, agreed thresholds are crossed, or action is needed by a deadline. Escalate with facts, options and a recommendation.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you keep a fixed date?”&lt;/strong&gt; Explain scope and sequence options, capacity evidence, quality constraints and decision authority. Avoid guaranteeing an outcome before assessing feasibility.&lt;/p&gt;
&lt;h3&gt;Optional extension&lt;/h3&gt;
&lt;p&gt;Choose one dependency and write a request to its owner: what is needed, why, when, how completion will be verified, and what happens if it slips.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Does your risk log cause action, or merely record concern?&lt;/p&gt;
&lt;h2&gt;Day 6 Models workshops and technical analysis&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; choose a model that resolves a real question and facilitate a useful decision.&lt;/p&gt;
&lt;h3&gt;Core knowledge&lt;/h3&gt;
&lt;p&gt;Choose the smallest artefact that answers the question:&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Technique&lt;/th&gt;
&lt;th&gt;Useful question&lt;/th&gt;
&lt;th&gt;Practice example&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Process flow&lt;/td&gt;
&lt;td&gt;What happens, in what order, and where are the decisions?&lt;/td&gt;
&lt;td&gt;How is a case assessed and assigned?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;State model&lt;/td&gt;
&lt;td&gt;What states exist and which transitions are allowed?&lt;/td&gt;
&lt;td&gt;Open → In review → Resolved → Reopened&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Entity relationship model&lt;/td&gt;
&lt;td&gt;What things exist and how are they related?&lt;/td&gt;
&lt;td&gt;Case, Investigator, Assignment and Comment&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Data dictionary&lt;/td&gt;
&lt;td&gt;What does each field mean and what rules apply?&lt;/td&gt;
&lt;td&gt;ownerId, status, createdAt, permitted values&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Sequence diagram&lt;/td&gt;
&lt;td&gt;Who calls whom and what happens on failure?&lt;/td&gt;
&lt;td&gt;UI → service → external fraud system&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Wireframe&lt;/td&gt;
&lt;td&gt;Can users understand and complete the workflow?&lt;/td&gt;
&lt;td&gt;Ownership controls and conflict messages&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Journey map&lt;/td&gt;
&lt;td&gt;What is the user&amp;#39;s experience across steps and channels?&lt;/td&gt;
&lt;td&gt;From receiving an alert to completing follow-up&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;These examples are illustrative; use the actual states, entities and interfaces from your projects.&lt;/p&gt;
&lt;h3&gt;A practical workshop structure&lt;/h3&gt;
&lt;p&gt;Before: define the decision, invite people with relevant knowledge and authority, and send a concise example.&lt;/p&gt;
&lt;p&gt;During: agree the problem, walk through a real scenario, expose assumptions, compare alternatives, and record unresolved points. Invite quieter participants; separate evidence from preference.&lt;/p&gt;
&lt;p&gt;After: circulate decisions, owners and open actions. Update requirements or models and confirm that people interpret the result consistently.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Five Whys&lt;/strong&gt; asks successive causal questions to move beyond symptoms. Five is not a mandatory count. Check answers against evidence and allow multiple contributing causes. Source: &lt;a href=&quot;https://www.lean.org/lexicon-terms/5-whys/&quot;&gt;Lean Enterprise Institute&lt;/a&gt;.&lt;/p&gt;
&lt;h3&gt;Technical analysis checklist&lt;/h3&gt;
&lt;p&gt;For API and data-mapping experience, Prepare to explain a specific mapping, rather than only naming tools:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Source and target fields, meanings, types, required values and transformations.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Missing or conflicting data and which system is authoritative.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Permissions, errors, timeouts, retries and duplicate requests.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;What a user sees when an integration fails.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;How a business scenario is checked across the systems.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;You do not need to claim architecture ownership to explain how you clarified these behaviours with Engineering.&lt;/p&gt;
&lt;h3&gt;Worked practice example&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical problem:&lt;/strong&gt; reopened cases appear in a queue without an owner.&lt;/p&gt;
&lt;p&gt;A state model prompts: does reopening retain the previous owner? A data model prompts: is current ownership a field or a separate assignment record? A process walkthrough prompts: who should act next? A wireframe prompts: how does the user understand the state?&lt;/p&gt;
&lt;p&gt;This is why different models can uncover different gaps. Do not create all four unless the questions warrant them.&lt;/p&gt;
&lt;h3&gt;Your exercise&lt;/h3&gt;
&lt;p&gt;Choose an actual previous-project mock-up or previous-project integration. Draw one model and list two questions it would help answer. Prepare a short workshop agenda to resolve one of them.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Question] / [Chosen model] / [Participants] / [Disagreement] / [Decision] / [Updated artefact].&lt;/p&gt;
&lt;h3&gt;Interview questions and answer tips&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Lead question: “How do you choose an analysis technique?”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Name the uncertainty first. For unclear ownership transitions, use a state model; for confusing handoffs, use a process flow. Explain what the artefact helped people decide.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you manage conflicting stakeholders?”&lt;/strong&gt; Establish their goals and constraints, use shared evidence and criteria, then clarify who owns the decision. Consensus is useful but not always possible.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you explain a technical issue to a non-technical stakeholder?”&lt;/strong&gt; Start with the user or delivery impact, explain options, and use technical detail only where it changes the decision.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What did your data mapping actually cover?”&lt;/strong&gt; Give one field or rule, its source, transformation or validation, exception behaviour and verification.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stronger phrasing:&lt;/strong&gt; “The model exposed [specific gap]. I brought [people] together to resolve [decision], updated [artefact] and checked the interpretation through [actual method].”&lt;/p&gt;
&lt;h3&gt;Optional extension&lt;/h3&gt;
&lt;p&gt;Explain the same integration problem twice: once to an engineer and once to a business sponsor. Keep the facts the same; change the detail and emphasis.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can you point to a decision your model or workshop enabled?&lt;/p&gt;
&lt;h2&gt;Day 7 Mock interview and final revision&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; give clear, credible answers without memorising a script.&lt;/p&gt;
&lt;h3&gt;Core 30 minute rehearsal&lt;/h3&gt;
&lt;p&gt;Use five minutes for your introduction, 15 minutes for three questions, and 10 minutes to score and revise the weakest answer. Answer aloud before checking your notes.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Introduction outline:&lt;/strong&gt; current role and relevant experience → two strengths supported by examples → connection to this BA role → what you want to contribute.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Draft to personalise:&lt;/strong&gt; “I am a [role] with [years] of experience in [domains]. My work includes [relevant contribution] and [collaboration example]. I am interested in this role because it combines product discovery, clear specifications and close work with design and engineering.”&lt;/p&gt;
&lt;p&gt;Add one specific outcome you can substantiate. Use Days 8–10 to prepare the domain transition.&lt;/p&gt;
&lt;h3&gt;Mock interview questions&lt;/h3&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Question&lt;/th&gt;
&lt;th&gt;What a strong answer should demonstrate&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;1. Walk me through a feature from idea to production&lt;/td&gt;
&lt;td&gt;Need, evidence, your role, requirements, decisions, validation and outcome&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;2. Tell me about a requirement you initially misunderstood&lt;/td&gt;
&lt;td&gt;Ownership, how it was discovered, repair and learning&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;3. How did you support two Agile teams?&lt;/td&gt;
&lt;td&gt;Coordination, dependency visibility and respect for team accountabilities&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;4. Two stakeholders want different priorities. What do you do?&lt;/td&gt;
&lt;td&gt;Shared criteria, options, decision rights and transparent trade-offs&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;5. What if UAT identifies a major gap just before release?&lt;/td&gt;
&lt;td&gt;Business impact, evidence, options, quality constraints and authorised decision&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;6. How do you write requirements for a feature you do not yet understand?&lt;/td&gt;
&lt;td&gt;Elicitation, assumptions, collaboration, small experiments and verification&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;7. What delivery measures would you use?&lt;/td&gt;
&lt;td&gt;A question each measure answers and the limits of interpretation&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;8. How did you use AI in BA work?&lt;/td&gt;
&lt;td&gt;The actual task, tool use, permitted information, human checks and observed result&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;9. What would you do in the first two weeks of this role?&lt;/td&gt;
&lt;td&gt;Understand users and goals, inspect current evidence, expose uncertainties and agree a small useful next step&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;10. What would you improve about your past approach?&lt;/td&gt;
&lt;td&gt;A concrete change grounded in learning rather than blaming others&amp;#x20;&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;For question 8, distinguish using AI to assist your work from defining requirements for an AI-powered product. Only claim either kind of experience when you have a real example.&lt;/p&gt;
&lt;h3&gt;Self scoring&lt;/h3&gt;
&lt;p&gt;Score each dimension 0 = absent, 1 = partly clear, 2 = clear and specific. This is a personal practice rubric, not an employer&amp;#39;s scoring system.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Dimension&lt;/th&gt;
&lt;th&gt;Check&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Directness&lt;/td&gt;
&lt;td&gt;Did I answer the actual question early?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Ownership&lt;/td&gt;
&lt;td&gt;Is my contribution distinct from the team&amp;#39;s?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Reasoning&lt;/td&gt;
&lt;td&gt;Did I explain evidence, options and trade-offs?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Specificity&lt;/td&gt;
&lt;td&gt;Did I name a scenario, artefact or decision?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Evidence and learning&lt;/td&gt;
&lt;td&gt;Is the result supported, with an honest lesson?&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Revise an answer if it lacks ownership, reasoning or evidence even when the total looks good.&lt;/p&gt;
&lt;h3&gt;Optional scenario for a full hour&lt;/h3&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical case:&lt;/strong&gt; a new resource catalog needs search, submissions, review and publication. One engineer is shared with another team, and the sponsor wants a first release in six weeks.&lt;/p&gt;
&lt;p&gt;Ask clarifying questions before making a plan: who is the first user, what outcome matters, what exists already, what defines success, what constraints are fixed, and which assumptions are most uncertain?&lt;/p&gt;
&lt;p&gt;Then outline a minimal useful journey, priority rationale, risky dependency, story with criteria, validation approach and progress update. State what you cannot responsibly forecast until you have more evidence.&lt;/p&gt;
&lt;h3&gt;Final checklist&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; My introduction fits approximately one minute&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can explain six real examples without reading a script&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I distinguish my work from PO and Developer accountabilities&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can write a testable story with an exception&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can explain one prioritisation trade-off&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can distinguish risk issue assumption and dependency&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I have no invented results or metrics in my answers&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;input disabled=&quot;&quot; type=&quot;checkbox&quot;&gt; I can state what I learned and what I would change&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;h2&gt;Answer toolkit for the whole week&lt;/h2&gt;
&lt;h3&gt;Structure a two minute experience answer&lt;/h3&gt;
&lt;p&gt;Use this flexible allocation:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;15 seconds:&lt;/strong&gt; the situation and why it mattered.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;15 seconds:&lt;/strong&gt; your responsibility and the constraint.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;60 seconds:&lt;/strong&gt; what you did and why, including the important decision.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;20 seconds:&lt;/strong&gt; the actual result and evidence.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;10 seconds:&lt;/strong&gt; what you learned.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;For a theory question, give a short definition and immediately apply it. For a hypothetical scenario, say what you would do; for past experience, say what you actually did.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Reusable answer scaffold:&lt;/strong&gt; “The problem was [specific problem], and I was responsible for [scope]. I first checked [evidence]. We considered [options]; I recommended [choice] because [reason]. I worked with [people] to [actions]. The result was [supported outcome]. I learned [lesson].”&lt;/p&gt;
&lt;h3&gt;Improve weak answers&lt;/h3&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Weak wording&lt;/th&gt;
&lt;th&gt;Better direction&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;“I gathered requirements.”&lt;/td&gt;
&lt;td&gt;Explain whose need you investigated, which ambiguity you found and how you resolved it.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I managed stakeholders.”&lt;/td&gt;
&lt;td&gt;Name the disagreement, the evidence or criteria you used and who made the decision.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I ensured quality.”&lt;/td&gt;
&lt;td&gt;Identify the specific review, acceptance condition or test gap you addressed.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I delivered on time.”&lt;/td&gt;
&lt;td&gt;Describe your contribution, dependencies and actual release evidence.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“We did everything together.”&lt;/td&gt;
&lt;td&gt;Explain your personal action while crediting the team.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I improved efficiency by 30%.”&lt;/td&gt;
&lt;td&gt;Use a number only with a reliable baseline and measurement; otherwise describe the observable result.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I followed Scrum.”&lt;/td&gt;
&lt;td&gt;Show how feedback, inspection and adaptation changed a decision.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;“I escalated the problem.”&lt;/td&gt;
&lt;td&gt;State the options, recommendation, decision needed and follow-through.&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Useful phrases: “The trade-off was…”; “The evidence I used was…”; “My contribution was…”; “The PO made the final priority decision…”; “We did not measure that directly, but the observable result was…”; “I have not done that exact case; my approach would be…”.&lt;/p&gt;
&lt;h3&gt;Six experience cards to fill in&lt;/h3&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Card&lt;/th&gt;
&lt;th&gt;CV starting point&lt;/th&gt;
&lt;th&gt;Details you must supply&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Ambiguity&lt;/td&gt;
&lt;td&gt;recent-project requirements and workshops&lt;/td&gt;
&lt;td&gt;Initial request, conflicting interpretations and resolution&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Prioritisation&lt;/td&gt;
&lt;td&gt;Roadmap alignment and backlog sequencing&lt;/td&gt;
&lt;td&gt;Competing needs, evidence, decision owner and trade-off&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Dependency&lt;/td&gt;
&lt;td&gt;Coordination across two Agile teams&lt;/td&gt;
&lt;td&gt;Reliance, warning signal, action and outcome&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;UAT&lt;/td&gt;
&lt;td&gt;Business validation and defect triage&lt;/td&gt;
&lt;td&gt;Scenario, expected behaviour, issue and final decision&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Modelling&lt;/td&gt;
&lt;td&gt;previous-project mock-ups or previous-project data mapping&lt;/td&gt;
&lt;td&gt;Question, model, gap discovered and resulting change&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Improvement&lt;/td&gt;
&lt;td&gt;BA practices or AI-assisted BA work&lt;/td&gt;
&lt;td&gt;Previous problem, your change, checks and observed benefit&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Write one real example on each card. One example may support several questions, but change the emphasis to match what was asked.&lt;/p&gt;
&lt;h2&gt;Quick reference for optional revision&lt;/h2&gt;
&lt;p&gt;These topics support your answers; do not let them replace preparation of real examples.&lt;/p&gt;
&lt;h3&gt;Delivery measures&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;WIP:&lt;/strong&gt; started work that has not finished.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Throughput:&lt;/strong&gt; completed items per unit of time.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Cycle time:&lt;/strong&gt; elapsed time from the team&amp;#39;s defined start to finish.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Work item age:&lt;/strong&gt; elapsed time since an unfinished item started.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Use consistent boundaries and inspect blocked or ageing work. These measure flow, not product value. Source: &lt;a href=&quot;https://kanbanguides.org/the-kanban-guide/&quot;&gt;Kanban Guide&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Velocity, where used, reflects a team&amp;#39;s completed estimates over a period. Avoid treating it as an individual productivity target or comparing teams with different estimation habits. Story points and velocity are not required Scrum elements. Reference: &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Practice question:&lt;/strong&gt; “Delivery is fast but users are unhappy. What would you investigate?” Consider whether the delivered work addresses the need, whether quality or usability is poor, and whether adoption barriers exist. Pair delivery measures with a user outcome and quality measure.&lt;/p&gt;
&lt;h3&gt;Other useful distinctions&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Severity versus priority:&lt;/strong&gt; severity describes impact; priority describes urgency/order of action. Explain who decides and using what criteria.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;RACI:&lt;/strong&gt; Responsible performs work; Accountable owns the result or decision; Consulted contributes input; Informed receives updates. Use it to clarify local governance, not to replace Scrum accountabilities.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;SMART objectives:&lt;/strong&gt; specific, measurable, achievable, relevant and time-bound is a common formulation. Make targets meaningful and supported by a baseline.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Prototype versus production increment:&lt;/strong&gt; a prototype helps test assumptions and may be disposable; a released capability needs its applicable quality conditions.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Business rule versus implementation:&lt;/strong&gt; express the rule and observable behaviour; collaborate with Engineering on how to implement it.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;State versus process:&lt;/strong&gt; state describes a condition; process describes activities and decisions. Both can expose missing permissions and exceptions.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Questions you can ask the interviewer&lt;/h3&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;“How are responsibilities divided between the BA, Product Owner and delivery team?”&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;“Which assumptions or decisions are most unresolved today?”&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;“What would a successful first six weeks look like?”&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;“Who validates requirements and makes acceptance or release decisions?”&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;“How much of the role is discovery compared with day-to-day delivery?”&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;“Which existing products, research or user feedback should the new BA build on?”&lt;/p&gt;
&lt;/li&gt;
&lt;/ol&gt;
&lt;h3&gt;Reference and scope notes&lt;/h3&gt;
&lt;p&gt;The practice plan reflects a Business Analyst role involving a public-health tools marketplace. Personal examples must be completed with your own facts. Definitions are refreshers; exercises and figures are learning examples.&lt;/p&gt;
&lt;p&gt;The linked sources throughout are IIBA, the Scrum Guide authors, Scrum.org, the Agile Manifesto authors, Bill Wake, Cucumber, Agile Business Consortium, PMI, NIST, Lean Enterprise Institute and Kanban Guides. Some IIBA material may require membership; the lessons here remain usable without it.&lt;/p&gt;
&lt;p&gt;Days 1–7 cover core BA, PO, Scrum Master, project-delivery and Agile preparation. Continue with the healthcare and public-health marketplace tabs on Days 8–10.&lt;/p&gt;

(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

&lt;script id=&quot;codex-visualization-carousel&quot;&gt;
  (() =&gt; {
    for (const root of document.querySelectorAll(&quot;.viz-carousel&quot;)) {
      const panels = Array.from(
        root.querySelectorAll(&quot;:scope &gt; [data-variant]&quot;),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute(&quot;role&quot;, &quot;group&quot;);
      panels.forEach((panel, index) =&gt; {
        panel.hidden = index !== 0;
        panel.setAttribute(&quot;role&quot;, &quot;group&quot;);
        if (!panel.hasAttribute(&quot;aria-label&quot;)) {
          panel.setAttribute(&quot;aria-label&quot;, panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement(&quot;div&quot;);
      controls.className = &quot;viz-carousel-controls&quot;;
      // Portable copy of the settings dropdown&#x27;s legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      &lt;button type=&quot;button&quot; class=&quot;viz-carousel-previous cursor-interaction&quot;&gt;&lt;i data-lucide=&quot;chevron-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
      &lt;details class=&quot;viz-carousel-picker&quot;&gt;
        &lt;summary class=&quot;cursor-interaction&quot;&gt;
          &lt;span class=&quot;viz-carousel-count tabular-nums&quot;&gt;&lt;/span&gt;
          &lt;span class=&quot;viz-carousel-name&quot;&gt;&lt;/span&gt;
          &lt;svg class=&quot;viz-carousel-caret&quot; width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 20 21&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot; focusable=&quot;false&quot;&gt;
            &lt;path d=&quot;M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z&quot; fill=&quot;currentColor&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;0.6&quot; /&gt;
          &lt;/svg&gt;
        &lt;/summary&gt;
        &lt;div class=&quot;viz-carousel-options&quot;&gt;&lt;/div&gt;
      &lt;/details&gt;
      &lt;button type=&quot;button&quot; class=&quot;viz-carousel-next cursor-interaction&quot;&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;`;
      const previous = controls.querySelector(&quot;.viz-carousel-previous&quot;);
      const next = controls.querySelector(&quot;.viz-carousel-next&quot;);
      const picker = controls.querySelector(&quot;.viz-carousel-picker&quot;);
      const summary = picker.querySelector(&quot;summary&quot;);
      const count = controls.querySelector(&quot;.viz-carousel-count&quot;);
      const name = controls.querySelector(&quot;.viz-carousel-name&quot;);
      const options = controls.querySelector(&quot;.viz-carousel-options&quot;);
      const status = document.createElement(&quot;span&quot;);
      status.className = &quot;sr-only&quot;;
      status.setAttribute(&quot;role&quot;, &quot;status&quot;);
      status.setAttribute(&quot;aria-live&quot;, &quot;polite&quot;);
      status.setAttribute(&quot;aria-atomic&quot;, &quot;true&quot;);
      previous.setAttribute(
        &quot;aria-label&quot;,
        root.dataset.previousLabel ?? &quot;Previous variant&quot;,
      );
      next.setAttribute(&quot;aria-label&quot;, root.dataset.nextLabel ?? &quot;Next variant&quot;);

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
        summaryPointerHandled =
          event.pointerType === &quot;mouse&quot; &amp;&amp; event.button === 0 &amp;&amp; !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener(&quot;click&quot;, (event) =&gt; {
        if (summaryPointerHandled &amp;&amp; event.detail &gt; 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) =&gt; {
        const choice = document.createElement(&quot;button&quot;);
        choice.type = &quot;button&quot;;
        choice.className = &quot;cursor-interaction&quot;;
        choice.textContent = panel.dataset.variant;
        choice.addEventListener(&quot;click&quot;, () =&gt; {
          select(index);
          summary.focus();
        });
        choice.addEventListener(&quot;pointerup&quot;, (event) =&gt; {
          if (
            picker.open &amp;&amp;
            event.pointerType === &quot;mouse&quot; &amp;&amp;
            event.button === 0 &amp;&amp;
            event.pointerId === mousePointerId

            choice.click();

        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) =&gt; {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) =&gt; {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            &quot;aria-current&quot;,
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener(&quot;click&quot;, () =&gt;
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener(&quot;click&quot;, () =&gt;
        select((active + 1) % panels.length),
      );
      picker.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key === &quot;Escape&quot; &amp;&amp; picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === &quot;ArrowDown&quot;) {
          nextIndex = index &lt; 0 ? active : (index + 1) % choices.length;
        } else if (event.key === &quot;ArrowUp&quot;) {
          nextIndex = index &lt; 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open &amp;&amp; event.key === &quot;Home&quot;) {
          nextIndex = 0;
        } else if (picker.open &amp;&amp; event.key === &quot;End&quot;) {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener(&quot;focusout&quot;, (event) =&gt; {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) =&gt; {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () =&gt; {
        mousePointerId = null;
      };
      const sizePicker = () =&gt; {
        root.style.setProperty(
          &quot;--viz-carousel-picker-height&quot;,
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener(&quot;toggle&quot;, sizePicker);
      window.addEventListener(&quot;resize&quot;, sizePicker);
      document.addEventListener(&quot;pointerdown&quot;, dismiss);
      document.addEventListener(&quot;pointerup&quot;, endPointerSelection);
      document.addEventListener(&quot;pointercancel&quot;, endPointerSelection);
      window.addEventListener(&quot;blur&quot;, endPointerSelection);
      window.addEventListener(
        &quot;pagehide&quot;,
        () =&gt; {
          document.removeEventListener(&quot;pointerdown&quot;, dismiss);
          document.removeEventListener(&quot;pointerup&quot;, endPointerSelection);
          document.removeEventListener(&quot;pointercancel&quot;, endPointerSelection);
          window.removeEventListener(&quot;blur&quot;, endPointerSelection);
          window.removeEventListener(&quot;resize&quot;, sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }

  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }

    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }

        if (storage != null) {
          const state = parseState(data.state);

          ok = true;
        }
      } catch {

      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }

      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }

    }
    if (data.type === "scroll-to") {
      const top = data.top;

        typeof top === "number" &&

          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,

        });

      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
