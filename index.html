ough Collaboratory. &lt;a href=&quot;https://pandemichub.who.int/news-room/news/item/19-03-2026-german-health-minister-nina-warken-and-who-hub-in-berlin-highlight-2025-achievements&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Hub update, 19 March 2026&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The listing should help:&lt;/strong&gt; Check the forecast target/horizon, required history, data frequency, setting, evaluated version, uncertainty and limitations. A chart of past counts is not a forecast.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · 🛤️ Compare possible scenarios&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;The user’s job:&lt;/strong&gt; A policy team and analysts need to explore possible intervention consequences.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;WHO evidence:&lt;/strong&gt; WHO’s Decision Support Simulator page describes a prototype for scenario exploration, with models contributed and validated through experts. &lt;a href=&quot;https://pandemichub.who.int/our-work/pandemic-simulator&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Decision Support Simulator&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The listing should help:&lt;/strong&gt; Check adjustable assumptions, outputs, context of validation and uncertainty. A scenario is conditional, not a promise. The simulator’s execution features are not established Marketplace requirements.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · ⚖️ Structure a risk assessment&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;The user’s job:&lt;/strong&gt; An assessment team needs a method for organising evidence and uncertainty.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;WHO evidence:&lt;/strong&gt; WHO describes risk assessment as an ongoing process of gathering, evaluating and documenting information. &lt;a href=&quot;https://www.who.int/emergencies/risk-assessment&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO risk assessment&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The listing should help:&lt;/strong&gt; Check intended hazards, evidence requirements, method version, decision roles and limits. Finding a template does not authorise the catalogue to make a public-health risk judgement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · 🤝 Reuse work and get help&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;The user’s job:&lt;/strong&gt; A practitioner needs an existing output and someone who understands how to use it.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;WHO evidence:&lt;/strong&gt; WHO’s Collaboratory community includes epidemiologists, developers, modellers and decision makers sharing knowledge and outputs. &lt;a href=&quot;https://www.who.int/initiatives/collaboratory/community&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Collaboratory community&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;The listing should help:&lt;/strong&gt; Link the resource/version to maintainers, documentation, examples and relevant communities. Ask whether help and feedback routes actually work; a person link is not an endorsement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Check coverage against the whole JD&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Journey in the JD&lt;/th&gt;&lt;th&gt;User expectation → your BA output&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Consumer: need → discovery → evaluation → adoption&lt;/td&gt;&lt;td&gt;Find something usable, not only related → task interview, constraints, compare flow and success test.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Contributor: submit → respond → update&lt;/td&gt;&lt;td&gt;Know what evidence is needed and why a draft was rejected → required fields, validation and revision flow.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Curator: review → publish → correct&lt;/td&gt;&lt;td&gt;See evidence and handle exceptions → review states, permissions, specialist escalation and audit history.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Maintainer/community: support → supersede → deprecate&lt;/td&gt;&lt;td&gt;Keep dependants informed → ownership, feedback, version relationships and transition rules.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Product team: decide → build → measure&lt;/td&gt;&lt;td&gt;Know which problem merits investment → costed options, wireframes, stories, AI criteria and a measured increment.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;These cover the supplied JD’s personas/journeys, model/lifecycle, AI, design, options and delivery work. A policy maker may consume an analyst’s result without personally using an R package; confirm the primary Marketplace user rather than treating every stakeholder as the same persona.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; Your knowledge-library work is relevant because colleagues also need to know what information means, whether it is current and whom to ask. Start with one real colleague’s task and the document they needed—not an invented catalogue ownership claim.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Practise and remember&lt;/p&gt;&lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;✏️ Your 15-minute activity&lt;/h3&gt;&lt;p&gt;Draw Ben, a contributor and Jo around a library. Write one goal and one question for each. Then explain the difference between “a clue” and “a confirmed finding.”&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Your 5-minute answer&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;“How would you learn this new domain?”&lt;/strong&gt;&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See a simple answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“I would start with the people and decisions the product supports. I would observe a practitioner searching for a tool, learn the terms with an expert, and check my understanding with contributors and curators. Then I would turn the main problem into clear requirements with the team.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Answer tip:&lt;/strong&gt; Use one real example of learning an unfamiliar subject. You do not need to pretend to be a health expert.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · interview questions and a full-hour plan&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Extra 30 minutes:&lt;/strong&gt; 10 minutes on the two optional word lessons, 10 improving your people map and 10 speaking two answers.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;“How is public health different from clinical care?”&lt;/strong&gt; Start with one person versus a population, then explain how they work together.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“A report suggests a health threat. What should the system show?”&lt;/strong&gt; Suggest its source, date, verification status and remaining uncertainty; agree the exact rules with experts.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Ask the interviewer:&lt;/strong&gt; “Which user and public-health task should the first release help most?”&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
 &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;8&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain people, clues and the three marketplace users in simple words.&lt;/span&gt;&lt;/label&gt;
 &lt;/section&gt;

&lt;section id=&quot;annie-day9&quot; class=&quot;chapter health-book&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab9&quot; hidden&gt;
 &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🧰 Day 9 · Resources, labels &amp; catalogue decisions&lt;/h2&gt;&lt;p&gt;Learn what the catalogue contains: data, tools and useful labels. Then decide how sources, versions, categories and review evidence fit together. Category E explains how a listing meets a specific user need, using lessons from WHO’s equipment catalogue.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Read the story first.&lt;/strong&gt; The highlighted lessons are your core learning. Open “Learn a little more” only when you want extra detail.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 9 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; One tool card explaining its inputs, output, owner and limitations.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;Read the example resource card and Category E’s three gates: publishable, suitable and usable.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Copy the example card; add questions and links to its creator and data.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “What information should a tool listing contain?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
 &lt;nav class=&quot;category-map&quot; aria-label=&quot;Day 9 knowledge categories&quot;&gt;&lt;a href=&quot;#health-9-a&quot;&gt;A · Data: the ingredients&lt;/a&gt;&lt;a href=&quot;#health-9-b&quot;&gt;B · Tools: the recipes&lt;/a&gt;&lt;a href=&quot;#health-9-c&quot;&gt;C · Labels: the instructions&lt;/a&gt;&lt;a href=&quot;#health-9-d&quot;&gt;D · Catalogue decisions&lt;/a&gt;&lt;a href=&quot;#health-9-e&quot;&gt;E · Does it fit my task?&lt;/a&gt;&lt;/nav&gt;
 &lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;📖&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Yesterday:&lt;/strong&gt; Ben learned that a clue needs checking. &lt;strong&gt;Today:&lt;/strong&gt; he wants a chart of weekly school absences. Jo brings a recipe box: ingredients, recipes and clear labels. This is a way to picture data and software—not a health assessment.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-9-a&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category A&lt;/p&gt;&lt;h3&gt;Data: the ingredients&lt;/h3&gt;&lt;p&gt;What do our numbers actually mean?&lt;/p&gt;&lt;div class=&quot;lesson-grid&quot;&gt;&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🫘 Data = recorded facts&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Individual observations such as dates and counts. A &lt;strong&gt;dataset&lt;/strong&gt; is an organised collection of them.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ben has a table with three columns: week, school and number absent. Each row is one school’s record for one week.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🏷️ Metadata = the label on the jar&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Information that describes the data: what was collected, when, where, how and by whom.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; A jar says “rice.” Ben’s dataset label says “weekly absences, Maple School, autumn term, recorded by the school office.”&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🧮 Denominator = out of how many?&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; The whole group used when calculating a proportion or percentage.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; 2 absent out of 10 and 4 absent out of 20 are both 20%. A bigger count alone does not mean a bigger share.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🧹 Data quality = can we use these ingredients?&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Check whether the data are complete, consistent and suitable for the question.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; An empty cell might mean “not reported.” Ben must not silently turn it into 0, which would mean “nobody absent.”&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;health-proportions&quot; role=&quot;img&quot; aria-label=&quot;Invented example: two highlighted dots out of ten and four out of twenty both represent twenty percent. Counts differ, proportions match.&quot;&gt;&lt;/svg&gt;&lt;p&gt;&lt;strong&gt;Ben’s four questions:&lt;/strong&gt; Who is counted? What does one record mean? Which time and place? What is missing or uncertain?&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · a photo and new arrivals: prevalence and incidence&lt;/summary&gt;&lt;div&gt;&lt;p&gt;These are health measures you may hear. They are separate from our school-absence example.&lt;/p&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;epi-dots&quot; role=&quot;img&quot; aria-label=&quot;Toy group: two of twenty people already have a condition at the start. Three of the eighteen initially unaffected people develop it during a week.&quot;&gt;&lt;/svg&gt;&lt;p&gt;&lt;strong&gt;Prevalence is a photo:&lt;/strong&gt; how many have a condition at a particular moment? Here, 2 out of 20 = 10% at the start.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Incidence proportion counts new cases over a period:&lt;/strong&gt; of the 18 people initially unaffected, 3 develop it during one week. That is 3 ÷ 18 ≈ 16.7% over the week.&lt;/p&gt;&lt;p&gt;The toy group is closed, all 18 are initially at risk, and everyone is followed for the whole week. Do not add the percentages. An &lt;strong&gt;incidence rate&lt;/strong&gt; instead uses person-time at risk as its denominator.&lt;/p&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson3/section2.html&quot;&gt;CDC: incidence and prevalence&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; When two reports disagree, compare definitions, population, dates and update timing before choosing a number. Ask the data owners to explain differences.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-9-b&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category B&lt;/p&gt;&lt;h3&gt;Tools: the recipes&lt;/h3&gt;&lt;p&gt;What turns the ingredients into something useful?&lt;/p&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🫘&lt;/span&gt;&lt;strong&gt;Ingredients&lt;/strong&gt;&lt;p&gt;A table of weekly counts goes in.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧑‍🍳&lt;/span&gt;&lt;strong&gt;Recipe&lt;/strong&gt;&lt;p&gt;Instructions check the table and make a chart.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📊&lt;/span&gt;&lt;strong&gt;Result&lt;/strong&gt;&lt;p&gt;Ben sees the chart and checks what it can tell him.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Interview word&lt;/th&gt;&lt;th&gt;Simple meaning + example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Code&lt;/td&gt;&lt;td&gt;Instructions a computer follows. Example: read Ben’s table and draw one point for each week.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Package&lt;/td&gt;&lt;td&gt;A reusable bundle of code. Like a kitchen kit containing several useful utensils. A chart package may provide several chart-making functions.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Pipeline&lt;/td&gt;&lt;td&gt;Steps connected in order. Ben’s example: load the table → check fields → make the chart → save the report.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Model&lt;/td&gt;&lt;td&gt;A simplified representation of reality. Like a toy town with only the features needed for a question. A health model may explore what could happen under stated assumptions.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Artifact&lt;/td&gt;&lt;td&gt;A general word for an item in this marketplace: a dataset, tool, model, package, pipeline or guide. Types can overlap.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;A model is not a crystal ball.&lt;/strong&gt; Its answers depend on data and assumptions. Ask what it was designed for and where it has been checked. A model is not necessarily AI.&lt;/p&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://www.cdc.gov/cfa-modeling-and-forecasting/modeling-handbook/mh-overview.html&quot;&gt;CDC: what models can and cannot tell us&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;details class=&quot;quick-check&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧠 Tiny check: A tool is popular. Does that mean it fits Ben’s weekly data?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Check its required inputs, purpose and limitations. A tool that needs daily records may not work with Ben’s weekly counts.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-9-c&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category C&lt;/p&gt;&lt;h3&gt;Labels: the instructions for choosing and reusing&lt;/h3&gt;&lt;p&gt;What should Jo put on a resource’s library card?&lt;/p&gt;&lt;div class=&quot;catalog-example&quot;&gt;&lt;h4&gt;🪪 Fictional library card: Weekly Picture Maker&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Purpose:&lt;/strong&gt; draw weekly absence counts.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Needs:&lt;/strong&gt; a table containing week, school and count.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Makes:&lt;/strong&gt; a chart; it does not diagnose illness.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Edition:&lt;/strong&gt; version 1.2. &lt;strong&gt;Owner:&lt;/strong&gt; Maple Tools Team.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Permission:&lt;/strong&gt; licence not yet checked—ask the owner.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Known limit:&lt;/strong&gt; missing weeks are flagged, not treated as zero.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;lesson-grid&quot;&gt;&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🧵 Provenance = the item’s history&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Where it came from and what happened to it. A &lt;strong&gt;version&lt;/strong&gt; identifies an edition.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Jo records the source link and edition. If a chart changes, Ben can check whether the data or tool changed.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🔑 Licence and access = may I use it?&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; A licence states reuse permissions and conditions. Access is the route to get the item, sometimes with approval.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ben can see a dataset’s description, but needs permission to open its records. Seeing something online does not automatically permit reuse.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🔁 Reproducibility = can we repeat the steps?&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Can someone reproduce the documented result using the stated data, code, settings and environment?&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Jo tries Ben’s saved recipe with the same ingredients. Getting the same chart helps check the process; it does not prove the health conclusion.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🔒 Privacy and security = permission and protection&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Privacy concerns appropriate, permitted use of people’s information. Security protects data and systems.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; The public library shows a dataset description, not children’s private records. Removing names alone does not guarantee anonymity.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://www.who.int/data/principles&quot;&gt;WHO: data principles&lt;/a&gt; · &lt;a href=&quot;https://www.nationalacademies.org/read/25303/chapter/4&quot;&gt;National Academies: reproducibility&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · FAIR: four friendly signs on the door&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Letter&lt;/th&gt;&lt;th&gt;Plain idea + example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;F · Findable&lt;/td&gt;&lt;td&gt;Can I find it? Give the item a clear name, identifier and searchable description.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;A · Accessible&lt;/td&gt;&lt;td&gt;Can I reach it? Explain the download or permission route. It may still be locked.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;I · Interoperable&lt;/td&gt;&lt;td&gt;Can things work together? Agree formats and meanings, like using the same date format and meaning of “count.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;R · Reusable&lt;/td&gt;&lt;td&gt;Can I use it again appropriately? Include permission, history and enough context.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;FAIR does not mean “everything is public” or “everything is correct.”&lt;/p&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://www.gofair.foundation/fair-principles&quot;&gt;GO FAIR: the four FAIR principles&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · shelves and string: taxonomy, ontology and knowledge graph&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🗂️&lt;/span&gt;&lt;strong&gt;Taxonomy: shelves&lt;/strong&gt;&lt;p&gt;Put datasets on one shelf and software tools on another.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🏷️&lt;/span&gt;&lt;strong&gt;Ontology: shared meanings&lt;/strong&gt;&lt;p&gt;Agree what kinds of things exist and what “created by” or “uses” means.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧵&lt;/span&gt;&lt;strong&gt;Knowledge graph: connections&lt;/strong&gt;&lt;p&gt;Join an actual tool to its creator and input dataset with named links.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Example:&lt;/strong&gt; “Weekly Picture Maker → created by → Maple Tools Team.” Another link says “Weekly Picture Maker → uses → Weekly Counts.” These connections can help Ben discover related items. A connection is not an endorsement.&lt;/p&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://www.w3.org/TR/skos-primer/&quot;&gt;W3C: controlled vocabularies&lt;/a&gt; · &lt;a href=&quot;https://www.w3.org/TR/rdf11-primer/&quot;&gt;W3C: connected facts&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; Turn the library card into fields and rules. Ask which fields are required, who supplies them, and what happens when a field is unknown.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-9-d&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category D&lt;/p&gt;&lt;h3&gt;One tool, three postcards&lt;/h3&gt;&lt;p&gt;The computer needs an identity; the reader needs a useful card.&lt;/p&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📮&lt;/span&gt;&lt;strong&gt;Three sources&lt;/strong&gt;&lt;p&gt;A code repository, an R package page and a research paper describe a tool.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📦&lt;/span&gt;&lt;strong&gt;One resource?&lt;/strong&gt;&lt;p&gt;Jo checks identifiers, authors, links and versions before deciding they refer to one thing.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🪪&lt;/span&gt;&lt;strong&gt;One useful listing&lt;/strong&gt;&lt;p&gt;The card connects the evidence and explains what the resource can do.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Memory picture:&lt;/strong&gt; three photographs of one bicycle do not make three bicycles. Likewise, 500 source entries may describe fewer than 500 unique resources. A new version is another edition, not automatically a new product.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Keep these separate&lt;/th&gt;&lt;th&gt;Fictional Weekly Picture Maker example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Source&lt;/td&gt;&lt;td&gt;The place evidence comes from: repository, package registry or paper. Each has a URL/identifier and a checked date.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Resource identity&lt;/td&gt;&lt;td&gt;A stable catalogue ID for the tool; versions 1.2 and 2.0 belong to it. Conflicting identities need review before merging.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Metadata schema&lt;/td&gt;&lt;td&gt;The blank card and its rules: title, type, purpose, inputs, outputs, owner, version, rights/access, limitations, evidence and review status.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Taxonomy / facets&lt;/td&gt;&lt;td&gt;Agreed concepts used to organise items. Keep type “package”, task “visualisation”, topic “school attendance” and language “R” as separate properties.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Listing&lt;/td&gt;&lt;td&gt;The approved card people see. The package/code remains at its source unless hosting is explicitly in scope.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Data model / connections&lt;/td&gt;&lt;td&gt;Resource → has versions; version → has source evidence and reviewed descriptions; person → maintains resource; community → contributes to initiative.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Tiny technical assessment · decide what can be published&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Invented input:&lt;/strong&gt; A repository says “makes weekly charts”, version 1.2, owner Maple Team. A package entry links to that repository. A paper cites version 1.0. The AI adds “predicts outbreaks”. No licence information has been verified.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Decision&lt;/th&gt;&lt;th&gt;Reason and next action&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Do not make three listings automatically&lt;/td&gt;&lt;td&gt;Verify the repository/package identity. Connect the paper to the version it actually evaluated; do not transfer its evidence silently to version 1.2.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Reject the prediction claim&lt;/td&gt;&lt;td&gt;The supplied evidence only supports charting. Ask a domain expert to validate the corrected purpose and limitations.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Keep the draft under review&lt;/td&gt;&lt;td&gt;In this practice policy, unclear reuse rights block publication as a reuse-ready tool. Ask the maintainer or rights specialist; never fill in a guessed licence. Other projects may allow visibly restricted records under their agreed listing policy.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Preserve the decision history&lt;/td&gt;&lt;td&gt;Save source references, field evidence, affected version, reviewer, timestamp and accepted metadata revision.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Given–When–Then:&lt;/strong&gt; Given a draft whose AI summary contains an unsupported prediction claim, when review is requested, then the claim is flagged and the draft cannot be approved until corrected or supported under the agreed review rules.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Your similar experience:&lt;/strong&gt; API/data mapping teaches you to distinguish fields and meanings; reviewed documentation teaches you to route unclear information to an owner. Formal catalogue identity resolution is a proposed application, not a past achievement.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;quick-check&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧠 Tiny check: Does a “reviewed” badge mean WHO guarantees this tool works everywhere?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Say what was reviewed, which version, when, by whom and against what criteria. A checked description is different from validating a scientific model for every setting.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-9-e&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category E&lt;/p&gt;&lt;h3&gt;Will this listing help me finish my task?&lt;/h3&gt;&lt;p&gt;A good library card answers “Will this work for me?”&lt;/p&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🪪&lt;/span&gt;&lt;strong&gt;Gate 1 · Publishable&lt;/strong&gt;&lt;p&gt;Enough checked information to appear under the catalogue’s listing policy.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧩&lt;/span&gt;&lt;strong&gt;Gate 2 · Fits my task&lt;/strong&gt;&lt;p&gt;Its purpose, inputs, outputs and constraints match this user’s need.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧪&lt;/span&gt;&lt;strong&gt;Gate 3 · Works in practice&lt;/strong&gt;&lt;p&gt;A permitted trial and the user’s environment support actual adoption.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;These gates are different.&lt;/strong&gt; A publishable, accurately described tool may be unsuitable for Ben. A promising match still needs setup and validation before use. “Reviewed” must say what was checked; it must not imply WHO prequalification of analytical software.&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · What the WHO equipment catalogue teaches us&lt;/summary&gt;&lt;div&gt;&lt;p&gt;The supplied PDF is an 802-page snapshot dated &lt;strong&gt;29 October 2026&lt;/strong&gt;. Its preface (PDF pages 2–6) explains identity, verification, review, feedback and ordering. Section E003.4 (pages 48–51) guides selection using climate, capacity, power, supplies, training and cost. Page 56 illustrates a product sheet with status, validity and technical properties.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Transferable lesson:&lt;/strong&gt; establish the user’s operating conditions, compare relevant properties, inspect evidence, then follow the next action. Keep stable IDs, dates and feedback.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Boundary:&lt;/strong&gt; this is an immunization-device prequalification/procurement catalogue. Your JD describes discovery and reuse of analytical resources. Do not copy its certification, annual-review or purchase rules into the Marketplace without agreement.&lt;/p&gt;&lt;p class=&quot;health-source&quot;&gt;&lt;a href=&quot;https://extranet.who.int/prequal/sites/default/files/media_document/immunization_devices_catalogue.pdf#page=48&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Supplied WHO catalogue · selection guidance&lt;/a&gt;; &lt;a href=&quot;https://extranet.who.int/prequal/immunization-devices/who-catalogue-prequalified-immunization-devices&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO catalogue explanation&lt;/a&gt;; &lt;a href=&quot;https://extranet.who.int/prequal/immunization-devices/imd-listing-products-e003&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO category search and comparison&lt;/a&gt;. Page numbers refer to the downloaded PDF sequence; future versions may move them.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Ask the user first&lt;/th&gt;&lt;th&gt;Make the listing answer it&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;What decision and output do you need?&lt;/td&gt;&lt;td&gt;Purpose, intended user/task and sample output. Describe past trends, forecast future counts and compare scenarios separately.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What data do you actually have?&lt;/td&gt;&lt;td&gt;Required fields, meanings, units, frequency and level: one person, one district/week, or one country/year. For datasets, show coverage, methods and missingness.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Where and how will you use it?&lt;/td&gt;&lt;td&gt;Runtime/language, platform, skills, installation, dependencies and whether data must leave the user’s environment.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Is it credible for this setting?&lt;/td&gt;&lt;td&gt;Evidence for the relevant version/population/task, assumptions, validation scope, uncertainty and known limitations. Experts judge scientific fit.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;May you access and reuse it?&lt;/td&gt;&lt;td&gt;Source link, licence/access conditions and any approvals. Public metadata does not imply open data or free reuse.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Can you keep using it?&lt;/td&gt;&lt;td&gt;Maintainer, release and review dates, deprecation, support, documentation and expected setup/operating effort.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;catalog-example&quot;&gt;&lt;h4&gt;🧩 A very small decision model&lt;/h4&gt;&lt;p&gt;One mandatory requirement fails → &lt;strong&gt;not suitable for this task&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;A mandatory fact is missing → &lt;strong&gt;unknown: ask or check&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;All mandatory requirements have supporting evidence → &lt;strong&gt;candidate for a trial&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;Then compare preferences such as ease of use and support. Popularity or a high AI score must not cancel a hard mismatch.&lt;/p&gt;&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Turn the card into a buildable model&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Keep &lt;strong&gt;resource facts&lt;/strong&gt; separate from &lt;strong&gt;this user’s requirements&lt;/strong&gt;. The match is a relationship between them.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Record&lt;/th&gt;&lt;th&gt;Example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Task profile&lt;/td&gt;&lt;td&gt;Desired output: descriptive chart; input grain: district/week; format: CSV; processing: local; skill: can follow a simple install guide.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Versioned resource metadata&lt;/td&gt;&lt;td&gt;Accepted input schema, produced output, runtime, licence, evidence and limitations for this edition.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Assessment result&lt;/td&gt;&lt;td&gt;Requirement → evidence → pass/fail/unknown → explanation → reviewer or user decision. This is not a universal suitability badge.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;BA rule:&lt;/strong&gt; distinguish “unknown”, “not applicable” and “not supported”. Show source and reviewed version. Never let a blank field silently mean “compatible”. These are proposed product requirements, not a WHO-defined schema.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;quick-check&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧠 Tiny check: A tool is about influenza and appears first. Is it the right choice?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Not necessarily. If the user has weekly totals but the tool needs daily individual records, the topic matches while the inputs do not. Find the evidence, explain the mismatch and look for a suitable alternative.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Practise and remember&lt;/p&gt;&lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;✏️ Your 15-minute activity&lt;/h3&gt;&lt;p&gt;Copy the fictional card onto paper. Add a source link field, a review date and one question for the owner. Draw a line from the tool to its creator and another to its input dataset.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Your 5-minute answer&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;“What information should a tool listing contain?”&lt;/strong&gt;&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See a simple answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“I would show what the tool does, what data it needs, its output, version, owner, source, licence and limitations. I would test the card with users to see whether they can judge suitability, and agree how missing information is handled.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Answer tip:&lt;/strong&gt; Use the Weekly Picture Maker example first. Then connect it to a real data dictionary, API mapping or requirements example from your work.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · interview questions and a full-hour plan&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Extra 30 minutes:&lt;/strong&gt; 10 minutes on FAIR and the connected-shelves lesson, 10 improving your card and 10 speaking two answers.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;“Data and metadata—what is the difference?”&lt;/strong&gt; Use ingredients versus the jar label, then name actual fields.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“Two sources disagree. What do you do?”&lt;/strong&gt; Compare meaning, population, time, source and changes; consult their owners.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“Can we use a model in a new setting?”&lt;/strong&gt; Ask experts to check its inputs, assumptions, evidence and limitations.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
 &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;9&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain the ingredients, recipes and labels without relying on jargon.&lt;/span&gt;&lt;/label&gt;
 &lt;/section&gt;

&lt;section id=&quot;annie-day10&quot; class=&quot;chapter health-book&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab10&quot; hidden&gt;
 &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;📚 Day 10 · AI review &amp; the BA case-study playground&lt;/h2&gt;&lt;p&gt;Follow a user from search to assessment, check AI suggestions and practise case-study decisions. Start with Category E for Ben’s complete search-to-use journey. Choose one optional exercise in Category D; you do not need to complete them all today.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Read the story first.&lt;/strong&gt; The highlighted lessons are your core learning. Open “Learn a little more” only when you want extra detail.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 10 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; Three small screens, one failure rule and one measure of user success.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;Start with Category E: Ben’s task, three candidates, selection evidence and source handoff.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Compare Ben’s three candidates; sketch one mismatch, one unknown and the next step after selection.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “Why use a marketplace when an AI assistant can find tools?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
 &lt;nav class=&quot;category-map&quot; aria-label=&quot;Day 10 knowledge categories&quot;&gt;&lt;a href=&quot;#health-10-a&quot;&gt;A · Find the right tool&lt;/a&gt;&lt;a href=&quot;#health-10-b&quot;&gt;B · Check the robot&lt;/a&gt;&lt;a href=&quot;#health-10-c&quot;&gt;C · Look after the library&lt;/a&gt;&lt;a href=&quot;#health-10-d&quot;&gt;D · Case-study playground&lt;/a&gt;&lt;a href=&quot;#health-10-e&quot;&gt;E · Ben’s complete journey&lt;/a&gt;&lt;/nav&gt;
 &lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;📖&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Ben has his weekly table.&lt;/strong&gt; Jo helps him find a tool. Pip, a robot helper, can search and draft short descriptions. Pip is quick, but sometimes gets things wrong. Ben still needs enough evidence to judge whether a tool suits his task.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-10-a&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category A&lt;/p&gt;&lt;h3&gt;Find the right tool&lt;/h3&gt;&lt;p&gt;What does a good user journey look like?&lt;/p&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🔎&lt;/span&gt;&lt;strong&gt;Find&lt;/strong&gt;&lt;p&gt;Ben asks for a tool that charts weekly counts.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;⚖️&lt;/span&gt;&lt;strong&gt;Compare&lt;/strong&gt;&lt;p&gt;Jo shows required data, versions, permissions and limitations side by side.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧪&lt;/span&gt;&lt;strong&gt;Try&lt;/strong&gt;&lt;p&gt;Ben follows an example and checks whether he can complete his task.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lesson-grid&quot;&gt;&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🗺️ Discovery = find useful possibilities&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Help someone find resources relevant to their goal. &lt;strong&gt;Search&lt;/strong&gt; uses a query; &lt;strong&gt;filters&lt;/strong&gt; narrow results by chosen properties.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ben types “weekly chart” and filters for tools that accept his file type. No useful result? The page should say so and help him adjust.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;👟 Adoption = put it to use&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Move from finding an item to using it for a real task.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ben downloads the tool but cannot install it. Discovery worked; adoption has not succeeded. Clear setup instructions could help.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; Write the whole journey: need → find → compare → try → get help. Ask where users get stuck. A click or download alone does not prove success.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-10-b&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category B&lt;/p&gt;&lt;h3&gt;Check the robot&lt;/h3&gt;&lt;p&gt;How can AI help without becoming the final authority?&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Pip’s job&lt;/th&gt;&lt;th&gt;Plain explanation + small example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Search help&lt;/td&gt;&lt;td&gt;Find candidates from the user’s question. Pip suggests chart tools when Ben describes his task.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Summarisation&lt;/td&gt;&lt;td&gt;Make a shorter description. Pip turns a long guide into a few sentences while keeping the important limits.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Indexing&lt;/td&gt;&lt;td&gt;Organise information so it can be found. Pip notices a new resource and prepares its searchable record.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Metadata suggestions&lt;/td&gt;&lt;td&gt;Propose labels. Pip suggests a resource type, language or input format for Jo to check.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;🤖&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Pip says:&lt;/strong&gt; “This tool predicts outbreaks!”&lt;br&gt;&lt;strong&gt;Jo checks the guide:&lt;/strong&gt; “It only draws a chart of weekly counts.”&lt;br&gt;&lt;strong&gt;Jo’s decision:&lt;/strong&gt; correct the description before approving it. A confident sentence is not evidence.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;lesson-grid&quot;&gt;&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🎲 Probabilistic = an output can vary or be wrong&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; AI uses learned patterns to produce results; it does not guarantee that every answer is correct. A made-up claim is often called a &lt;strong&gt;hallucination&lt;/strong&gt; or &lt;strong&gt;confabulation&lt;/strong&gt;.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Pip’s “predicts outbreaks” claim has no support in the guide. Jo needs the source, not just confident wording.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🧑‍⚖️ Human review = a person checks and decides&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Give the reviewer evidence and controls to correct, approve or reject a suggestion.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Jo sees the original passage beside Pip’s draft. She edits the claim; the system records who approved which edition.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;health-ai&quot; role=&quot;img&quot; aria-label=&quot;In this teaching example, AI proposes a description with a source, a human checks or corrects it, and the approved revision is published.&quot;&gt;&lt;/svg&gt;&lt;p&gt;&lt;strong&gt;Our example rule:&lt;/strong&gt; unsupported suggestions wait for review. The real review policy must be agreed with the PO and relevant experts; this is not a claim about WHO’s current system.&lt;/p&gt;&lt;p class=&quot;health-source&quot;&gt;Theory sources: &lt;a href=&quot;https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf&quot;&gt;NIST: generative AI risks&lt;/a&gt;. The Maple Town story is an invented learning example.&lt;/p&gt;&lt;details class=&quot;quick-check&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧠 Tiny check: Pip sounds very sure. Can Jo skip the source check?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;No. Confident wording or a high model score is not proof that the statement is true.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · turn this into a user story and acceptance criteria&lt;/summary&gt;&lt;div&gt;&lt;p&gt;A &lt;strong&gt;user story&lt;/strong&gt; states a need and its value: “As Jo, I want to check a suggested description against its source so users get an accountable listing.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Acceptance criteria&lt;/strong&gt; say what we can observe to decide whether the behaviour works:&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Starting situation + action&lt;/th&gt;&lt;th&gt;Expected result&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;The draft has no supporting source; Pip submits it.&lt;/td&gt;&lt;td&gt;It stays pending. The missing evidence is shown.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Jo has review permission and approves her corrected draft.&lt;/td&gt;&lt;td&gt;The approved version appears, with source, reviewer and time recorded.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Pip’s service fails during processing.&lt;/td&gt;&lt;td&gt;No unfinished draft is published. The agreed manual route is available.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;Connect this to &lt;strong&gt;Day 2&lt;/strong&gt;: Given = starting scene, When = action, Then = visible result.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-10-c&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category C&lt;/p&gt;&lt;h3&gt;Look after the library&lt;/h3&gt;&lt;p&gt;What happens after a resource is listed?&lt;/p&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📝&lt;/span&gt;&lt;strong&gt;Prepare&lt;/strong&gt;&lt;p&gt;The contributor writes the card. Jo checks it.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📚&lt;/span&gt;&lt;strong&gt;Publish&lt;/strong&gt;&lt;p&gt;The accepted card becomes visible under the agreed rules.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🪴&lt;/span&gt;&lt;strong&gt;Maintain&lt;/strong&gt;&lt;p&gt;The owner updates it, corrects mistakes and explains replacements.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lesson-grid&quot;&gt;&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;♻️ Lifecycle = an item’s stages over time&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; A listing can be a draft, under review, published, updated or retired from recommendation.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Version 2 replaces version 1. Jo links the replacement and explains the change instead of leaving Ben with a mystery.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🚧 Deprecated ≠ removed&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; &lt;strong&gt;Deprecated:&lt;/strong&gt; no longer recommended, often still visible with a warning. &lt;strong&gt;Removed:&lt;/strong&gt; taken out of the agreed public view.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; An old tool may keep a warning and a replacement link. A rights or security problem may need removal under an authorised policy.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;📏 Evaluation = check whether it helps&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; Use agreed tasks and evidence to judge the product and AI output.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; Ask several representative users to find a suitable weekly-chart tool. Observe success, time, mistakes and where they need help.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;story-lesson&quot;&gt;&lt;h4&gt;🧭 PO and BA = direction and clear delivery&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;What it means:&lt;/strong&gt; In this JD, the PO owns scope, priority and product direction. The BA helps the team deliver that direction through clear requirements and coordination.&lt;/p&gt;&lt;p class=&quot;tiny-story&quot;&gt;&lt;strong&gt;In our story:&lt;/strong&gt; The PO chooses which user problem comes first. You clarify the flow, data, rules, exceptions and tests with design and engineering.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; Decide who owns updates, reviews and corrections. Agree what happens if a link breaks, a contributor leaves or users report a wrong AI summary.&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · how to measure quality&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Word&lt;/th&gt;&lt;th&gt;Beginner’s question + example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Relevance&lt;/td&gt;&lt;td&gt;Does it fit the task? Experts judge sample search results against realistic questions.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Accuracy of the description&lt;/td&gt;&lt;td&gt;Is each claim supported? Compare Pip’s text with the correct source version; count and inspect corrections.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Latency&lt;/td&gt;&lt;td&gt;How long does the user wait? Agree how to measure response time, under what load and what target is needed.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Reliability&lt;/td&gt;&lt;td&gt;Does it keep working, and recover clearly? Agree failure messages, retries and a fallback route.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Accessibility&lt;/td&gt;&lt;td&gt;Can people with different abilities use it? Include keyboard use, readable labels and appropriate user testing.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;A &lt;strong&gt;confidence score&lt;/strong&gt; is a system’s score, not automatically a probability that a claim is true. Choose any automation threshold using representative examples and the consequences of mistakes. Do not invent “99% accurate” without defining what is measured.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · build, adopt or extend&lt;/summary&gt;&lt;div&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🔨&lt;/span&gt;&lt;strong&gt;Build&lt;/strong&gt;&lt;p&gt;Create a new library system. Is the extra work worth the user benefit?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📦&lt;/span&gt;&lt;strong&gt;Adopt&lt;/strong&gt;&lt;p&gt;Use an existing system. Does it meet our needs and rules?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧩&lt;/span&gt;&lt;strong&gt;Extend&lt;/strong&gt;&lt;p&gt;Add a missing part to an existing system. Will its owner support the change?&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Compare user fit, integration, rights, setup effort and ongoing maintenance and curation cost. Test assumptions before recommending an option.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-10-d&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category D&lt;/p&gt;&lt;h3&gt;The BA case-study playground&lt;/h3&gt;&lt;p&gt;Practise making a small, explainable decision when the answer is incomplete.&lt;/p&gt;&lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;🎒&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Take five things into any case:&lt;/strong&gt; a user, a problem, some evidence, a recommendation and a way to check it. You can say, “I do not know that yet; here is how I would verify it.”&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🔎&lt;/span&gt;&lt;strong&gt;Ask + observe&lt;/strong&gt;&lt;p&gt;Who is stuck? What were they trying to do? What evidence is available?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;⚖️&lt;/span&gt;&lt;strong&gt;Compare + decide&lt;/strong&gt;&lt;p&gt;What could fix it? Which option fits the constraints, and why?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🧪&lt;/span&gt;&lt;strong&gt;Sketch + test&lt;/strong&gt;&lt;p&gt;Show the journey, state the rules, name the approver and check the result.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;What is known about assessment:&lt;/strong&gt; &lt;a href=&quot;https://www.who.int/careers/apply-for-a-position&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO selection guidance&lt;/a&gt; says shortlisted candidates may undergo assessment and a competency-based interview. It does not establish the format for this contractor role. &lt;a href=&quot;https://uk.linkedin.com/jobs/view/business-analyst-tools-and-resources-marketplace-at-reckon-digital-4485323477&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Related vendor advert&lt;/a&gt; describes a 15-minute client presentation using a case supplied beforehand; your invitation remains the authority for your timing and format. The exercises below are original preparation, not leaked or confirmed WHO tests.&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Choose your practice format&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Format&lt;/th&gt;&lt;th&gt;How to prepare&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Prepared 15-minute presentation&lt;/td&gt;&lt;td&gt;Use the brief you receive. A practice outline: 2 min user/problem and assumptions; 3 min resource model/listing rules; 3 min AI review and lifecycle; 3 min alternatives and recommendation; 3 min first increment, UX and measures; 1 min decision and next step. This totals 15 minutes of speaking; clarify whether Q&amp;A is additional.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Live 15-minute problem solving&lt;/td&gt;&lt;td&gt;Ask clarifying questions first; sketch and reason aloud. Day 12 G has a timed exercise including questions and changing evidence. It is different from a 15-minute prepared presentation.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Role play&lt;/td&gt;&lt;td&gt;Treat the interviewer as a stakeholder. Ask for a recent example, reflect the conflict, propose options and agree the next decision. Avoid delivering a memorised speech.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Technical BA assessment&lt;/td&gt;&lt;td&gt;Practise a small entity model, three Given–When–Then rules, a state flow and one empty/error screen. Explain what engineering or a domain expert must validate. This does not assume a coding test.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Role play · the expert wants accuracy, the contributor wants speed&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Expert:&lt;/strong&gt; “Every description needs careful scientific review.” &lt;strong&gt;Contributor:&lt;/strong&gt; “Waiting weeks will discourage submissions.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Your response:&lt;/strong&gt; “Which fields can change the interpretation of the tool? How many submissions arrive, and how long does each review take? I would separate mechanical checks from domain meaning, show evidence beside the draft and pilot a review queue. I would keep human approval for public AI claims initially, measure turnaround and correction rate, then recommend a risk-based workflow if evidence supports it.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Useful output:&lt;/strong&gt; one review flow, named decision owners, high-risk escalation rules and an agreed review-time measure. Your comparable experience is requirements workshops and getting reviewed knowledge approved.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Technical exercise · draw the review room&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Sketch &lt;strong&gt;source passage | AI draft | corrections + decision&lt;/strong&gt;. Add who can approve, how missing evidence looks, and what happens after an error.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Given&lt;/th&gt;&lt;th&gt;When&lt;/th&gt;&lt;th&gt;Then&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A reviewer can edit but has no approval permission&lt;/td&gt;&lt;td&gt;They attempt to publish&lt;/td&gt;&lt;td&gt;The server denies publication; the draft stays unchanged in public visibility.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Reviewer A opened revision 2; another reviewer saved revision 3&lt;/td&gt;&lt;td&gt;A tries to approve revision 2&lt;/td&gt;&lt;td&gt;A must review the current revision; an outdated approval cannot overwrite newer content.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;The AI request times out&lt;/td&gt;&lt;td&gt;The contributor continues manually&lt;/td&gt;&lt;td&gt;No partial AI text is published; a manual draft follows the same validation and review.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;These are proposed requirements to discuss with engineering and the designer. Your API mapping and UAT experience can help identify data, permission and state exceptions.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Problem-solving exercise · search returned nothing&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Evidence card:&lt;/strong&gt; “flu chart” returns zero; “influenza chart” finds one approved resource with the same permissions and filters. The expert confirms the wording matches this task.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Think:&lt;/strong&gt; validate the record/index and reproduce the query before blaming the search engine. Propose an expert-reviewed synonym mapping. Repeat varied representative queries, including terms that should not be treated as equivalent. Observe whether users can assess the result, not merely click it.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Primary measure:&lt;/strong&gt; successful discovery-and-assessment tasks ÷ all attempted eligible tasks. Agree the time limit and suitability rubric beforehand; count abandoned attempts and report no-coverage tasks separately. Logs explain retrieval behaviour; expert/user checks explain suitability.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Decision exercise · the old tool is still used&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Evidence card:&lt;/strong&gt; an old version has no active maintainer, but research pipelines depend on it.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Think:&lt;/strong&gt; assess the risk and known dependencies. If continued access is acceptable, recommend a deprecated badge, reason, version-specific replacement and migration support. Agree the owner, review date and removal conditions. Escalate urgent unsafe or impermissible access promptly. The catalogue cannot delete an external repository.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Say:&lt;/strong&gt; “My current documentation review is the closest experience. Here I would extend that to version dependencies and an approved transition plan.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;quick-check&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧠 Tiny check: What makes my case answer strong?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;State the problem, distinguish facts from assumptions, show options and a reasoned recommendation, include a concrete rule or sketch, name the decision owner, and say what result would change your mind.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot; id=&quot;health-10-e&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Category E&lt;/p&gt;&lt;h3&gt;Walk with Ben: from a question to a useful result&lt;/h3&gt;&lt;p&gt;One complete invented journey—this is the missing link between searching and doing.&lt;/p&gt;&lt;div class=&quot;story-opening&quot;&gt;&lt;span class=&quot;story-symbol&quot; aria-hidden=&quot;true&quot;&gt;📖&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Ben’s task:&lt;/strong&gt; “For tomorrow’s briefing, I need a chart of the last eight weeks of recorded counts by district. My approved CSV has week, district and count. I need local processing. I am describing past records, not forecasting or deciding whether an outbreak exists.” All tools below are fictional.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-strip&quot;&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;📝&lt;/span&gt;&lt;strong&gt;1 · Describe the job&lt;/strong&gt;&lt;p&gt;Task: show historical trends. Data: weekly district counts. Need: a chart. Constraint: local processing.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;🔎&lt;/span&gt;&lt;strong&gt;2 · Find candidates&lt;/strong&gt;&lt;p&gt;Search “weekly trend chart”; browse visualisation tools. Compare input, output and operating conditions.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-frame&quot;&gt;&lt;span class=&quot;scene-icon&quot; aria-hidden=&quot;true&quot;&gt;⚖️&lt;/span&gt;&lt;strong&gt;3 · Inspect the evidence&lt;/strong&gt;&lt;p&gt;Open each versioned listing and check its documentation, example, rights and limitations.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Three fictional listings&lt;/th&gt;&lt;th&gt;Ben’s decision&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A · District Trend Sketcher&lt;/td&gt;&lt;td&gt;Accepts week/district/count CSV; produces a descriptive chart; documented local setup and reuse permission. &lt;strong&gt;Candidate for a trial&lt;/strong&gt;, subject to checking its actual instructions and limitations.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;B · Daily Forecast Lab&lt;/td&gt;&lt;td&gt;Needs daily individual records and produces a forecast. &lt;strong&gt;Reject for this task&lt;/strong&gt;, even if its topic and popularity match.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C · Cloud Trend Viewer&lt;/td&gt;&lt;td&gt;Produces charts, but the listing does not say whether uploads are retained or local processing is possible. &lt;strong&gt;Unknown&lt;/strong&gt;; ask the maintainer rather than infer compatibility.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · 4–6 · What happens after Ben chooses a candidate?&lt;/summary&gt;&lt;div&gt;&lt;ol&gt;&lt;li&gt;&lt;strong&gt;Follow the source:&lt;/strong&gt; Ben opens A’s documentation/version link and confirms the setup and licence. The Marketplace need not host or execute the tool.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Try safely:&lt;/strong&gt; he first uses the documented synthetic sample. For an approved real dataset, he checks required fields, missing weeks and counts with the data owner. A chart must not silently convert missing values to zero.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Finish and report:&lt;/strong&gt; he exports the required chart, records the tool/data versions and limitations, and reports a misleading listing or installation problem to the appropriate owner.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;strong&gt;What “success” means:&lt;/strong&gt; discovery succeeds when Ben finds and correctly assesses a suitable candidate within the agreed time. Adoption succeeds later when he can complete the permitted task. A click, download or colourful chart alone does not establish either scientific correctness or a health conclusion.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · What each screen should help Ben decide&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Screen / step&lt;/th&gt;&lt;th&gt;Information and behaviour&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Search / browse&lt;/td&gt;&lt;td&gt;Let users express task and constraints. Facets narrow by task/type/input/runtime; do not demand that beginners already know package names. If natural-language search is used, show how the request was interpreted.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Results&lt;/td&gt;&lt;td&gt;Show purpose, key input/output, relevant status and why a candidate may fit. Clearly label missing facts; do not present inferred compatibility as verified.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Comparison&lt;/td&gt;&lt;td&gt;Align comparable fields and units; highlight hard mismatches and unknowns before preferences. Keep links to evidence.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Detail&lt;/td&gt;&lt;td&gt;Show versioned requirements, example output, provenance, licence, validation limits, setup and help routes. Explain exactly what review covered.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Handoff / return&lt;/td&gt;&lt;td&gt;Open the source or access-request route. Let users report outdated metadata, incompatible inputs or failed setup, tied to the affected version.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;These are proposals to validate with the UX/UI designer, engineers and users. The public WHO examples do not establish that the JD’s Marketplace already has these screens.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · Acceptance criteria that test matching—not just search&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Given / When&lt;/th&gt;&lt;th&gt;Then&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Ben requires weekly aggregate input; a tool requires daily person-level input. He compares them.&lt;/td&gt;&lt;td&gt;The mismatch is visible. The tool is not labelled compatible solely because topic words match.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Local processing is mandatory, but a listing has no deployment evidence. A match explanation is generated.&lt;/td&gt;&lt;td&gt;It says the requirement is unverified and links to a way to check; AI must not invent support.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;No reviewed item satisfies the hard constraints. Ben searches.&lt;/td&gt;&lt;td&gt;Explain the gap, retain the constraints and offer reviewed alternatives or an expert/help route. Never silently relax a mandatory constraint.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;An approved resource revision changes its input requirements. A saved comparison is reopened.&lt;/td&gt;&lt;td&gt;Show the changed version/facts and require a fresh assessment of affected requirements.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · How I would test this with users&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ask users to find a resource for the same defined task, explain their choice using evidence, and identify what they still need before trying it. Agree the suitability rubric with domain experts in advance. Include varied skills and environments.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Main discovery measure:&lt;/strong&gt; successful find-and-assess tasks divided by all attempted eligible tasks, including abandoned attempts. Eligible tasks have a known suitable resource; report no-coverage requests separately. Use distinct negative tests to check whether people correctly reject mismatches and recognise unknowns. Track adoption after the source handoff separately, with appropriate consent.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Diagnose the failure:&lt;/strong&gt; no candidate → coverage/index/query issue; wrong candidate → relevance or fit explanation; cannot judge → metadata/UX gap; cannot run → adoption/dependency/access barrier. Ask about the stage before proposing a fix.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p class=&quot;bridge&quot;&gt;&lt;strong&gt;Your BA connection:&lt;/strong&gt; In your current project, colleagues need usable dataset knowledge, not merely a document link. Describe a real example of clarifying what data meant and asking reviewers to correct it. For the Marketplace, propose testing whether the description actually lets a user choose and use an appropriate resource.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;learn-category&quot;&gt;&lt;p class=&quot;category-kicker&quot;&gt;Practise and remember&lt;/p&gt;&lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;✏️ Your 15-minute activity&lt;/h3&gt;&lt;p&gt;Draw three small screens: search results, a tool’s card and Jo’s review screen. Add one thing that could go wrong, its expected behaviour and one way to check user success.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Your 5-minute answer&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;“Why use a curated marketplace when an AI assistant can find tools?”&lt;/strong&gt;&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See a simple answer&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“I would compare both on real user tasks. A marketplace may help by keeping consistent descriptions, versions, sources, review information and maintenance ownership together. I would test whether that helps people choose and use suitable tools, and compare the ongoing costs before recommending it.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Answer tip:&lt;/strong&gt; Explain a concrete benefit and how you would test it. Separate your real experience from this practice example.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🌱 Learn a little more · interview questions and a full-hour plan&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Extra 30 minutes:&lt;/strong&gt; 10 minutes on criteria and quality, 10 improving your screens and 10 rehearsing two answers.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;“The AI invents a claim. What happens?”&lt;/strong&gt; Explain source checking, correction, approval and how the error informs future testing.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;“A tool is no longer maintained. Delete it?”&lt;/strong&gt; Discuss impact, warnings, replacement links and who has decision authority.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Ask the interviewer:&lt;/strong&gt; “Who owns curation, which AI features exist, and how is their quality evaluated?”&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt;An honest bridge:&lt;/strong&gt; “This domain is new to me. My relevant experience is [real example]. I would apply it by [specific action] and check the health assumptions with a domain expert.”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;p class=&quot;health-source&quot;&gt;The marketplace examples apply the supplied JD. They describe proposed teaching scenarios, not an implemented WHO policy. WHO context and related-role evidence refreshed on 3 November 2026; foundational sources remain linked to their lessons.&lt;/p&gt;
 &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;10&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain the user journey, AI review and library upkeep with one simple example.&lt;/span&gt;&lt;/label&gt;
 &lt;/section&gt;
&lt;section id=&quot;annie-day11&quot; class=&quot;chapter interview-book&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab11&quot; hidden&gt;&lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🎓 Day 11 · Catalogue BA questions &amp; how to think&lt;/h2&gt;&lt;p&gt;Catalogue-focused practice adapted from your questions and JD. The separate sprint/PO question is replaced by option appraisal; your BA delivery responsibilities remain in the case. Each question includes a reasoning path and a truthful experience bridge.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 11 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Practice timing, not a confirmed schedule:&lt;/strong&gt; start each answer in 45–90 seconds, then handle follow-ups. Your original question set had a 2-minute plan, 5-minute presentation and 3-minute discussion case. Day 10 D also prepares for a 15-minute presentation; follow your actual invitation.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Study time&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;First 30 minutes&lt;/td&gt;&lt;td&gt;Read the bridge and coverage map. Choose real evidence for Questions 1, 2, 3, 5, 9 and 10. Rehearse two answers.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Next 30 minutes&lt;/td&gt;&lt;td&gt;Practise Questions 3, 4, 6 and 7 as proposed approaches. Run the case: 2 minutes to plan, 5 to speak, 3 for challenges.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;You can split this over two days. Square brackets mark facts you still need to supply. All catalogue designs, pass levels and performance figures below are hypothetical unless explicitly stated otherwise.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;interview-note&quot;&gt;&lt;h3&gt;🌉 Your bridge from current work to this product&lt;/h3&gt;&lt;p&gt;You have not yet directly
