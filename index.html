  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        pendingStateWrites.delete(id);

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

      }),

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {

          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              data?.type === &quot;widget-state-result&quot;

      }

  &lt;section id=&quot;annie-day1&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab1&quot;&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🔎 Be a detective before a builder&lt;/h2&gt;&lt;p&gt;A stakeholder asks for a button. Your first job is to discover the problem hiding behind the request.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 1 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; An ambiguous requirement you clarified.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;Needs, requirement types and the detective picture.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Map one request to the real need and an agreed rule.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “How do you handle unclear requirements?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;detective&quot; role=&quot;img&quot; aria-label=&quot;Follow a request through why, need, rule and check before choosing a solution&quot;&gt;&lt;/svg&gt;
    &lt;p class=&quot;memory-line&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Ask why → understand the need → agree the behaviour → check the result.&lt;/p&gt;
    &lt;h3&gt;The idea in plain words&lt;/h3&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;BA idea&lt;/th&gt;&lt;th&gt;Meaning and example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Business need&lt;/td&gt;&lt;td&gt;Why change? Reduce assignment delays.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Stakeholder need&lt;/td&gt;&lt;td&gt;What does a person need? A supervisor must see unassigned cases.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Functional&lt;/td&gt;&lt;td&gt;What must it do? Filter cases by owner.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Non-functional&lt;/td&gt;&lt;td&gt;How well? Respond within an agreed time and load.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Transition&lt;/td&gt;&lt;td&gt;What helps us move? Train users and migrate records.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Traceability&lt;/td&gt;&lt;td&gt;Connect why to what: need → story → criterion → test.&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;🧠 Open the six BACCM questions&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Need&lt;/th&gt;&lt;td&gt;What problem or opportunity?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Change&lt;/th&gt;&lt;td&gt;What will become different?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Stakeholder&lt;/th&gt;&lt;td&gt;Who is affected?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Context&lt;/th&gt;&lt;td&gt;What constraints and environment?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Solution&lt;/th&gt;&lt;td&gt;What approach could help?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Value&lt;/th&gt;&lt;td&gt;Why is the change worthwhile?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;lesson-section&quot;&gt;&lt;h3&gt;Two checks, two questions&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;checks&quot; role=&quot;img&quot; aria-label=&quot;Verification asks whether the requirement is clear. Validation asks whether it meets the real need.&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Choose one recent-project feature. Write the original request, the real need, one assumption and how you confirmed understanding.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; requirements workshops and technical scoping.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“How do you handle unclear requirements?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Outcome → people → evidence → ambiguity → agreed rule → result.&lt;/p&gt;&lt;p&gt;“The request was [X]. I discovered [ambiguity] through [method]. We agreed [rule] and checked it using [evidence].”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; name the ambiguity, not just the meeting.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Draw the current and proposed process. Mark a handoff and an exception.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;How do you know requirements are complete enough?&lt;/li&gt;&lt;li&gt;What if a stakeholder proposes a solution before explaining the need?&lt;/li&gt;&lt;li&gt;How do you manage a change to an agreed requirement?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;day-reference&quot; id=&quot;annie-notes1&quot;&gt;&lt;h3&gt;📖 Detailed study guide · Day 1&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; explain how you move from a business problem to shared, testable requirements.&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;Open the part you need. These notes, worked examples and sources all belong to today’s topic.&lt;/p&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Core knowledge&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Business analysis connects a need to a change that creates value. BACCM provides six prompts: &lt;strong&gt;Change, Need, Solution, Value, Stakeholder and Context&lt;/strong&gt;. Elicitation discovers information; analysis examines it; validation checks that it addresses the need. Requirements verification checks the quality of their expression, such as consistency and clarity.&lt;/p&gt;
&lt;p&gt;Know the requirement levels:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Business:&lt;/strong&gt; the desired organisational result.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Stakeholder:&lt;/strong&gt; what a particular person or group needs.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Functional:&lt;/strong&gt; what the solution must do.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Non-functional:&lt;/strong&gt; qualities and constraints, such as performance or accessibility.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Transition:&lt;/strong&gt; temporary needs for moving to the future state, such as migration or training.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Traceability connects a need, requirements, design and delivered behaviour so changes can be assessed. Sources: &lt;a href=&quot;https://www.iiba.org/knowledgehub/the-business-analysis-standard/&quot;&gt;IIBA Business Analysis Standard&lt;/a&gt; and &lt;a href=&quot;https://www.iiba.org/knowledgehub/the-business-analysis-standard/4-implementing-business-analysis/4-4-understanding-requirements-and-designs/&quot;&gt;IIBA requirements and designs&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Worked practice example&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Hypothetical case:&lt;/strong&gt; an operations manager asks for an “Export all cases” button.&lt;/p&gt;
&lt;p&gt;Do not assume that the button is the need. Ask what decision the export supports, who needs it, how often, what information is necessary, and what happens today.&lt;/p&gt;
&lt;p&gt;Possible findings:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;Business need: reduce time spent preparing a daily workload summary.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Stakeholder need: supervisors need to see work awaiting assignment.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Functional requirement: filter unassigned cases by team and age.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Non-functional requirement: prevent users from accessing another team&amp;#39;s restricted cases.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Transition requirement: train supervisors on the new workflow.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Exporting everything may remain an option, but so may a filtered view. Validate the need before choosing.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your exercise&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Choose an actual recent-project feature. Write:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;The original request and the underlying problem.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Who was affected and what evidence you gathered.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;One requirement at each relevant level.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;One assumption you checked and one exception you discovered.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;How you confirmed shared understanding.&lt;/p&gt;
&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Feature] / [Need] / [Stakeholders] / [Evidence] / [Decision] / [Outcome].&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Interview questions and answer tips&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Lead question: “How do you handle unclear requirements?”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Build your answer around: clarify the desired outcome → identify affected users and constraints → inspect the current process → use examples or a model → resolve assumptions → agree acceptance conditions.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Opening you can adapt:&lt;/strong&gt; “I first clarify what decision or outcome the stakeholder needs. In [project], the initial request was [request]. I used [actual method] to uncover [specific ambiguity], then agreed [decision] with [people].”&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you know requirements are complete?”&lt;/strong&gt; Discuss completeness for the current scope: normal paths, exceptions, rules, permissions, data, integrations and quality needs. Explain how you expose unresolved questions. Avoid claiming that every requirement is permanently complete before delivery.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What if the stakeholder proposes the wrong solution?”&lt;/strong&gt; Avoid calling them wrong. Explain the underlying need, evidence, alternatives and trade-offs, then agree a direction with the decision owner.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Make your answer stronger:&lt;/strong&gt; name the ambiguity and the artefact that resolved it. “I held meetings” explains activity; “the walkthrough exposed two meanings of ‘closed case’” explains the value of the activity.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Optional extension&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Draw a five-step current process and a proposed future process. Mark handoffs, delays, decisions and exception paths.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can you explain the difference between a requested feature and a business need in under one minute?&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Related distinction · business rule versus implementation&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Business rule versus implementation:&lt;/strong&gt; express the rule and observable behaviour; collaborate with Engineering on how to implement it.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your experience card · Ambiguity&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Where to look:&lt;/strong&gt; recent-project requirements and workshops.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Prepare these facts:&lt;/strong&gt; Initial request, conflicting interpretations and resolution.&lt;/p&gt;
&lt;p&gt;Use a real example. Explain your own action, the reasoning and the evidence for the outcome.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;1&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day2&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab2&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🧱 Build small blocks of user value&lt;/h2&gt;&lt;p&gt;A good story is a small, useful building block. INVEST helps you check whether it is ready for a productive conversation.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 2 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; One story with normal, exception and permission criteria.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;INVEST, acceptance criteria and the Given–When–Then picture.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Write a story, three criteria and their test checks.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “What makes a good user story?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;invest&quot; role=&quot;img&quot; aria-label=&quot;Six INVEST blocks: Independent, Negotiable, Valuable, Estimable, Small, Testable&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Check&lt;/th&gt;&lt;th&gt;Ask yourself&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;Independent&lt;/td&gt;&lt;td&gt;Can we minimise coupling while exposing real dependencies?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Negotiable&lt;/td&gt;&lt;td&gt;Can we discuss the best solution?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Valuable&lt;/td&gt;&lt;td&gt;Who benefits, and how?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Estimable&lt;/td&gt;&lt;td&gt;Do we understand enough to forecast effort?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Small&lt;/td&gt;&lt;td&gt;Can we deliver a useful slice?&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Testable&lt;/td&gt;&lt;td&gt;Can someone observe pass or fail?&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;Acceptance criteria are a tiny comic strip&lt;/h3&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;gwt&quot; role=&quot;img&quot; aria-label=&quot;Given is the starting scene, When is the action, Then is the observable result&quot;&gt;&lt;/svg&gt;
    &lt;p&gt;&lt;strong&gt;Hypothetical story:&lt;/strong&gt; As an investigator, I want to claim an unassigned case so ownership is clear.&lt;/p&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Scenario&lt;/th&gt;&lt;th&gt;Expected behaviour&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Happy path&lt;/td&gt;&lt;td&gt;An authorised user claims an unassigned case and becomes its owner.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Conflict&lt;/td&gt;&lt;td&gt;A second claim does not overwrite the first owner.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Permission&lt;/td&gt;&lt;td&gt;An unauthorised attempt is denied without revealing restricted details.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Know the difference&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Epic&lt;/th&gt;&lt;td&gt;A broad area to break down.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Story&lt;/th&gt;&lt;td&gt;A useful user need.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Task&lt;/th&gt;&lt;td&gt;Work needed to implement it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Acceptance criteria&lt;/th&gt;&lt;td&gt;This item&#x27;s expected behaviour.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Definition of Done&lt;/th&gt;&lt;td&gt;The Increment&#x27;s shared quality standard.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;UAT&lt;/th&gt;&lt;td&gt;Check that the behaviour fits business use.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;Split by useful outcomes, not only into database, API and UI layers.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Write one real story and three criteria: normal, exception and permission. Link each criterion to a test.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; user stories, test reviews and UAT coordination.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“What makes a good user story?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Name the user and value → apply two INVEST checks → show one criterion → explain how you validated it.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; improve an example rather than only expanding INVEST.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Split an oversized story into three useful slices. Plan UAT users, data, scenarios, defect triage and acceptance authority.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;What if tests pass but the stakeholder rejects the result?&lt;/li&gt;&lt;li&gt;How do you distinguish a defect from a new request?&lt;/li&gt;&lt;li&gt;What belongs in Done versus acceptance criteria?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;day-reference&quot; id=&quot;annie-notes2&quot;&gt;&lt;h3&gt;📖 Detailed study guide · Day 2&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; demonstrate how you make work understandable, small enough to deliver, and verifiable.&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;Open the part you need. These notes, worked examples and sources all belong to today’s topic.&lt;/p&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Core knowledge&lt;/summary&gt;&lt;div&gt;&lt;p&gt;An epic is a broad area of work. A user story expresses a valuable user need; a task describes implementation work. Naming conventions vary, so explain your team&amp;#39;s usage.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;INVEST&lt;/strong&gt; is a quality heuristic:&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Letter&lt;/th&gt;
&lt;th&gt;Meaning&lt;/th&gt;
&lt;th&gt;Question to ask&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;I&lt;/td&gt;
&lt;td&gt;Independent&lt;/td&gt;
&lt;td&gt;Can this be delivered with minimal coupling?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;N&lt;/td&gt;
&lt;td&gt;Negotiable&lt;/td&gt;
&lt;td&gt;Can the team discuss the best solution?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;V&lt;/td&gt;
&lt;td&gt;Valuable&lt;/td&gt;
&lt;td&gt;Who benefits and why?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;E&lt;/td&gt;
&lt;td&gt;Estimable&lt;/td&gt;
&lt;td&gt;Is there enough understanding to forecast effort?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;S&lt;/td&gt;
&lt;td&gt;Small&lt;/td&gt;
&lt;td&gt;Can it fit into a useful delivery slice?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;T&lt;/td&gt;
&lt;td&gt;Testable&lt;/td&gt;
&lt;td&gt;Can we observe whether it works?&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Independence is an aim, not permission to hide real dependencies. Source: &lt;a href=&quot;https://xp123.com/invest-in-good-stories-and-smart-tasks/&quot;&gt;Bill Wake on INVEST&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Acceptance criteria&lt;/strong&gt; express item-specific expectations. Given–When–Then structures an example: initial context, action/event, observable result. A business rule can apply across multiple stories; a test case supplies concrete data and steps to check behaviour. Source: &lt;a href=&quot;https://cucumber.io/docs/gherkin/reference/&quot;&gt;Cucumber Gherkin reference&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Worked practice example&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Hypothetical story:&lt;/strong&gt; “As an authorised investigator, I want to assign an unassigned case to myself so that ownership of the investigation is clear.”&lt;/p&gt;
&lt;p&gt;Three example criteria:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;&lt;p&gt;Given an unassigned case I am permitted to access, when I claim it, then I become its assigned owner and the displayed status updates.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Given another investigator has already claimed the case, when I attempt to claim it, then ownership remains unchanged and I receive a clear conflict message.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;Given I lack access to a case, when I attempt to claim it, then the request is denied without exposing restricted case details.&lt;/p&gt;
&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;Candidate quality requirement: “95% of claim requests complete within two seconds under the agreed test load.” These numbers are illustrative; a real requirement needs stakeholder justification, workload definition and technical validation.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Vertical splitting:&lt;/strong&gt; deliver a usable basic claim workflow across the necessary layers, then add separately valuable capabilities such as reassignment or bulk actions. Separate database, API and UI tasks alone do not necessarily deliver user value.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;UAT practice approach&lt;/summary&gt;&lt;div&gt;&lt;p&gt;For interview preparation, explain UAT as checking fitness for the intended business use. Agree users, scenarios, environment, data, responsibilities and exit conditions. Link scenarios to requirements. Triage findings into defects, misunderstandings or change requests; do not change the classification merely to protect a release date. Recheck fixes and record unresolved limitations and the authorised release decision.&lt;/p&gt;
&lt;p&gt;If you list UAT coordination in your CV, prepare what you personally organised and who had acceptance or release authority.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your exercise&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Take one real story and write three criteria. Include an exception and permission or data condition. Link each criterion to a test scenario.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Story] / [Criteria] / [Test data] / [Exception] / [UAT outcome].&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Interview questions and answer tips&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Lead question: “What makes a good user story?”&lt;/strong&gt; Explain the user and value, then use two INVEST checks to improve a specific story. Do not stop after expanding the acronym.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What if a story is too large?”&lt;/strong&gt; Identify smaller user outcomes, workflow steps or rule variants. Keep essential controls and quality intact.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“A stakeholder rejects a feature even though the tests pass. What do you do?”&lt;/strong&gt; Check whether the tests reflect the agreed business need, whether a scenario was missed, and whether expectations changed. Bring evidence before deciding whether it is a defect or new scope.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What is acceptance criteria versus Definition of Done?”&lt;/strong&gt; Criteria describe the item; Done is the shared quality standard for the Increment. Passing one story&amp;#39;s criteria does not excuse failing that standard. Reference: &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stronger phrasing:&lt;/strong&gt; “I reviewed coverage for [specific scenario] and found [gap]. We agreed [expected behaviour], updated [artefact] and verified [actual outcome].”&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Optional extension&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Rewrite one oversized epic into three valuable slices. Explain what each slice lets a user do and which dependencies remain.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can another person decide pass or fail without asking what you meant?&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Related distinction · severity versus priority&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Severity versus priority:&lt;/strong&gt; severity describes impact; priority describes urgency/order of action. Explain who decides and using what criteria.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your experience card · UAT&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Where to look:&lt;/strong&gt; Business validation and defect triage.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Prepare these facts:&lt;/strong&gt; Scenario, expected behaviour, issue and final decision.&lt;/p&gt;
&lt;p&gt;Use a real example. Explain your own action, the reasoning and the evidence for the outcome.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;2&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day3&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab3&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;⛵ One boat, a shared destination&lt;/h2&gt;&lt;p&gt;Scrum is a team learning its way toward a goal. Everyone contributes; the accountabilities remain clear.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 3 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; A planning or mid-sprint decision and your contribution.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;Scrum accountabilities, events, commitments and the shared boat.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Map a decision between the BA, PO, Developers and Scrum Master.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “An urgent request arrives mid-sprint. What do you do?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;boat&quot; role=&quot;img&quot; aria-label=&quot;Product Owner supports value and direction, Developers plan and build, Scrum Master supports Scrum and team effectiveness; all share the Sprint Goal&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Who&lt;/th&gt;&lt;th&gt;What to remember&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Product Owner&lt;/td&gt;&lt;td&gt;Value and direction: product value and effective Product Backlog management.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Developers&lt;/td&gt;&lt;td&gt;Plan and build: Sprint plan, usable Increment and quality.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Scrum Master&lt;/td&gt;&lt;td&gt;Help the crew improve: establish Scrum and support team effectiveness.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;BA&lt;/td&gt;&lt;td&gt;Make needs clear. Analysis is a skill contribution, not an extra Scrum accountability.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;Keep looking and adjusting&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;loop&quot; role=&quot;img&quot; aria-label=&quot;Transparency lets us see, inspection helps us learn, adaptation lets us change&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Event&lt;/th&gt;&lt;th&gt;The question it helps answer&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Planning&lt;/td&gt;&lt;td&gt;Why this Sprint, what is feasible, and how?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Daily Scrum&lt;/td&gt;&lt;td&gt;Are we progressing toward the goal? What should change today?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Review&lt;/td&gt;&lt;td&gt;What did we learn with stakeholders? What next?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Retrospective&lt;/td&gt;&lt;td&gt;How can we improve quality and effectiveness?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Three commitments and common traps&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Product Backlog&lt;/th&gt;&lt;td&gt;Product Goal&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Sprint Backlog&lt;/th&gt;&lt;td&gt;Sprint Goal&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Increment&lt;/th&gt;&lt;td&gt;Definition of Done&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;The Sprint is one month or less. Refinement is ongoing work. Ready is optional. A Review is not just a demo or a mandatory release gate. The Daily Scrum is not a manager&#x27;s status collection.&lt;/p&gt;&lt;p&gt;Scrum values: commitment, focus, openness, respect and courage.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Map one real decision: what you prepared, what the PO decided and what Developers planned.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; BA/Scrum Master collaboration with delivery teams.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“An urgent request arrives mid-sprint. What do you do?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Clarify urgency → check impact on the goal → discuss options with PO and Developers → make displaced work visible → adapt the plan without lowering quality.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; explain your contribution without claiming you assigned everyone&#x27;s work.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Describe one feedback loop that changed your team&#x27;s plan. Compare a useful meeting with a status-only meeting.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;How did you balance BA and Scrum Master work?&lt;/li&gt;&lt;li&gt;Who decides what is feasible in a Sprint?&lt;/li&gt;&lt;li&gt;What do you investigate when work carries over repeatedly?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;day-reference&quot; id=&quot;annie-notes3&quot;&gt;&lt;h3&gt;📖 Detailed study guide · Day 3&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; connect your BA/Scrum Master experience to accurate accountabilities and practical delivery decisions.&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;Open the part you need. These notes, worked examples and sources all belong to today’s topic.&lt;/p&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Core knowledge&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Agile emphasises collaboration, feedback, useful software and adapting to change. Scrum is a framework for applying an empirical approach; a collection of Jira tickets and meetings alone does not demonstrate agility. Simplicity means avoiding unnecessary work while preserving what the outcome requires. Sources: &lt;a href=&quot;https://agilemanifesto.org/&quot;&gt;Agile Manifesto&lt;/a&gt; and &lt;a href=&quot;https://agilemanifesto.org/principles.html&quot;&gt;Agile principles&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Scrum uses &lt;strong&gt;transparency, inspection and adaptation&lt;/strong&gt; and the values commitment, focus, openness, respect and courage.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;PO:&lt;/strong&gt; accountable for product value and effective Product Backlog management.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Developers:&lt;/strong&gt; plan and adapt Sprint work and create a usable Increment.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Scrum Master:&lt;/strong&gt; establishes Scrum and supports team effectiveness.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;BA:&lt;/strong&gt; a job or skill contribution, not an additional Scrum accountability.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Artifact commitments: &lt;strong&gt;Product Backlog → Product Goal; Sprint Backlog → Sprint Goal; Increment → Definition of Done.&lt;/strong&gt; Refinement is ongoing work, not a prescribed event. Definition of Ready is an optional practice. Source: &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Events you should be able to explain&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Event&lt;/th&gt;
&lt;th&gt;What to focus on in an interview&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Sprint&lt;/td&gt;
&lt;td&gt;A timebox of one month or less for working toward a goal and producing value&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Planning&lt;/td&gt;
&lt;td&gt;Agree why the Sprint matters, what is feasible and how the work will be approached&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Daily Scrum&lt;/td&gt;
&lt;td&gt;Developers inspect progress toward the Sprint Goal and adapt their plan; it is not a manager&amp;#39;s status collection&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Review&lt;/td&gt;
&lt;td&gt;Inspect outcomes with stakeholders and discuss what should change&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Retrospective&lt;/td&gt;
&lt;td&gt;Improve quality and effectiveness through changes to how the team works&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Planning is collaborative. Developers select work through discussion with the PO and plan how to deliver it. The Review is a working session rather than only a presentation. Sources: &lt;a href=&quot;https://www.scrum.org/resources/what-is-sprint-planning&quot;&gt;Scrum.org Sprint Planning&lt;/a&gt;, &lt;a href=&quot;https://www.scrum.org/resources/what-is-a-sprint-review&quot;&gt;Scrum.org Sprint Review&lt;/a&gt;, and &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Worked practice scenario&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Hypothetical case:&lt;/strong&gt; a stakeholder requests an urgent report halfway through a Sprint.&lt;/p&gt;
&lt;p&gt;A useful answer starts with the reason for urgency. Is it an incident, a real deadline, or a preference? Clarify the consequence of waiting. Discuss options with the PO and Developers, assess the Sprint Goal and displaced work, and make the trade-off visible. Consider a smaller solution or scheduling it next. Follow agreed incident procedures where applicable.&lt;/p&gt;
&lt;p&gt;Avoid both automatic acceptance and a blanket “Agile means nothing can change.” Explain how you would protect the goal and quality while responding to evidence.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your exercise&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Write your real division of responsibilities: What did you prepare? What did the PO decide? What did Developers forecast or plan? What did you facilitate as Scrum Master?&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Event or decision] / [My contribution] / [PO accountability] / [Developer ownership] / [Outcome].&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Interview questions and answer tips&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Lead question: “How did you work as both BA and Scrum Master?”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Use a concrete example of switching focus: clarifying a business rule as BA, then facilitating a dependency conversation or improvement as Scrum Master. Explain how you avoided becoming the only source of answers.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“Who decides Sprint scope?”&lt;/strong&gt; Describe collaboration, capacity and the Sprint Goal. Avoid presenting yourself as the person who unilaterally assigned all work.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you handle carry-over?”&lt;/strong&gt; Investigate size, uncertainty, interruptions, dependencies and quality work. Discuss the next decision and improvement, not merely moving a ticket.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“Is the Review a release gate?”&lt;/strong&gt; A usable Increment can be delivered before the Review. Explain the organisation&amp;#39;s actual release controls separately. Source: &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stronger phrasing:&lt;/strong&gt; “I prepared requirements and dependencies so the team could make an informed plan. The PO clarified value and priorities, and Developers assessed feasibility. When [event] occurred, I helped make [trade-off] explicit.”&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Optional extension&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Compare two situations from your work: one where a meeting created a decision and one where it merely reported status. Explain what you would change.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can you explain your contribution without taking accountability away from the PO or Developers?&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Related reference · velocity and estimates&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Velocity, where used, reflects a team&amp;#39;s completed estimates over a period. Avoid treating it as an individual productivity target or comparing teams with different estimation habits. Story points and velocity are not required Scrum elements. Reference: &lt;a href=&quot;https://scrumguides.org/scrum-guide.html&quot;&gt;Scrum Guide&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your experience card · Improvement&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Where to look:&lt;/strong&gt; BA practices or AI-assisted BA work.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Prepare these facts:&lt;/strong&gt; Previous problem, your change, checks and observed benefit.&lt;/p&gt;
&lt;p&gt;Use a real example. Explain your own action, the reasoning and the evidence for the outcome.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;3&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day4&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab4&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🎒 Pack for the trip you are taking&lt;/h2&gt;&lt;p&gt;A release is a backpack with limited space. Choose what serves the goal; some useful things can wait for another trip.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 4 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; A priority trade-off with evidence and a decision owner.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;Outcomes, MoSCoW, KISS and the backpack picture.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Rank five requests against a goal and explain what waits.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “What if everything is a Must?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;moscow&quot; role=&quot;img&quot; aria-label=&quot;MoSCoW compartments: Must essential, Should important, Could optional, Won&#x27;t this time later&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;MoSCoW&lt;/th&gt;&lt;th&gt;Decision question&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Must&lt;/td&gt;&lt;td&gt;Would the release be unviable without it?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Should&lt;/td&gt;&lt;td&gt;Is it important, but an acceptable workaround exists?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Could&lt;/td&gt;&lt;td&gt;Can we include it if capacity allows?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Won&#x27;t this time&lt;/td&gt;&lt;td&gt;Have we explicitly deferred it for this timeframe?&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;Delivering is not the same as helping&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;outcome&quot; role=&quot;img&quot; aria-label=&quot;Output is an assignment button; outcome is less waiting; evidence is measured assignment time and errors&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Idea&lt;/th&gt;&lt;th&gt;Memory hook and meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;KISS&lt;/td&gt;&lt;td&gt;Pack light: remove unnecessary complexity, not essential controls.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;MVP&lt;/td&gt;&lt;td&gt;A small useful trip: deliver enough value to test an important assumption.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Roadmap&lt;/td&gt;&lt;td&gt;Direction: intended outcomes over time.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Backlog&lt;/td&gt;&lt;td&gt;Next steps: order work and learning toward the goal.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Discovery / delivery&lt;/td&gt;&lt;td&gt;Learn / make: learning continues while we build and release.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Choose five features. Rank them against one goal. Explain value, effort, urgency, dependencies and what you defer.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; backlog sequencing and roadmap alignment.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“Two stakeholders both say their request is a Must. What do you do?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Agree goal and timeframe → ask the consequence of omission → inspect workarounds and evidence → compare trade-offs → align with the decision owner.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; start with the goal, not the name of a scoring method.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Compare build, adopt and extend options using fit, integration, delivery effort, maintenance and exit cost.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;How would you know a feature improved the outcome?&lt;/li&gt;&lt;li&gt;What would you deliberately leave out of an MVP?&lt;/li&gt;&lt;li&gt;How do dependencies affect sequencing?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;day-reference&quot; id=&quot;annie-notes4&quot;&gt;&lt;h3&gt;📖 Detailed study guide · Day 4&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; explain how you decide what deserves attention and what can wait.&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;Open the part you need. These notes, worked examples and sources all belong to today’s topic.&lt;/p&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Core knowledge&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Use this practical vocabulary:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Output:&lt;/strong&gt; something delivered, such as a bulk-assignment feature.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Outcome:&lt;/strong&gt; a resulting change, such as less time waiting for assignment.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Product goal:&lt;/strong&gt; the future result the team is working toward.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Roadmap:&lt;/strong&gt; a communication of direction and intended outcomes over time.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Backlog:&lt;/strong&gt; work and learning opportunities that can support those outcomes.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;MVP:&lt;/strong&gt; a small viable way to test important assumptions and deliver enough value to learn.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Discovery:&lt;/strong&gt; reduce uncertainty about the problem, users and solution.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Delivery:&lt;/strong&gt; build, validate and release useful changes. Discovery continues during delivery.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Do not equate more output with more value. A sensible interview answer explains what evidence would show improvement.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;MoSCoW and other prioritisation tools&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;MoSCoW:&lt;/strong&gt; Must Have, Should Have, Could Have, Won&amp;#39;t Have this time. “Must” needs a defensible consequence if omitted; “Won&amp;#39;t this time” is a boundary for an agreed timeframe, not necessarily a permanent rejection. Source: &lt;a href=&quot;https://www.agilebusiness.org/resource/what-is-moscow-prioritization/&quot;&gt;Agile Business Consortium&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;For this interview, master MoSCoW and a simple value/effort comparison before adding more scoring frameworks. Consider urgency, risk, dependencies and uncertainty alongside benefit. Scores make assumptions visible; they do not remove the need for judgment.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;KISS:&lt;/strong&gt; keep the solution simple enough to understand, maintain and validate. Do not remove necessary security, quality or exceptional behaviour to make it look simpler. This heuristic is compatible with the Agile principle of avoiding unnecessary work; it is not a required Scrum technique. Reference: &lt;a href=&quot;https://agilemanifesto.org/principles.html&quot;&gt;Agile principles&lt;/a&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Worked practice example&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Hypothetical release:&lt;/strong&gt; users need to assign cases reliably.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Candidate&lt;/th&gt;
&lt;th&gt;Illustrative decision&lt;/th&gt;
&lt;th&gt;Reason to discuss&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Authorised single-case assignment&lt;/td&gt;
&lt;td&gt;Must&lt;/td&gt;
&lt;td&gt;Enables the primary workflow&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Prevent conflicting assignments&lt;/td&gt;
&lt;td&gt;Must&lt;/td&gt;
&lt;td&gt;Preserves reliable ownership&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Assignment history&lt;/td&gt;
&lt;td&gt;Must if required by agreed controls&lt;/td&gt;
&lt;td&gt;Explain the actual control obligation&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Bulk assignment&lt;/td&gt;
&lt;td&gt;Should&lt;/td&gt;
&lt;td&gt;Improves efficiency; a single-case workaround exists&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Cosmetic personalisation&lt;/td&gt;
&lt;td&gt;Could or later&lt;/td&gt;
&lt;td&gt;Less directly connected to the current goal&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;These priorities belong to this scenario. Validate actual user impact, constraints and effort before using them on a real product.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your exercise&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Choose two competing requests from your experience. State the goal, benefits, cost or effort assumptions, dependencies, risk and cost of delay. Explain your recommendation and who made the final decision.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Goal] / [Options] / [Evidence] / [Trade-off] / [Decision owner] / [Result].&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Interview questions and answer tips&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Lead question: “How do you prioritise a backlog?”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Start with the goal, not the method name. Explain whose needs you considered, what evidence you used, how you handled constraints and how priorities were revisited.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“What if everything is a Must?”&lt;/strong&gt; Ask what would genuinely prevent a viable release, whether an acceptable workaround exists, and which timeframe is being discussed.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you know a feature was successful?”&lt;/strong&gt; Identify an outcome measure and a quality guardrail. Example: assignment time alongside incorrect-assignment rate. State whether you actually measured these or would propose them.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“Build or buy?”&lt;/strong&gt; Compare fit, integration, delivery effort, ownership, maintenance and exit costs. Include adopting or extending an existing capability, and identify assumptions needing validation.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Weak:&lt;/strong&gt; “I used MoSCoW and delivered the highest priorities.”&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Stronger:&lt;/strong&gt; “Our goal was [goal]. I compared [options] using [evidence]. I recommended [choice] because [reason], made [trade-off] visible, and aligned the decision with [owner]. The actual result was [evidence].”&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Optional extension&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Write a one-sentence product goal and a six-item backlog. Remove two items using KISS and explain why the remaining set still supports the goal.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Can you defend a decision to delay a popular feature?&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Related reference · SMART objectives&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;SMART objectives:&lt;/strong&gt; specific, measurable, achievable, relevant and time-bound is a common formulation. Make targets meaningful and supported by a baseline.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your experience card · Prioritisation&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Where to look:&lt;/strong&gt; Roadmap alignment and backlog sequencing.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Prepare these facts:&lt;/strong&gt; Competing needs, evidence, decision owner and trade-off.&lt;/p&gt;
&lt;p&gt;Use a real example. Explain your own action, the reasoning and the evidence for the outcome.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;4&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day5&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab5&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🌦️ Check the weather before the journey&lt;/h2&gt;&lt;p&gt;A cloud might bring rain: a risk. The road is already flooded: an issue. Both need an owner and action.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 5 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; A risk or dependency with an owner, response and outcome.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;RAID, likelihood/impact, delivery measures and the weather picture.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Write a risk, response, escalation trigger and short update.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “A dependency team will be late. What do you do?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;raid&quot; role=&quot;img&quot; aria-label=&quot;Risk may happen; issue is happening; assumption needs checking; dependency relies on someone or something&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;RAID&lt;/th&gt;&lt;th&gt;Case-work example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Risk&lt;/td&gt;&lt;td&gt;The external API might change before testing.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Assumption&lt;/td&gt;&lt;td&gt;We expect business testers to be available.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Issue&lt;/td&gt;&lt;td&gt;The test environment is unavailable now.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Dependency&lt;/td&gt;&lt;td&gt;End-to-end testing needs the real external interface.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;A risk matrix is a conversation starter&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;risk&quot; role=&quot;img&quot; aria-label=&quot;Illustrative three by three likelihood impact matrix, scores one through nine, not probabilities&quot;&gt;&lt;/svg&gt;
    &lt;p&gt;These scores are illustrative rankings, not probabilities. Agree your scales and tolerance. Keep the reason, owner, response and review date beside the score.&lt;/p&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What can you do about a threat?&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Avoid&lt;/th&gt;&lt;td&gt;Change the plan to remove exposure.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Mitigate&lt;/th&gt;&lt;td&gt;Reduce likelihood or impact.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Transfer&lt;/th&gt;&lt;td&gt;Arrange an agreed transfer of exposure.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Accept&lt;/th&gt;&lt;td&gt;Use appropriate authority, monitoring and contingency.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Residual risk:&lt;/strong&gt; what remains after the response. &lt;strong&gt;Contingency:&lt;/strong&gt; what to do if it happens.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Write one risk: “Because of [cause], [event] may happen, leading to [impact].” Add an owner, action and escalation trigger.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; risks, dependencies and evidence-based escalation.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“A dependency team will be late. What do you do?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Confirm facts → identify affected outcomes → explore alternatives → agree owners and checkpoints → update forecast → escalate a decision with options.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; explain what changed after your escalation.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Write a four-line update: progress, forecast, risk and decision needed. For a scope change, assess value, effort, data, interfaces, tests, timing and support.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;When do you escalate?&lt;/li&gt;&lt;li&gt;How do you handle a fixed date and changing scope?&lt;/li&gt;&lt;li&gt;How do you know a mitigation worked?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;day-reference&quot; id=&quot;annie-notes5&quot;&gt;&lt;h3&gt;📖 Detailed study guide · Day 5&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; show that you make delivery uncertainty visible and help people act before problems grow.&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;Open the part you need. These notes, worked examples and sources all belong to today’s topic.&lt;/p&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Core knowledge&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Project management coordinates objectives, scope, people, timing, cost and risk within the organisation&amp;#39;s governance. A forecast reflects current evidence and uncertainty; it should be updated when assumptions change.&lt;/p&gt;
&lt;p&gt;A &lt;strong&gt;risk&lt;/strong&gt; is an uncertain event or condition affecting objectives; an &lt;strong&gt;issue&lt;/strong&gt; is a current problem. An &lt;strong&gt;assumption&lt;/strong&gt; needs validation. A &lt;strong&gt;dependency&lt;/strong&gt; is a reliance on another activity, team or decision. These can interact: a dependency may create a risk and become an issue when missed. Source: &lt;a href=&quot;https://www.pmi.org/learning/library/integrated-project-risk-issue-management-6303&quot;&gt;PMI on integrated risk and issue management&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;RAID commonly means Risks, Assumptions, Issues and Dependencies; organisations sometimes use different expansions. Explain your team&amp;#39;s actual usage.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Risk assessment and responses&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Describe risk as: &lt;strong&gt;Because of [cause], [uncertain event] may happen, resulting in [impact].&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Assess likelihood and impact using agreed definitions. A simple score such as likelihood × impact is an illustrative ranking device, not a probability or exact measure of loss. Keep the reasoning, owner, response, trigger and review date beside it. Assess residual risk after the response. Reference: &lt;a href=&quot;https://csrc.nist.gov/pubs/sp/800/30/r1/final&quot;&gt;NIST risk assessment guidance&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;Common responses to threats: avoid the exposure, reduce likelihood or impact, transfer an agreed exposure, or accept it with appropriate authority and monitoring. Contingency explains what to do if the event occurs.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Worked risk matrix&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Hypothetical scale:&lt;/strong&gt; likelihood 1 = unlikely, 2 = plausible, 3 = likely. Impact 1 = small local disruption, 2 = Sprint objective affected, 3 = major release or control objective affected. Product = review score only; no universal “high risk” cutoff is implied.&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Illustrative risk&lt;/th&gt;
&lt;th&gt;L × I&lt;/th&gt;
&lt;th&gt;Proposed response and trigger&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;An external API contract may change, invalidating integration assumptions&lt;/td&gt;
&lt;td&gt;2 × 3 = 6&lt;/td&gt;
&lt;td&gt;Confirm contract owner, versioning and change notice; escalate if agreement is absent by the planning checkpoint&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Business users may be unavailable for UAT&lt;/td&gt;
&lt;td&gt;2 × 2 = 4&lt;/td&gt;
&lt;td&gt;Agree deputies and test slots; review availability before the test window&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Legacy data may lack required ownership fields&lt;/td&gt;
&lt;td&gt;3 × 3 = 9&lt;/td&gt;
&lt;td&gt;Profile a sample early and agree remediation; revisit release scope if mapping remains unresolved&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;The lowest score still deserves action if its consequence exceeds an agreed tolerance.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Change impact and status communication&lt;/summary&gt;&lt;div&gt;&lt;p&gt;For a scope request, consider value, requirements, data, interfaces, tests, effort, dependencies, timing and ongoing support. Present options to the appropriate decision owner and update agreed records.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Hypothetical status update:&lt;/strong&gt; “Case assignment is ready for business validation. The integration dependency remains unresolved and threatens the planned test window. We can use a limited test stub now, but full end-to-end testing still requires the real interface. I recommend confirming its owner and delivery date today; otherwise we should revise the test forecast.”&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your exercise&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Write one real risk and one real issue from your work. Explain the difference in actions, ownership and communication.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Your notes:&lt;/strong&gt; [Cause/event/impact] / [Evidence] / [Response] / [Owner] / [Trigger] / [Residual exposure] / [Outcome].&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Interview questions and answer tips&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Lead question: “Tell me about a risk you identified early.”&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;Show the signal you noticed, why it mattered, the options you proposed and how you followed through. If the risk never occurred, explain the evidence for reduced exposure rather than claiming an unprovable avoided loss.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“A dependency team will be late. What do you do?”&lt;/strong&gt; Establish the real dependency, assess affected outcomes, explore decoupling or sequencing, agree owners and checkpoints, and update the forecast.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“When do you escalate?”&lt;/strong&gt; When impact or decisions exceed your authority, agreed thresholds are crossed, or action is needed by a deadline. Escalate with facts, options and a recommendation.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;“How do you keep a fixed date?”&lt;/strong&gt; Explain scope and sequence options, capacity evidence, quality constraints and decision authority. Avoid guaranteeing an outcome before assessing feasibility.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Optional extension&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Choose one dependency and write a request to its owner: what is needed, why, when, how completion will be verified, and what happens if it slips.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Self-check:&lt;/strong&gt; Does your risk log cause action, or merely record concern?&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Related reference · delivery measures&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;WIP:&lt;/strong&gt; started work that has not finished.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Throughput:&lt;/strong&gt; completed items per unit of time.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Cycle time:&lt;/strong&gt; elapsed time from the team&amp;#39;s defined start to finish.&lt;/p&gt;
&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Work item age:&lt;/strong&gt; elapsed time since an unfinished item started.&lt;/p&gt;
&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Use consistent boundaries and inspect blocked or ageing work. These measure flow, not product value. Source: &lt;a href=&quot;https://kanbanguides.org/the-kanban-guide/&quot;&gt;Kanban Guide&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Practice question:&lt;/strong&gt; “Delivery is fast but users are unhappy. What would you investigate?” Consider whether the delivered work addresses the need, whether quality or usability is poor, and whether adoption barriers exist. Pair delivery measures with a user outcome and quality measure.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Related reference · RACI and decision ownership&lt;/summary&gt;&lt;div&gt;&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;RACI:&lt;/strong&gt; Responsible performs work; Accountable owns the result or decision; Consulted contributes input; Informed receives updates. Use it to clarify local governance, not to replace Scrum accountabilities.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your experience card · Dependency&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Where to look:&lt;/strong&gt; Coordination across two Agile teams.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Prepare these facts:&lt;/strong&gt; Reliance, warning signal, action and outcome.&lt;/p&gt;
&lt;p&gt;Use a real example. Explain your own action, the reasoning and the evidence for the outcome.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;5&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain this day using a real example.&lt;/span&gt;&lt;/label&gt;
  &lt;/section&gt;

  &lt;section id=&quot;annie-day6&quot; class=&quot;chapter&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab6&quot; hidden&gt;
    &lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🧩 Pick the picture that solves the puzzle&lt;/h2&gt;&lt;p&gt;You do not need every diagram. Choose the one that makes the unclear part visible.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 6 study plan&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Finish with:&lt;/strong&gt; A model or workshop that changed a decision.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Time&lt;/th&gt;&lt;th&gt;Today’s task&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · learn&lt;/td&gt;&lt;td&gt;Models, facilitation and the puzzle picture.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · practise&lt;/td&gt;&lt;td&gt;Draw one model and prepare two questions it helps resolve.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · speak&lt;/td&gt;&lt;td&gt;Answer: “How do you choose an analysis technique?”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;&lt;strong&gt;Have a full hour?&lt;/strong&gt; Use the optional exercise and two follow-up questions in this tab. Detailed notes support revision; you do not need to read every section in one sitting.&lt;/p&gt;&lt;/div&gt;
    &lt;svg class=&quot;drawing&quot; data-scene=&quot;models&quot; role=&quot;img&quot; aria-label=&quot;One case viewed through process steps, states and related entities&quot;&gt;&lt;/svg&gt;
    &lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Your question&lt;/th&gt;&lt;th&gt;Choose this picture&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;What happens next?&lt;/td&gt;&lt;td&gt;Process flow&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Which changes are allowed?&lt;/td&gt;&lt;td&gt;State model&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;How do things relate?&lt;/td&gt;&lt;td&gt;Entity relationship model&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What does this field mean?&lt;/td&gt;&lt;td&gt;Data dictionary&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Who calls whom?&lt;/td&gt;&lt;td&gt;Sequence diagram&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Can a user understand the screen?&lt;/td&gt;&lt;td&gt;Wireframe&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What is the whole experience?&lt;/td&gt;&lt;td&gt;Journey map&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
    &lt;h3&gt;A workshop should end in a useful change&lt;/h3&gt;&lt;svg class=&quot;drawing&quot; data-scene=&quot;workshop&quot; role=&quot;img&quot; aria-label=&quot;Prepare the decision, explore evidence together, agree owners and follow up&quot;&gt;&lt;/svg&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Five Whys and technical analysis&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Ask why repeatedly to investigate causes. Five is not a compulsory count. Check evidence and allow more than one cause.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;API and data mapping&lt;/th&gt;&lt;th&gt;Remember to check&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Meaning&lt;/td&gt;&lt;td&gt;Source, target, type, allowed values and transformations.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Exceptions&lt;/td&gt;&lt;td&gt;Missing data, errors, timeouts, retries and duplicates.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Trust&lt;/td&gt;&lt;td&gt;Permissions and the authoritative source.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Validation&lt;/td&gt;&lt;td&gt;What the user sees and how the scenario is tested.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;div class=&quot;practice&quot;&gt;&lt;div&gt;&lt;h3&gt;📝 Your 15-minute mission&lt;/h3&gt;&lt;p&gt;Pick one previous-project integration or previous-project mock-up. Draw a model and name two questions it helps answer.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Use your CV:&lt;/strong&gt; mock-ups, process flows and API/data mapping.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;🎤 Say it aloud&lt;/h3&gt;&lt;p&gt;“How do you choose an analysis technique?”&lt;/p&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;See an answer path&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Uncertainty → chosen model → gap discovered → people involved → decision → validation.&lt;/p&gt;&lt;p&gt;“The state model exposed [gap]. We agreed [rule] and checked it through [method].”&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;strong&gt;Better answer:&lt;/strong&gt; explain the decision the diagram enabled.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Extra 30 minutes and interview questions&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Explain the same technical issue to an engineer, then to a sponsor. Keep facts consistent; change the detail.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;How do you handle stakeholder conflict?&lt;/li&gt;&lt;li&gt;What did your data mapping actually cover?&lt;/li&gt;&lt;li&gt;How do you make sure a workshop leads to action?&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;day-reference&quot; id=&quot;annie-notes6&quot;&gt;&lt;h3&gt;📖 Detailed study guide · Day 6&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Goal:&lt;/strong&gt; choose a model that resolves a real question and facilitate a useful decision.&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;Open the part you need. These notes, worked examples and sources all belong to today’s topic.&lt;/p&gt;&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Core knowledge&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Choose the smallest artefact that answers the question:&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Technique&lt;/th&gt;
&lt;th&gt;Useful question&lt;/th&gt;
&lt;th&gt;Practice example&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Process flow&lt;/td&gt;
&lt;td&gt;What happens, in what order, and where are the decisions?&lt;/td&gt;
&lt;td&gt;How is a case assessed and assigned?&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;State model&lt;/td&gt;
&lt;td&gt;What states exist and which transitions are allowed?&lt;/td&gt;
&lt;td&gt;Open → In review → Resolved → Reopened&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Entity relationship model&lt;/td&gt;
&lt;td&gt;What things exist and how are they related?&lt;/td&gt;
&lt;td&gt;Case, Investigator, Assignment and Comment&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Data dictionary&lt;/td&gt;
&lt;td&gt;What does each field mean and what rules apply?&lt;/td&gt;
&lt;td&gt;ownerId, status, createdAt, permitted values&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Sequence diagram&lt;/td&gt;
&lt;td&gt;Who calls whom and what happens on failure?&lt;/td&gt;
&lt;td&gt;UI → service → external fraud system&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Wireframe&lt;/td&gt;
&lt;td&gt;Can users understand and complete the workflow?&lt;/td&gt;
&lt;td&gt;Ownership controls and conflict messages&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Journey map&lt;/td&gt;
&lt;td&gt;What is the user&amp;#39;s experience across steps and channels?&lt;/td&gt;
&lt;td&gt;From receiving an alert to completing follow-up&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;These examples are illustrative; use the actual states, entities and interfaces from your projects.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;day-note&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;A practical workshop structure&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Before: define the decision, invite people with relevant knowledge and authority, and send a concise example.&lt;/p&gt;
&lt;p&gt;During: agree the problem, walk through a real scenario, expose assumptions, compare alternatives, and record unresolved points. Invite quieter participants; separate evidence from preference.&lt;/p&gt;
&lt;p&gt;After: circulate decisions, owners and open actions. Update requirements or models and confirm that people interpret the result consistently.&lt;/p&gt;
