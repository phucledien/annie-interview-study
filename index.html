&lt;h4&gt;0:35–1:40 · Minimum information&lt;/h4&gt;&lt;p&gt;“Each public item needs a stable identity, title, resource type, clear purpose, source and version, owner or contact route, topic and analytical task, inputs, outputs, requirements and limitations. A dataset also needs relevant time and place coverage, format and access information. I would capture licence or access status with evidence and record who reviewed the entry and when. Missing critical information would hold the item in review. If policy permits listing a resource with uncertain rights, that uncertainty must be visible; I would never label it open merely because it is on GitHub. These fields help users judge both relevance and practical usability.”&lt;/p&gt;
&lt;h4&gt;1:40–2:40 · Who reviews AI&lt;/h4&gt;&lt;p&gt;“AI can prepare a draft and show the source for each suggested field. For the pilot, a curator reviews every AI-generated description and category before publication. Scientific claims go to a domain expert, while rights or privacy concerns go to the relevant specialist. Conflicting sources, missing evidence and material changes require review. Mechanical validation can run automatically, but I would not use an uncalibrated confidence score to publish semantic claims. The review records the approved revision and corrections. Manual entry remains available if the AI is unavailable.”&lt;/p&gt;
&lt;h4&gt;2:40–3:30 · The one measure&lt;/h4&gt;&lt;p&gt;“My primary measure would be the proportion of eligible discovery tasks in which a user finds a suitable resource within an agreed time and correctly explains why it fits. For the pilot, I propose five minutes and an expert-reviewed task rubric. We would establish a baseline, include abandoned attempts as failures and keep the task mix comparable after changes. Tasks with no suitable resource in the catalogue are coverage gaps and should be reported separately. Clicks can help diagnose behaviour, but they do not prove successful discovery.”&lt;/p&gt;
&lt;h4&gt;3:30–4:40 · Sprint one&lt;/h4&gt;&lt;p&gt;“The first Sprint Goal would be a complete, reviewed discovery journey. I would agree a representative pilot set—perhaps 20 resources, subject to estimates—and build the small metadata model, draft import or entry, curator review, publication, keyword search, simple filters and a useful detail page. We would include empty results, missing metadata and the manual fallback, then observe users completing agreed tasks. The 500-source inventory can inform coverage and duplicates, but I would not promise all 500 reviewed items in the first sprint. I would defer advanced AI search and automatic publication until evidence justifies them.”&lt;/p&gt;
&lt;h4&gt;4:40–5:00 · Close&lt;/h4&gt;&lt;p&gt;“That gives us one trustworthy journey, clear ownership and evidence that users can find and assess resources. We can use the pilot failures and review effort to decide what to improve and how to expand. I would validate this plan with epidemiologists, curators, the PO and Developers before making commitments.”&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;interview-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;The 3-minute follow-up: likely challenges&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;They ask…&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;A concise answer&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Why not use AI to approve everything?&lt;/td&gt;&lt;td&gt;We do not yet have evidence that its scores predict field correctness. Start with review, measure errors and automate only justified low-risk decisions later.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Why not publish all 500 immediately?&lt;/td&gt;&lt;td&gt;The bottleneck is trustworthy metadata and assessment, not the count of imported URLs. Inventory broadly; publish reviewed records and expand with evidence.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What if no licence is stated?&lt;/td&gt;&lt;td&gt;Record unknown, seek evidence and route for review. Do not imply permission to reuse. Follow the agreed listing policy.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What if a paper and a package are the same tool?&lt;/td&gt;&lt;td&gt;Keep distinct source records linked to one verified resource and its versions. Escalate uncertain matches rather than silently merging.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What if you miss the metric target?&lt;/td&gt;&lt;td&gt;Inspect failed tasks: coverage, vocabulary, metadata, ranking or usability. Select the next change from that evidence; verify the target and sample were sensible.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Can you promise less duplicated model development?&lt;/td&gt;&lt;td&gt;Not from discovery alone. Follow up on actual reuse and the reasons users still rebuild; discovery is the first measurable step.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;a href=&quot;#day11-map&quot;&gt;↑ Back to question map&lt;/a&gt;&lt;/p&gt;&lt;/article&gt;&lt;div class=&quot;interview-note&quot;&gt;&lt;h3&gt;🎒 Bring these five things to the interview&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;A chronological job timeline with honest approximate time splits.&lt;/li&gt;&lt;li&gt;One real knowledge/dataset-documentation item: what it meant, who reviewed it and how it stayed current.&lt;/li&gt;&lt;li&gt;One requirements or integration trade-off and one workshop outcome you can explain in detail.&lt;/li&gt;&lt;li&gt;A wireframe or model you personally made, or a clear anonymised description.&lt;/li&gt;&lt;li&gt;The four-card case outline: label, check, find, build.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;strong&gt;When you have no direct example:&lt;/strong&gt; name the gap briefly, describe the closest real skill, then make a specific proposal. Do not convert this guide’s examples into claimed achievements.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;New source checks: 3 November 2026. &lt;a href=&quot;https://www.who.int/initiatives/collaboratory&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;WHO Collaboratory&lt;/a&gt; provides the domain context. The case designs and numerical gates are learning proposals, not WHO requirements or endorsements.&lt;/p&gt;&lt;/div&gt;&lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;11&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I rehearsed catalogue BA reasoning and separated real evidence from proposed approaches.&lt;/span&gt;&lt;/label&gt;&lt;/section&gt;
&lt;section id=&quot;annie-day12&quot; class=&quot;chapter recap-book&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;annie-tab12&quot; hidden&gt;&lt;div class=&quot;chapter-intro&quot;&gt;&lt;h2&gt;🧠 Day 12 · Catalogue answers, word map &amp;amp; design teamwork&lt;/h2&gt;&lt;p&gt;Your final revision page: learn the words, connect the ideas, then rehearse short, honest answers. The examples follow one simple library story.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;daily-plan&quot;&gt;&lt;h3&gt;Your Day 12 study plan&lt;/h3&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Time&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Do this&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10 min · understand&lt;/td&gt;&lt;td&gt;Read the eight core terms and follow the connection picture.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;15 min · rehearse&lt;/td&gt;&lt;td&gt;Say the short answers aloud. Expand three using real examples from your work.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 min · remember&lt;/td&gt;&lt;td&gt;Explain CARD → CHECK → FIND → BUILD without reading.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;text-small&quot;&gt;Optional extra 30 minutes: review the decision tools, then run the 15-minute live case. Use Day 11 for detailed follow-up questions. No need to memorise every sentence.&lt;/p&gt;&lt;/div&gt;&lt;nav class=&quot;category-map&quot; aria-label=&quot;Day 12 sections&quot;&gt;&lt;a href=&quot;#day12-terms&quot;&gt;A · Core terms&lt;/a&gt;&lt;a href=&quot;#day12-map&quot;&gt;B · How they connect&lt;/a&gt;&lt;a href=&quot;#day12-more&quot;&gt;C · More useful words&lt;/a&gt;&lt;a href=&quot;#day12-answers&quot;&gt;D · Catalogue answers&lt;/a&gt;&lt;a href=&quot;#day12-case&quot;&gt;E · Simple case&lt;/a&gt;&lt;a href=&quot;#day12-decisions&quot;&gt;F · Decision tools&lt;/a&gt;&lt;a href=&quot;#day12-live&quot;&gt;G · 15-minute live case&lt;/a&gt;&lt;a href=&quot;#day12-design&quot;&gt;H · BA + designer&lt;/a&gt;&lt;/nav&gt;&lt;div class=&quot;summary-part&quot; id=&quot;day12-terms&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;A · Learn these first&lt;/p&gt;&lt;h3&gt;📚 Imagine a library of useful computer tools&lt;/h3&gt;&lt;p&gt;Ben needs a tool to draw a chart. He wants to find an existing tool and understand whether it fits his task. Jo looks after the catalogue; Pip the robot helps draft labels. &lt;strong&gt;The catalogue can link to tools elsewhere—it does not have to store or run them.&lt;/strong&gt;&lt;/p&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Must-understand term&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Simple meaning + one example&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;1. Resource / item&lt;/strong&gt;&lt;br&gt;📦 The actual thing&lt;/td&gt;&lt;td&gt;A tool, dataset or other resource people may use. Example: a program called &lt;em&gt;Weekly Picture Maker&lt;/em&gt;. In an interview, clarify whether “item” means a resource, a version or a source entry.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;2. Catalogue&lt;/strong&gt;&lt;br&gt;📚 The searchable index&lt;/td&gt;&lt;td&gt;A collection of organised records that helps people find and assess resources. Like a library index showing what exists and where to get it.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;3. Listing / catalogue entry&lt;/strong&gt;&lt;br&gt;🪪 One resource card&lt;/td&gt;&lt;td&gt;The entry describing a resource inside the catalogue. Its public page shows approved information and links. The card is not the tool itself; drafts may exist internally before publication.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;4. Source&lt;/strong&gt;&lt;br&gt;🔗 Where the evidence came from&lt;/td&gt;&lt;td&gt;The original page, documentation, package record or paper supporting a fact. Example: the tool’s README in a GitHub repository. GitHub is the platform; the particular repository/document is the source you check.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;5. Metadata&lt;/strong&gt;&lt;br&gt;🏷️ Facts on the label&lt;/td&gt;&lt;td&gt;Information describing the resource: title, purpose, owner, version, inputs, licence and topic. It helps someone judge the resource without inspecting all its contents first.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;6. Taxonomy&lt;/strong&gt;&lt;br&gt;🗂️ The agreed category structure&lt;/td&gt;&lt;td&gt;A consistent way to organise concepts into categories, often broader and narrower ones. Example: a health-topic branch “respiratory disease → influenza”. An expert should validate the chosen terms.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;7. Data model&lt;/strong&gt;&lt;br&gt;🕸️ The blueprint of things and links&lt;/td&gt;&lt;td&gt;Defines entities, their information and relationships. Example: one Resource has several Versions; a Review approves a metadata revision; Source records provide evidence. It is not a disease-prediction model.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;strong&gt;8. Primary measure&lt;/strong&gt;&lt;br&gt;⭐ The main success check&lt;/td&gt;&lt;td&gt;The main number chosen to judge whether the product is solving its problem. Here: how often users successfully find and assess a suitable resource. It is not a field on the tool’s metadata card.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;div class=&quot;summary-note&quot;&gt;&lt;strong&gt;One sentence to remember:&lt;/strong&gt; “The catalogue contains listings. Each listing uses metadata from sources. Taxonomy makes the labels consistent. The data model connects the records. Our primary measure tells us whether people can use this information to find what they need.”&lt;/div&gt;
&lt;p class=&quot;text-small&quot;&gt;Memory aids, not universal implementation rules. The distinction between a resource and its catalogue record is supported by &lt;a href=&quot;https://www.w3.org/TR/vocab-dcat-3/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;W3C DCAT 3&lt;/a&gt;; concept labels and relationships are explained by &lt;a href=&quot;https://www.w3.org/TR/skos-primer/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;W3C SKOS&lt;/a&gt;. The library story and product measure are teaching examples.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;summary-part&quot; id=&quot;day12-map&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;B · See how the words connect&lt;/p&gt;&lt;h3&gt;🧵 Follow one resource from source to successful use&lt;/h3&gt;
&lt;div class=&quot;concept-flow&quot; role=&quot;img&quot; aria-label=&quot;Sources provide evidence for metadata. Taxonomy standardises topic labels. A reviewer approves the listing in the catalogue. Search and filters help a user find and assess the resource. A primary measure checks success. The data model connects the underlying records.&quot;&gt;
&lt;div class=&quot;concept-node&quot;&gt;&lt;strong&gt;🔗 Source documents&lt;/strong&gt;&lt;p&gt;“Here is the original README, package page or paper.”&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;concept-arrow&quot;&gt;↓ provide evidence for&lt;/div&gt;
&lt;div class=&quot;concept-node&quot;&gt;&lt;strong&gt;🏷️ Metadata&lt;/strong&gt;&lt;p&gt;“This is its name, purpose, version, inputs and limits.”&lt;/p&gt;&lt;div class=&quot;concept-side&quot;&gt;🗂️ &lt;strong&gt;Taxonomy helps here:&lt;/strong&gt; use agreed topic labels, rather than different spellings for the same idea.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;concept-arrow&quot;&gt;↓ a reviewer checks the facts&lt;/div&gt;
&lt;div class=&quot;concept-node&quot;&gt;&lt;strong&gt;🪪 Published listing inside the 📚 catalogue&lt;/strong&gt;&lt;p&gt;“Here is the approved card, with links back to the resource and evidence.”&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;concept-arrow&quot;&gt;↓ search and filters use its information&lt;/div&gt;
&lt;div class=&quot;concept-node&quot;&gt;&lt;strong&gt;🔎 Ben finds and assesses the resource&lt;/strong&gt;&lt;p&gt;“Does it do my task? Can I use its inputs? What are the limits?”&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;concept-arrow&quot;&gt;↓ measure whether that task succeeds&lt;/div&gt;
&lt;div class=&quot;concept-node&quot;&gt;&lt;strong&gt;⭐ Primary measure&lt;/strong&gt;&lt;p&gt;“How many attempted tasks ended in finding and correctly assessing a suitable resource?”&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;model-ribbon&quot;&gt;🕸️ &lt;strong&gt;Data model = the blueprint underneath:&lt;/strong&gt;&lt;br&gt;Resource → Versions · Resource ↔ Topics · Metadata revision → Sources + Reviews&lt;br&gt;&lt;small&gt;It organises the connected records; it is not another approval step.&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h4&gt;The same example, in a tiny card&lt;/h4&gt;&lt;div class=&quot;example-card&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Invented resource · not a real product&lt;/p&gt;&lt;h4&gt;Weekly Picture Maker&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;Type:&lt;/strong&gt; tool · &lt;strong&gt;Task:&lt;/strong&gt; draw a weekly chart&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Input:&lt;/strong&gt; a table with “week” and “count”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Output:&lt;/strong&gt; a chart · &lt;strong&gt;Limit:&lt;/strong&gt; does not explain the cause of a change&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Version:&lt;/strong&gt; 1.2 · &lt;strong&gt;Owner:&lt;/strong&gt; Maple Tools Team&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Source:&lt;/strong&gt; its README and package page&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Rights:&lt;/strong&gt; unknown—needs review before it can be presented as reusable&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Status:&lt;/strong&gt; draft, awaiting Jo’s review&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;summary-cards&quot;&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;📊&lt;/span&gt;&lt;h4&gt;Data&lt;/h4&gt;&lt;p&gt;Rows such as “week 1: 12” and “week 2: 15”. These are the tool’s inputs.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🏷️&lt;/span&gt;&lt;h4&gt;Metadata&lt;/h4&gt;&lt;p&gt;“Accepts weekly counts and draws a chart.” These are facts about the tool.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🧩&lt;/span&gt;&lt;h4&gt;Data model&lt;/h4&gt;&lt;p&gt;Tool has Versions; each Version has metadata and review history. This is the structure.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Three easy-to-confuse pairs&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;These are different&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Remember the difference&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Metadata vs metadata schema&lt;/td&gt;&lt;td&gt;Metadata = filled-in facts. Schema = the form/rules saying which fields exist, their types and which are required.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Taxonomy vs filters&lt;/td&gt;&lt;td&gt;Taxonomy = organised concepts. A filter = a screen control using metadata to narrow results. Topic, resource type and programming language are separate facets; not every filter is a taxonomy.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Source entries vs unique resources&lt;/td&gt;&lt;td&gt;A paper, GitHub repository and CRAN package can describe the same tool. Three source entries need not mean three tools; check identity before linking or merging.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;h4&gt;A primary measure with small numbers&lt;/h4&gt;&lt;div class=&quot;measure-example&quot;&gt;&lt;p&gt;&lt;strong&gt;10 people try an eligible discovery task. 8 succeed.&lt;/strong&gt;&lt;/p&gt;&lt;p class=&quot;big-equation&quot;&gt;8 ÷ 10 × 100 = &lt;strong&gt;80%&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;In this fictional example, success means finding a suitable resource within the agreed time and correctly explaining why it fits. A click alone does not count.&lt;/p&gt;&lt;/div&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What counts—and what does not?&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Proposed pilot definition:&lt;/strong&gt; use tasks where experts know at least one suitable resource exists in the catalogue. Count all attempted eligible tasks, including abandoned attempts. Check suitability against agreed task requirements; for example, the resource needs the right inputs and produces the needed output.&lt;/p&gt;&lt;p&gt;A five-minute limit is an example to agree with users, not a standard. Report requests with no suitable resource separately as coverage gaps. Establish a baseline and repeat comparable tasks after changes. The 80% above is invented arithmetic, not your past result or a required target.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;summary-part&quot; id=&quot;day12-more&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;C · Useful supporting words&lt;/p&gt;&lt;h3&gt;🎒 The small dictionary for follow-up questions&lt;/h3&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What kinds of things are in this project?&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Term&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Simple meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Tool / dataset / analytical model&lt;/td&gt;&lt;td&gt;Tool = software that performs a task. Dataset = a collection of data, such as a table. An analytical model represents a process or pattern using assumptions and rules; it may be implemented in a software tool.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;GitHub / CRAN / paper&lt;/td&gt;&lt;td&gt;GitHub hosts repositories such as code and documentation. CRAN distributes R packages. A published paper describes research and may link to code or data; the paper alone is not necessarily a runnable tool.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Repository / registry / marketplace&lt;/td&gt;&lt;td&gt;A repository stores resources or files; a registry records identities or entries; a marketplace helps users discover offerings and may support exchange. Products can overlap. This catalogue is a discovery index; “marketplace” does not necessarily mean buying and selling.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Listing vs publishing&lt;/td&gt;&lt;td&gt;A listing is an entry. Publishing is making an approved entry available to its intended audience. Agree which checks must pass first.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;People and the health domain&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Term&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Simple meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Epidemiologist&lt;/td&gt;&lt;td&gt;A person who studies patterns of health and disease in populations. In this project, a possible user who needs analytical resources.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Contributor / maintainer&lt;/td&gt;&lt;td&gt;Contributor supplies information or a resource. Maintainer keeps the underlying resource current. They may be different people.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Curator / reviewer&lt;/td&gt;&lt;td&gt;Curator looks after catalogue quality. Reviewer checks a submission or change; specialist questions may need a domain expert.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Domain expert&lt;/td&gt;&lt;td&gt;Someone who understands the subject deeply enough to assess its meaning and limitations. Metadata approval is not proof that a tool is suitable for every scientific use.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Quality, ownership and lifecycle&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Term&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Simple meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Version / revision&lt;/td&gt;&lt;td&gt;Version = a particular release of a tool or snapshot of data. A metadata revision can change the description without changing the tool.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Provenance&lt;/td&gt;&lt;td&gt;The trail showing where information came from and how it changed: source, date, extraction and review.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Licence vs access&lt;/td&gt;&lt;td&gt;Access: can I reach the resource? Licence: what am I allowed to do with it? Publicly visible does not automatically mean freely reusable.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Lifecycle&lt;/td&gt;&lt;td&gt;The states an item moves through: draft → review → published → updated → retired, with removal/restriction where necessary.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Retired / deprecated&lt;/td&gt;&lt;td&gt;No longer recommended for new use. Check dependent users, warn them and plan migration before ordinary removal. Removing a listing is different from deleting the underlying resource.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Relevance / suitability&lt;/td&gt;&lt;td&gt;Relevance: related to my question. Suitability: actually fits my task, inputs, constraints and permitted use.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Baseline / outcome&lt;/td&gt;&lt;td&gt;Baseline = the starting result for comparison. Outcome = the useful change for users. Publishing 500 cards is an output; helping users assess existing tools is an outcome.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;AI and delivery terms&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Term&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Simple meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;AI-suggested metadata&lt;/td&gt;&lt;td&gt;Pip drafts a description or tag from evidence. Suggested does not mean verified.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Human review&lt;/td&gt;&lt;td&gt;A person checks, edits or rejects the suggestion and records the decision.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Confidence threshold&lt;/td&gt;&lt;td&gt;A cut-off for deciding what may be automated. It needs evidence that the score predicts correctness; a model saying “95% sure” is not enough. Our proposed pilot uses human approval for AI-generated public descriptions and tags.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;AC / acceptance criteria&lt;/td&gt;&lt;td&gt;Observable conditions for acceptable behaviour. Example: missing licence information is flagged, never invented.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Reliability / latency&lt;/td&gt;&lt;td&gt;Reliability: how consistently the feature works as intended. Latency: how long a response takes. Agree how to test both.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sprint Goal / backlog&lt;/td&gt;&lt;td&gt;Sprint Goal = the useful result the team aims for in a Sprint. Backlog = ordered work to improve the product.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Wireframe&lt;/td&gt;&lt;td&gt;A rough picture for discussing a screen’s information and behaviour before polishing its design.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;text-small&quot;&gt;These recap Days 8–11. Follow the source links and fuller examples there when you need more depth.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-part&quot; id=&quot;day12-answers&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;D · Short answers to rehearse&lt;/p&gt;&lt;h3&gt;🎤 Concise answers focused on your decisions&lt;/h3&gt;&lt;p&gt;Aim for 30–45 seconds, then add one real example when asked. Lead with evidence and a recommendation, not a list of responsibilities. &lt;strong&gt;“I did” = your experience. “I would” = your proposed approach.&lt;/strong&gt; Your pasted notes confirm content review and team-lead approval; counts, time splits and specific project outcomes still need your facts.&lt;/p&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer1&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 1&lt;/p&gt;&lt;h4&gt;Career timeline&lt;/h4&gt;&lt;blockquote&gt;“I started as an Associate BA in software services in 2019, producing requirements, mock-ups and models. Since 2021, I have worked as a Senior Technical BA in banking: clarifying requirements, sequencing delivery across two teams and managing dependencies. I also facilitate Scrum events and support management routines. My contribution is turning unclear needs into delivery decisions.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Give your titles, dates and honest time split for each role. Explain one decision you supported, not a list of tools.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer2&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 2&lt;/p&gt;&lt;h4&gt;My closest catalogue-style experience&lt;/h4&gt;&lt;blockquote&gt;“My closest experience is our project knowledge library and dataset documentation. I reviewed whether information met the team’s needs, recommended updates and worked with reviewers; the team lead approved. For a catalogue, I would apply that discipline to consistent descriptions, ownership and review history, then add explicit listing rules and test whether users can find and assess resources.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Use your actual project name privately. You have not directly owned a catalogue product. Name one real document, the change you recommended, its approver and result; do not invent a listing count or taxonomy decision.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer3&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 3&lt;/p&gt;&lt;h4&gt;Classification and data model&lt;/h4&gt;&lt;blockquote&gt;“My API mapping and data-model work is the closest match. For this catalogue, I would agree field meanings and expected outputs with domain experts, test categories on sample items, and document exceptions. I would recommend the structure with evidence, then turn the agreed model into data rules and acceptance criteria.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; You have not owned a formal taxonomy. Explain what the expert validated, what you recommended and who approved.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer4&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 4&lt;/p&gt;&lt;h4&gt;How users find a suitable resource&lt;/h4&gt;&lt;blockquote&gt;“I would first clarify the output the user needs, their available data and mandatory constraints. Then I would compare candidate listings against those needs using evidence, marking mismatches and unknowns. If retrieval fails, I would inspect authorised logs with engineering. I would measure whether users can find and correctly assess a suitable resource, then check adoption separately.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Same topic does not mean same task. Your knowledge/dataset documentation and API mapping are the closest experience; a measured catalogue search improvement is not established. Day 10 E shows the complete journey.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer5&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 5&lt;/p&gt;&lt;h4&gt;Outdated tools and deprecation&lt;/h4&gt;&lt;blockquote&gt;“My current work involves keeping dataset knowledge current with reviewers. For an outdated catalogue tool, I would assess risk and who depends on its version. I would normally deprecate it, warn users and agree migration before removal. Serious risks could require immediate restriction under the agreed approval process.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Deprecate = discourage new use with a transition plan. Removal can break existing pipelines or references; check dependencies and approval first.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer6&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 6&lt;/p&gt;&lt;h4&gt;AI acceptance criteria&lt;/h4&gt;&lt;blockquote&gt;“I use AI in BA work. For a catalogue feature, I would ask experts to define correct, useful outputs, then write criteria for source support, missing facts, speed and failures. I would test repeated outputs against those examples and recommend release only when the agreed gates pass.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Using AI at work differs from owning a production AI feature. Expert-approved meaning matters even when the wording varies.&lt;/p&gt;&lt;/article&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;If they ask for the AI pass level&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“I do not have a historical production threshold to report. As a proposal, I would agree a rubric and held-out test set with experts. For example, we could require at least 95% of evaluated drafts to be useful and source-supported, block release for any observed critical unsupported claim, and check subgroup failures separately. The appropriate threshold depends on the risk and evidence.”&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;95% is an illustrative candidate, not an established standard or result. Day 11 Question 6 contains the full repeated-run, speed and reliability proposal.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer7&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 7&lt;/p&gt;&lt;h4&gt;Human review&lt;/h4&gt;&lt;blockquote&gt;“In my knowledge work, I review content and recommend changes; my team lead approves. For the catalogue pilot, I would use automatic format checks and human approval of AI-generated public metadata. Corrections would update the record and regression tests. Automatic acceptance would need validated evidence about error risk.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Expert checks meaning; curator checks the listing; the agreed decision owner approves. A model’s confidence statement is not enough.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer8&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 8&lt;/p&gt;&lt;h4&gt;Adopt, extend or build&lt;/h4&gt;&lt;blockquote&gt;“I would agree the user task and essential constraints, then compare an existing platform, extension and a new build using the same sample resources. I would include integration, curation, support and exit costs, and test whether a general AI assistant already serves the task. I would recommend an option with evidence and assumptions for the PO’s decision.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Your similar experience is technical requirements and integration trade-offs. Do not claim catalogue procurement ownership. Shorten the answer to the two options that are actually viable in the case.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer9&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 9&lt;/p&gt;&lt;h4&gt;Working with a UI/UX designer&lt;/h4&gt;&lt;blockquote&gt;“I created mock-ups and process flows in software-services work. For this catalogue, I would brief the designer on the user task, data, rules and failure states, then sketch an initial flow together. The designer explores the interaction and visual treatment; I keep requirements and acceptance criteria aligned. We validate the journey with users and engineering.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Name a screen you personally sketched and the requirement it clarified. BA scope includes low-fidelity wireframes here; it does not require claiming polished visual-design skills. See section H.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer10&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 10&lt;/p&gt;&lt;h4&gt;Facilitation&lt;/h4&gt;&lt;blockquote&gt;“In my banking project, I facilitate business, Product and Engineering discussions. In [real workshop], we needed to decide [issue]. I used [examples or model] to compare options, recorded [owner’s decision] and updated [backlog or specification]. For WHO, I would include practitioner feedback before finalising the recommendation.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; Name the decision, the conflicting evidence and the product change. A completed meeting is not itself the outcome.&lt;/p&gt;&lt;/article&gt;
&lt;article class=&quot;short-answer&quot; id=&quot;day12-answer11&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;Answer 11&lt;/p&gt;&lt;h4&gt;The catalogue case · short version&lt;/h4&gt;&lt;blockquote&gt;“I would start with one user task, the required output and available data. I would compare reuse, extension and build options, then propose a small discovery journey with evidence-backed listings and human review. Users should see why a resource fits, what remains unknown and how to try it. I would measure correct assessment and follow actual reuse separately.”&lt;/blockquote&gt;&lt;p class=&quot;memory-cue&quot;&gt;&lt;strong&gt;Remember:&lt;/strong&gt; EVIDENCE → OPTIONS → RECOMMENDATION → APPROVAL → CHECK. For example: a weekly chart tool may fit weekly totals; a daily forecasting model may not. The result is a justified choice, not just a click.&lt;/p&gt;&lt;/article&gt;
&lt;p&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;11&quot;&gt;Open Day 11 for detailed examples and follow-up questions&lt;/button&gt;&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;summary-part&quot; id=&quot;day12-case&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;E · The case, made simple&lt;/p&gt;&lt;h3&gt;🏘️ “We have 500 possible resources. Help Ben find a useful one.”&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;The problem:&lt;/strong&gt; people rebuild tools because they cannot find or judge existing ones. &lt;strong&gt;Your job:&lt;/strong&gt; help them discover what exists and decide whether it fits.&lt;/p&gt;
&lt;div class=&quot;summary-note&quot;&gt;&lt;strong&gt;What does the end user actually do?&lt;/strong&gt;&lt;br&gt;“I need [output] from [my data], within [constraints].” → find candidates → compare facts and evidence → choose or reject → follow the source and try → report the result.&lt;br&gt;&lt;strong&gt;Three different gates:&lt;/strong&gt; allowed to be listed ≠ suitable for this task ≠ successfully adopted. Missing facts mean “unknown”, not “yes”.&lt;/div&gt;
&lt;p&gt;&lt;button type=&quot;button&quot; class=&quot;review-day&quot; data-study-day=&quot;10&quot;&gt;Read Day 10 E · Ben chooses between three tools&lt;/button&gt;&lt;/p&gt;
&lt;div class=&quot;summary-cards&quot;&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🪪&lt;/span&gt;&lt;h4&gt;1. CARD · Describe it&lt;/h4&gt;&lt;p&gt;What is it? What does it do? What goes in and comes out? Where is the source? Who maintains it? Which version? Can I use it, and what are the limits?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🧑‍🏫&lt;/span&gt;&lt;h4&gt;2. CHECK · Review it&lt;/h4&gt;&lt;p&gt;AI drafts. A curator checks the facts. Experts handle scientific meaning or rights questions. Missing facts remain visible; they are not invented.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🔎&lt;/span&gt;&lt;h4&gt;3. FIND · Test success&lt;/h4&gt;&lt;p&gt;Ask users to find and assess a suitable resource. Count successful tasks out of all attempted eligible tasks—not just clicks.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🧱&lt;/span&gt;&lt;h4&gt;4. BUILD · Start small&lt;/h4&gt;&lt;p&gt;Compare reuse, buy and build first. Then deliver one whole journey: add → review → publish → search → assess. Test a small set before expanding.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;summary-note&quot;&gt;&lt;strong&gt;Why not just upload 500 links?&lt;/strong&gt; A link tells Ben where something is. A good card helps him decide whether it is useful and usable. Some links may also describe the same underlying tool.&lt;/div&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;A simple five-minute speaking plan&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Time&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Say this in your own words&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;0:00–0:30 · Problem&lt;/td&gt;&lt;td&gt;“People need to find and assess existing resources. I would confirm their main task and what the 500 source entries actually represent.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;0:30–1:40 · Card&lt;/td&gt;&lt;td&gt;“I would give each resource a clear name, purpose, source, owner, version, inputs, outputs, rights status and limitations. For datasets, I would also show relevant format, time and place coverage. Missing critical information stays in review.” Add the Weekly Picture Maker example.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;1:40–2:40 · Check&lt;/td&gt;&lt;td&gt;“AI can suggest a description, but a curator approves the public card. Scientific or rights questions go to specialists. We keep the source and review record, and allow manual entry when AI fails.” Explain a missing-licence example.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2:40–3:30 · Find&lt;/td&gt;&lt;td&gt;“My primary measure is how often users find and correctly assess a suitable resource within an agreed time. We establish a starting result and compare it after changes.” Use 8 of 10 = 80% only as an invented illustration.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3:30–4:40 · Build&lt;/td&gt;&lt;td&gt;“I would agree a small representative set and deliver the complete add, review, publish, search and assess journey. I would include simple filters and useful detail cards, and observe users trying it. Advanced AI search and automatic publication can wait.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;4:40–5:00 · Close&lt;/td&gt;&lt;td&gt;“This gives us a working journey and evidence about where users struggle. We can improve it and expand with confidence in the reviewed information.”&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;p class=&quot;text-small&quot;&gt;This is an outline with time budgets, not five minutes of text to read verbatim. Add one example to each point and rehearse aloud. Confirm team capacity and Sprint length before committing to quantities or dates.&lt;/p&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Four quick questions to check your understanding&lt;/summary&gt;&lt;div&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Try answering first&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Then check&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Is the catalogue the same as a dataset?&lt;/td&gt;&lt;td&gt;No. A dataset holds data. A catalogue holds descriptions and references to resources, which may include datasets.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;If the tool changes, what may need updating?&lt;/td&gt;&lt;td&gt;The version, inputs/outputs, requirements, limitations and other affected metadata. The change may require review before the listing is updated.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Does a taxonomy prove the content is correct?&lt;/td&gt;&lt;td&gt;No. It makes classification consistent. Evidence and appropriate review are still needed.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Can discovery improve while actual reuse stays low?&lt;/td&gt;&lt;td&gt;Yes. Users may find resources but encounter installation, permissions or suitability barriers. Follow actual reuse later to understand the wider outcome.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;summary-note&quot;&gt;&lt;strong&gt;Your final memory sentence:&lt;/strong&gt; “Clear cards, checked facts, easy finding, small first delivery.”&lt;/div&gt;
&lt;/div&gt;&lt;div class=&quot;summary-part&quot; id=&quot;day12-decisions&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;F · Make the decision visible&lt;/p&gt;&lt;h3&gt;🧭 Evidence → options → recommendation → approval → check&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Your project connection:&lt;/strong&gt; in your current banking project, you review knowledge and dataset documentation and recommend changes; the team lead approves. Bring that same clarity to the catalogue: explain what you found, what you recommended and who decided.&lt;/p&gt;&lt;div class=&quot;summary-note&quot;&gt;&lt;strong&gt;30-second answer pattern:&lt;/strong&gt; “In [project], I found [evidence]. I compared [options] against [user need/risk/cost]. I recommended [choice] because [reason]. [Owner] approved it. We checked [actual result].”&lt;br&gt;&lt;small&gt;If the decision has not happened, use “I would” and name the evidence you need.&lt;/small&gt;&lt;/div&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Decision in this JD&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Your BA contribution → decision owner&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;What to build, buy or extend&lt;/td&gt;&lt;td&gt;Gather evidence, cost options and recommend → WHO PO owns scope, priority and product direction; procurement/governance follows the applicable approval route.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What a valid domain output means&lt;/td&gt;&lt;td&gt;Structure questions, examples and acceptance criteria → domain expert validates meaning and limits; PO agrees product scope.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;How to implement and deliver it&lt;/td&gt;&lt;td&gt;Prepare stories, flows, data rules, sprint proposals and dependencies → engineering validates technical choices and feasibility; collaborate with design and report delivery to the PO.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;What can be listed or deprecated&lt;/td&gt;&lt;td&gt;Propose rules, impacts and transitions → agreed curator/content owner and relevant governance roles approve.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Q3 / Q4 · Investigate failed search using platform evidence&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Say:&lt;/strong&gt; “With authorised access, I would reproduce the query and filters, then inspect the search logs and the indexed record with engineering. I would separate a missing record, a vocabulary mismatch, an access restriction and a ranking or timeout issue. I would ask a domain expert to confirm expected results, recommend the smallest supported fix, and repeat the same user tasks.”&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Step&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Evidence → decision&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;1 · Reproduce&lt;/td&gt;&lt;td&gt;Record query, filters, user permission context and expected resource. Try the same journey. A hidden draft may be correct behaviour, not a search failure.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2 · Inspect logs&lt;/td&gt;&lt;td&gt;Capture an approved request ID, time, query/filter details, result IDs/ranks/count, latency, error and index version. Avoid unnecessary personal or health data in query logs. If logging is missing, first specify minimal instrumentation.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;3 · Follow the request&lt;/td&gt;&lt;td&gt;Does the approved record exist? Is it in the index? Is the index current? Are filters or permissions excluding it? Does it rank too low? Did the service fail?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;4 · Ask an expert&lt;/td&gt;&lt;td&gt;Have an epidemiologist identify suitable results and explain why. Validate synonyms and task relevance; do not let the log alone determine scientific meaning.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5 · Select the fix&lt;/td&gt;&lt;td&gt;Missing valid item → source/curate it. Stale index → engineering repair. Valid synonym → reviewed mapping. Wrong filter/ranking → adjust and test. Forbidden content → keep the access boundary.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;6 · Check the result&lt;/td&gt;&lt;td&gt;Replay representative queries and negative cases; compare successful discovery-and-assessment tasks before/after. Watch latency and failures. A log can show a click, not whether the tool fits.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Fictional example:&lt;/strong&gt; a published “influenza forecasting” tool exists, but searching “flu forecasting” returns nothing. Check indexing and filters first. If the evidence points to terminology, ask an expert to confirm the synonym, add that mapping and retest. Do not change the whole taxonomy or buy a new search engine before diagnosing the cause.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Q5 · Deprecation: warn and migrate before ordinary removal&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Say:&lt;/strong&gt; “I would check who depends on the affected version before removing anything. If it is outdated but can safely remain accessible, I would mark it deprecated, show the reason and replacement, and agree a migration plan with the owner. I would track known users and review readiness before removal. A serious risk may require immediate restriction.”&lt;/p&gt;&lt;div class=&quot;summary-cards&quot;&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;⚠️&lt;/span&gt;&lt;h4&gt;Deprecated&lt;/h4&gt;&lt;p&gt;Discourage new use; display the reason, affected version and next step.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🚚&lt;/span&gt;&lt;h4&gt;Migration&lt;/h4&gt;&lt;p&gt;Help existing users move; test the replacement and agree timing.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;⛔&lt;/span&gt;&lt;h4&gt;Removed or restricted&lt;/h4&gt;&lt;p&gt;Access changes under the approved policy; retain a permitted audit record.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Why not simply delete?&lt;/strong&gt; Users may pin a version, link to it in papers, or rely on it in a pipeline. Check dependent resources, saved items, subscriptions and owner knowledge; logs do not reveal every downstream user. Keep stable references and reproducibility evidence where safe and permitted.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Decision record:&lt;/strong&gt; affected version → severity → known dependencies → replacement/compatibility → owner → notice and review date → removal criteria → approval. Delay ordinary removal if dependencies are unresolved and continued access is acceptable. Restrict dangerous or impermissible access promptly through the incident process.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;Catalogue deprecation does not delete a third-party repository. &lt;a href=&quot;https://docs.pypi.org/project-management/yanking/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;PyPI’s non-destructive yanking mechanism&lt;/a&gt; is a related ecosystem example, not the same lifecycle policy as this proposed catalogue.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Expert feedback → domain-specific output → reusable library&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Say:&lt;/strong&gt; “I would ask the expert what decision the output supports, then agree the inputs, definitions and an example of a correct result. I would turn those into a data dictionary, decision rules and acceptance criteria. Engineering could test an existing Python library where it fits. We would compare its output with the expert-approved examples before recommending reuse or custom development.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Decision model&lt;/strong&gt; here means a small table of conditions and actions, not an ML prediction model.&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Condition&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Proposed rule → who validates it&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Required field missing&lt;/td&gt;&lt;td&gt;Flag it for review; never silently invent a value → BA and domain expert agree the business rule.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Repeated record&lt;/td&gt;&lt;td&gt;Apply an agreed identity rule before counting → expert defines whether these represent the same case/event.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Output differs from the agreed example&lt;/td&gt;&lt;td&gt;Inspect inputs, transformation and assumptions → engineer diagnoses; expert validates meaning.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Expert accepts the sample output&lt;/td&gt;&lt;td&gt;Record the approved rule, version and limits; add tests and broader cases → PO uses the evidence to decide the next increment.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Tiny synthetic example:&lt;/strong&gt; the agreed exercise is to count unique case IDs within a week and region. Input rows are A / week 1 / North, A / week 1 / North, and B / week 1 / North. If the expert confirms the repeated A is a duplicate, the expected output is &lt;strong&gt;North, week 1: 2&lt;/strong&gt;, not 3. Missing IDs must be flagged. This is an exercise rule, not a universal epidemiological counting method.&lt;/p&gt;&lt;p&gt;Engineering could prototype the agreed grouping using an existing library such as &lt;a href=&quot;https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.groupby.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;pandas&lt;/a&gt;. The library does not decide the case definition or prove the output scientifically valid. A small prototype is an evaluation step, not a promise to run models inside the catalogue. CRAN resources may use R; language is a fit constraint, not a reason to rewrite automatically.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Feedback loop:&lt;/strong&gt; show an example → ask what is wrong/missing → revise the rule → rerun → record the decision → update stories and criteria. Your role is to structure the decision and validation; do not claim Python implementation experience you have not had.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Build, buy, adopt or extend · a concise answer&lt;/summary&gt;&lt;div&gt;&lt;blockquote&gt;“I would first agree the essential user journey and constraints. Then I would compare buying or adopting an existing platform, extending an existing solution, and building the missing capability. I would test the same sample resources and user tasks, compare whole-life costs, time, integration and exit risks, and recommend the best fit to the PO. I would build only where the evidence justifies it.”&lt;/blockquote&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Option&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Check before recommending&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Buy / adopt&lt;/td&gt;&lt;td&gt;Does it meet essential requirements without costly workarounds? Check procurement, subscription/support, data control, interfaces, licence and export/exit terms. Open-source adoption also has operating costs.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Extend / integrate&lt;/td&gt;&lt;td&gt;Can existing infrastructure or a maintained library close the actual gap? Check upgrade compatibility, integration effort, ownership and upstream dependency risk.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Build&lt;/td&gt;&lt;td&gt;Is the unmet need distinctive enough to justify engineering, testing, hosting, support and future maintenance? Who owns it after the initial contract?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Baseline / do less&lt;/td&gt;&lt;td&gt;Could better metadata, an existing search service or an AI assistant already serve the task? Compare against that baseline before funding a new platform.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p&gt;&lt;strong&gt;Use one comparison sheet:&lt;/strong&gt; mandatory-fit gates first; then user-task performance, time to value, full cost, maintenance/curation, risks and reversibility. Agree criteria with the PO before scoring. A high weighted score must not hide failure of an essential access or data-control requirement.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Proof before commitment:&lt;/strong&gt; trial two realistic options on the same small source set, including missing information, review, access and export. Record assumptions and what evidence would change your recommendation. No named product is recommended without this evaluation.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;General option-appraisal reference: &lt;a href=&quot;https://www.gov.uk/guidance/define-your-purchasing-strategy&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GOV.UK purchasing guidance&lt;/a&gt;. This is useful reasoning, not WHO procurement policy.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Why is the return slow? ROI versus payback&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Say:&lt;/strong&gt; “I would check whether the delay comes from high setup or integration cost, slow adoption, ongoing curation, or benefits that were overestimated. I would compare the same time horizon and include running costs. Then I would test whether a smaller scope, reuse or staged rollout improves the case, and recommend proceed, revise or stop with the PO.”&lt;/p&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Term&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Simple meaning&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Total cost of ownership&lt;/td&gt;&lt;td&gt;Setup + integration + migration + training + hosting/licences + support/curation + upgrades + exit over the agreed horizon.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ROI&lt;/td&gt;&lt;td&gt;Return on investment: (benefits − total costs) ÷ total costs × 100, over a stated period and consistent units.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Payback period&lt;/td&gt;&lt;td&gt;How long until cumulative net benefits cover the initial investment. “Long ROI” usually means slow payback.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;measure-example&quot;&gt;&lt;p&gt;&lt;strong&gt;Invented, simplified money example:&lt;/strong&gt; setup costs 8,000; gross benefit is 1,000/month; running costs are 200/month.&lt;/p&gt;&lt;p&gt;Net benefit = 800/month → simple payback = 8,000 ÷ 800 = &lt;strong&gt;10 months after launch&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;Across 12 operating months: benefit 12,000; total cost 8,000 + 2,400 = 10,400 → ROI ≈ &lt;strong&gt;15.4%&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;If adoption halves the gross benefit to 500/month, net benefit falls to 300/month → payback becomes about &lt;strong&gt;26.7 months after launch&lt;/strong&gt;. Delivery delay pushes calendar payback further out.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;These figures are not a forecast and ignore discounting and ramp-up. For a real longer-term case, use the organisation’s approved appraisal method and sensitivity ranges. Time saved is capacity, not automatically cash savings; do not count avoided rebuilding and the same saved hours twice. For a public-health product, also assess mission value, equity, quality and risk reduction without inventing monetary values.&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;Reference for evidencing digital benefits and separating benefit types: &lt;a href=&quot;https://www.gov.uk/government/publications/digital-and-data-benefits-framework/digital-and-data-benefits-framework&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GOV.UK Digital and Data Benefits framework&lt;/a&gt;. The numbers above are an original teaching example.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;summary-part&quot; id=&quot;day12-live&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;G · Practise a live case&lt;/p&gt;&lt;h3&gt;⏱️ 15-minute live catalogue rehearsal&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Mock brief:&lt;/strong&gt; “We have 500 candidate source entries. Epidemiologists rebuild tools they cannot find or assess. There is an existing platform, limited delivery capacity and some outdated tools in active use. What would you do?”&lt;/p&gt;&lt;p class=&quot;text-small&quot;&gt;The existing-platform constraint and all evidence revealed below are invented interview practice, not facts about WHO’s current system. Your original five-minute presentation remains in section E. This exercise includes interaction within 15 minutes; it is not the same as a 15-minute prepared presentation. See Day 10 D for that separate outline and the assessment-source limits.&lt;/p&gt;&lt;div class=&quot;summary-cards&quot;&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🔍&lt;/span&gt;&lt;h4&gt;Ask + investigate&lt;/h4&gt;&lt;p&gt;Which user decision is failing, and what evidence explains it?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;⚖️&lt;/span&gt;&lt;h4&gt;Compare + recommend&lt;/h4&gt;&lt;p&gt;What are the feasible options, who validates them, and why choose one?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🧪&lt;/span&gt;&lt;h4&gt;Deliver + learn&lt;/h4&gt;&lt;p&gt;What small result will test the recommendation?&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Time&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Speak / sketch / decide&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;0–2 min · clarify&lt;/td&gt;&lt;td&gt;Ask who the first user is, the task, expected output, existing platform, review capacity and constraints. Confirm whether 500 means unique resources or source entries.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;2–5 min · investigate&lt;/td&gt;&lt;td&gt;Sketch query → filters → indexed record → detail → assessment. Ask for logs and one failed task; ask the expert what should have appeared and why.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;5–8 min · compare&lt;/td&gt;&lt;td&gt;Compare improve/adopt, extend and build against the task, full cost, time and risks. Recommend a reversible next step; state what could change the choice.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;8–11 min · define the first increment&lt;/td&gt;&lt;td&gt;Sketch source → draft card → expert/curator review → published listing → search → assessment. Include missing facts, permission boundaries and deprecation.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11–13 min · validate&lt;/td&gt;&lt;td&gt;Agree one user-success measure and expert-reviewed examples. Check cost assumptions, review throughput and manual fallback.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;13–15 min · conclude and handle challenges&lt;/td&gt;&lt;td&gt;Give the recommendation, evidence, trade-off, owner and next test. Respond to one new constraint without defending an outdated assumption.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Live example · reveal evidence, then change your decision&lt;/summary&gt;&lt;div&gt;&lt;p&gt;&lt;strong&gt;Pause at each step and answer aloud before reading the suggested response.&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;live-step&quot;&gt;&lt;h4&gt;1 · Interviewer: “A relevant tool is already indexed.”&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;You:&lt;/strong&gt; “I would reproduce the failed query with the same filters and permissions. Is the result absent, too low in the list, or present but hard to assess?”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;New evidence:&lt;/strong&gt; “Flu forecasting” gives zero results; “influenza forecasting” finds the approved tool. The expert confirms the terms are equivalent for this task.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Decision:&lt;/strong&gt; recommend a reviewed synonym mapping and repeat representative queries first. The evidence does not yet justify replacing the platform.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;live-step&quot;&gt;&lt;h4&gt;2 · Interviewer: “The tool was found, but its output is unclear.”&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;You:&lt;/strong&gt; “I would ask the epidemiologist to define the decision, required inputs, expected output and limitations. We would add those to the card and test whether another user can judge suitability.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Decision:&lt;/strong&gt; improve the metadata and validate with users. If a sample output is needed, ask engineering to assess an existing library/tool using synthetic or authorised data, with expert-reviewed expected results.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;live-step&quot;&gt;&lt;h4&gt;3 · Interviewer: “Buy a new platform or write our own?”&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;You:&lt;/strong&gt; “First I would see whether the current platform supports the missing mapping, review and metadata needs. I would trial that against a viable off-the-shelf option on the same tasks, compare whole-life costs and exit constraints, then recommend. I would build the gap only if essential requirements still fail.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Decision:&lt;/strong&gt; conditional reuse/extension recommendation, subject to technical and governance checks—not a blanket promise that reuse is cheapest.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;live-step&quot;&gt;&lt;h4&gt;4 · Interviewer: “An old version is used in several pipelines.”&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;You:&lt;/strong&gt; “I would assess severity and dependencies before removal. If continued access is acceptable, mark the version deprecated, notify known users and agree a tested replacement and migration review date. Restrict it immediately if the assessed risk requires that.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Decision:&lt;/strong&gt; managed deprecation, with approved removal conditions and an explicit exception for urgent risk.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;live-step&quot;&gt;&lt;h4&gt;5 · Interviewer: “The estimated payback is too long.”&lt;/h4&gt;&lt;p&gt;&lt;strong&gt;You:&lt;/strong&gt; “I would check setup, integration and recurring review costs, plus the adoption and savings assumptions. Then compare a smaller pilot and staged reuse against the same baseline. If the benefits still do not justify the cost and mission trade-offs, I would recommend revising or stopping that option.”&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Decision:&lt;/strong&gt; an evidence-based go / revise / stop recommendation for the PO, not a fabricated positive ROI.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Your 30-second closing recommendation&lt;/summary&gt;&lt;div&gt;&lt;blockquote&gt;“Based on the evidence in this exercise, I recommend first testing a reviewed synonym mapping and clearer resource cards on the existing platform. I would verify technical fit and cost before committing, involve an epidemiologist in expected-result checks, and manage old versions through deprecation and migration. The first increment should let users find and assess a reviewed resource. We will measure task success and review effort, then the PO can decide whether to extend, buy or build more.”&lt;/blockquote&gt;&lt;p&gt;&lt;strong&gt;Score yourself:&lt;/strong&gt; Did I ask for evidence? Compare options? Use expert feedback? Identify the decision owner? Name a measurable next step? If one is missing, improve that part rather than add more jargon.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;summary-part&quot; id=&quot;day12-design&quot;&gt;&lt;p class=&quot;summary-kicker&quot;&gt;H · Work with design, keep your BA scope clear&lt;/p&gt;&lt;h3&gt;✏️ You explain the need; you shape and test the picture together&lt;/h3&gt;
&lt;div class=&quot;summary-cards&quot;&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🧭&lt;/span&gt;&lt;h4&gt;BA: meaning + behaviour&lt;/h4&gt;&lt;p&gt;User task, evidence, data, business rules, permissions, acceptance criteria and a rough screen.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;summary-card&quot;&gt;&lt;span class=&quot;summary-icon&quot; aria-hidden=&quot;true&quot;&gt;🎨&lt;/span&gt;&lt;h4&gt;Designer: experience + interface&lt;/h4&gt;&lt;p&gt;Research and design expertise, interaction alternatives, accessible presentation and the project design system.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;At the catalogue comparison screen&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;A practical collaboration&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;You bring&lt;/td&gt;&lt;td&gt;“Users must assess inputs, outputs, version, rights, limitations and review status. Missing facts must stay visible.”&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;You sketch together&lt;/td&gt;&lt;td&gt;Search → results → compare → details → source. Include empty results, unavailable sources, unreviewed drafts and deprecated versions.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Designer explores&lt;/td&gt;&lt;td&gt;“Could a comparison view or detail-first flow make these differences clearer?” Let the designer test layout and interaction options.&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;You validate together&lt;/td&gt;&lt;td&gt;Observe a practitioner choosing a suitable tool; ask why it fits. Experts check meaning, engineers check feasibility, and you turn findings into rules and UAT.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;details class=&quot;summary-detail&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;One example you can explain aloud&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“If a sketch hides that one tool needs daily data, a user with weekly data could choose wrongly. I would make input frequency an explicit requirement with source evidence or an unknown state. I would ask the designer to explore how to show it clearly, test the journey with users and update the acceptance criteria.”&lt;/p&gt;&lt;p&gt;This is a proposed catalogue example. For your past experience, substitute a real field or missing state your own mock-up exposed.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;summary-note&quot;&gt;&lt;strong&gt;PO / SM · keep this to 20 seconds:&lt;/strong&gt; “The WHO PO owns scope, priority and product direction. I run requirements and day-to-day delivery coordination within that direction, working with designers and engineers and facilitating agreed events. I make recommendations and surface risks rather than claim every decision.”&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;Your interview boundary:&lt;/strong&gt; “I can create rough wireframes and design-ready requirements. I collaborate on user research and validation, rely on design specialists for design craft, and stay involved through build and UAT.”&lt;/p&gt;
&lt;p class=&quot;text-small&quot;&gt;The supplied JD expressly includes BA wireframing and joint work with the Senior UX/UI Designer. See Day 11 Question 9 for the detailed brief. For WHO source checks and the unverified “Layer 4” label, see Day 8 D; for assessment formats, see Day 10 D.&lt;/p&gt;&lt;/div&gt;&lt;label class=&quot;form-check finish&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-done=&quot;12&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;I can explain the project simply and rehearse my answers honestly.&lt;/span&gt;&lt;/label&gt;&lt;/section&gt;
  &lt;hr&gt;

      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      &lt;button type=&quot;button&quot; class=&quot;viz-carousel-previous cursor-interaction&quot;&gt;&lt;i data-lucide=&quot;chevron-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;

            &lt;path d=&quot;M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z&quot; fill=&quot;currentColor&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;0.6&quot; /&gt;

      const next = controls.querySelector(&quot;.viz-carousel-next&quot;);

        choice.className = &quot;cursor-interaction&quot;;

        name.textContent = panels[active].dataset.variant;

        mousePointerId = null;

          status.textContent = `${count.textContent}: ${name.textContent}`;

      previous.addEventListener(&quot;click&quot;, () =&gt;
        select((active + panels.length - 1) % panels.length),

      next.addEventListener(&quot;click&quot;, () =&gt;
        select((active + 1) % panels.length),
      );
      picker.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key === &quot;Escape&quot; &amp;&amp; picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === &quot;ArrowDown&quot;) {
          nextIndex = index &lt; 0 ? active : (index + 1) % choices.length;
        } else if (event.key === &quot;ArrowUp&quot;) {
          nextIndex = index &lt; 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open &amp;&amp; event.key === &quot;Home&quot;) {
          nextIndex = 0;
        } else if (picker.open &amp;&amp; event.key === &quot;End&quot;) {

        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();

      picker.addEventListener(&quot;focusout&quot;, (event) =&gt; {

        mousePointerId = null;

        &quot;pagehide&quot;,
        () =&gt; {

          document.removeEventListener(&quot;pointercancel&quot;, endPointerSelection);
          window.removeEventListener(&quot;blur&quot;, endPointerSelection);
          window.removeEventListener(&quot;resize&quot;, sizePicker);

        { once: true },
